<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EDF0E8">
<meta name="mobile-web-app-capable" content="yes">
<title>Menu de la semaine</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --papier: #EDF0E8;
  --carte: #FCFDFA;
  --encre: #1B2119;
  --encre2: #5A6455;
  --trait: #D2D8C8;
  --poireau: #2F6B3F;
  --prune: #6E2D46;
  --ocre: #8A6410;
  --r: 10px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--papier);
  color: var(--encre);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overscroll-behavior: none;
}

#app { display: flex; flex-direction: column; height: 100%; }

/* ---------- en-tête ---------- */
header {
  flex: 0 0 auto;
  padding: 14px 16px 10px;
  background: var(--papier);
  border-bottom: 1px solid var(--trait);
  padding-top: max(14px, env(safe-area-inset-top));
}
.titre { font-size: 15px; font-weight: 700; letter-spacing: .01em; margin: 0 0 6px; }
.nav-semaine { display: flex; align-items: baseline; gap: 10px; }
.nav-semaine button {
  border: 1px solid var(--trait); background: var(--carte); color: var(--encre);
  width: 34px; height: 34px; border-radius: 50%; font-size: 17px; line-height: 1;
  cursor: pointer; flex: 0 0 auto;
}
.nav-semaine button:active { background: var(--trait); }
.nav-txt { flex: 1 1 auto; min-width: 0; }
#periode { display: block; font-size: 19px; font-weight: 700; }
#relatif { display: block; font-size: 13px; color: var(--encre2); }

/* ---------- corps ---------- */
#vue {
  flex: 1 1 auto; overflow-y: auto;
  padding: 14px 16px 28px;
  -webkit-overflow-scrolling: touch;
}

h2, h3 { margin: 20px 0 8px; }
h3 { font-size: 14px; font-weight: 700; color: var(--encre2); }
.fiche-titre { font-size: 24px; line-height: 1.2; margin: 6px 0 4px; }
.petit { font-size: 13px; color: var(--encre2); }
.centre { text-align: center; margin-top: 18px; }

.barre { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.cta, .cta-secondaire {
  flex: 1 1 auto; min-height: 46px; padding: 11px 16px;
  border-radius: var(--r); font-size: 15px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent;
}
.cta { background: var(--poireau); color: #fff; }
.cta:active { filter: brightness(0.88); }
.cta-secondaire { background: var(--carte); color: var(--encre); border-color: var(--trait); }
.cta-secondaire:active { background: var(--trait); }
.danger { color: var(--prune); }

.note {
  background: var(--note); border-left: 3px solid var(--ocre);
  padding: 10px 12px; border-radius: 0 var(--r) var(--r) 0;
  font-size: 13px; margin-bottom: 16px;
}
.vide { padding: 34px 6px; color: var(--encre2); }
.vide p { margin: 0 0 8px; }

/* ---------- séances de cuisine ---------- */
.resume { margin-bottom: 22px; }
.seance {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 0; border-bottom: 1px solid var(--trait); cursor: pointer;
}
.seance:last-child { border-bottom: none; }
.pastille { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; flex: 0 0 auto; }
.seance-txt { min-width: 0; }
.seance-txt strong { text-transform: none; }

/* ---------- grille des repas ---------- */
.jour { margin-bottom: 16px; }
.jour-entete {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 5px; border-bottom: 1px solid var(--trait); margin-bottom: 6px;
}
.jour-nom { font-weight: 700; font-size: 15px; }
.jour-date { font-size: 13px; color: var(--encre2); }

.repas {
  display: flex; align-items: flex-start; gap: 11px;
  background: var(--carte);
  border: 1px solid var(--trait);
  border-left: 4px solid var(--trait);
  border-radius: 4px var(--r) var(--r) 4px;
  padding: 10px 12px; margin-bottom: 5px;
}
.repas.cliquable { cursor: pointer; }
.repas.cliquable:active { background: var(--survol); }
.repas-quand { flex: 0 0 38px; font-size: 12px; color: var(--encre2); padding-top: 2px; }
.repas-corps { min-width: 0; flex: 1 1 auto; }
.repas-nom { font-weight: 600; line-height: 1.3; }
.repas-meta { font-size: 12px; color: var(--encre2); margin-top: 1px; }
.repas.cuisson .repas-meta { color: var(--poireau); font-weight: 600; }
.repas-vide { color: var(--encre2); }

/* ---------- courses ---------- */
.rayon { margin-bottom: 20px; }
.rayon h3 {
  margin: 0 0 6px; padding-bottom: 5px;
  border-bottom: 2px solid var(--encre); color: var(--encre); font-size: 15px;
}
.article {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 2px; border-bottom: 1px solid var(--trait); cursor: pointer;
}
.case {
  flex: 0 0 24px; height: 24px; border: 1.5px solid var(--encre2);
  border-radius: 5px; display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #fff; line-height: 1;
}
.article.coche .case { background: var(--poireau); border-color: var(--poireau); }
.article-txt { flex: 1 1 auto; display: flex; justify-content: space-between; gap: 12px; min-width: 0; }
.article-nom { min-width: 0; }
.article-qte { color: var(--encre2); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.article.coche .article-txt { text-decoration: line-through; opacity: .45; }

/* ---------- recettes ---------- */
.recette {
  padding: 12px 2px; border-bottom: 1px solid var(--trait); cursor: pointer;
}
.recette.off { opacity: .45; }
.recette-nom { font-weight: 600; }
.retour { background: none; border: none; color: var(--poireau); font-size: 15px; padding: 4px 0; cursor: pointer; }

.ing-liste { border-top: 1px solid var(--trait); }
.ing {
  display: flex; justify-content: space-between; gap: 14px;
  padding: 9px 2px; border-bottom: 1px solid var(--trait);
}
.ing-qte { color: var(--encre2); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.etapes { padding-left: 20px; margin: 8px 0 0; }
.etapes li { margin-bottom: 10px; }

/* ---------- réglages ---------- */
.bloc { margin-bottom: 26px; }
.bloc h3 { margin-top: 0; }
.champ { margin-top: 8px; }
.champ label { display: block; font-size: 14px; margin-bottom: 5px; }
.champ-texte {
  width: 100%; padding: 11px 12px; margin-top: 6px;
  border: 1px solid var(--trait); border-radius: var(--r);
  background: var(--carte); color: var(--encre);
  font-family: inherit; font-size: 15px;
}
textarea.champ-texte { min-height: 76px; resize: vertical; }
.moments { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  padding: 8px 11px; border-radius: 999px; font-size: 13px; cursor: pointer;
  border: 1px solid var(--trait); background: var(--carte); color: var(--encre2);
}
.chip.on { background: var(--poireau); border-color: var(--poireau); color: #fff; font-weight: 600; }

/* ---------- modale ---------- */
#modale {
  position: fixed; inset: 0; background: rgba(27,33,25,.5);
  display: none; align-items: flex-end; justify-content: center; z-index: 40;
}
#modale.ouverte { display: flex; }
.modale-carte {
  background: var(--papier); width: 100%; max-height: 88%;
  overflow-y: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  border-radius: 16px 16px 0 0;
}
.modale-carte h3 { margin-top: 0; color: var(--encre); font-size: 17px; }
.editeur {
  width: 100%; min-height: 300px; padding: 11px;
  border: 1px solid var(--trait); border-radius: var(--r);
  background: var(--carte); color: var(--encre);
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12.5px;
}

/* ---------- onglets ---------- */
nav {
  flex: 0 0 auto; display: flex;
  background: var(--carte); border-top: 1px solid var(--trait);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1 1 0; padding: 11px 4px 13px; background: none; border: none;
  font-family: inherit; font-size: 12.5px; color: var(--encre2); cursor: pointer;
  border-top: 2px solid transparent; margin-top: -1px;
}
.tab.actif { color: var(--poireau); font-weight: 700; border-top-color: var(--poireau); }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(12px);
  background: var(--encre); color: var(--papier);
  padding: 11px 16px; border-radius: var(--r); font-size: 14px;
  max-width: 88%; text-align: center; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 50;
}
#toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
:focus-visible { outline: 2px solid var(--poireau); outline-offset: 2px; }

.repas-extra { font-size: 12px; font-weight: 600; margin-top: 3px; }

/* ---------- v2 : convives, quiz, feuilles ---------- */
.jour-droite { display: flex; align-items: baseline; gap: 10px; }
.mini {
  background: none; border: none; font-family: inherit; font-size: 12px;
  color: var(--poireau); cursor: pointer; padding: 2px 0; text-decoration: underline;
}
.badge {
  flex: 0 0 auto; align-self: center; background: var(--prune); color: #fff;
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.repas.restes { background: var(--survol); border-style: dashed; border-left-style: solid; }
.repas.restes .repas-meta { color: var(--prune); font-weight: 600; }
.note.cliquable { cursor: pointer; }

.stepper { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
.stepper-label { flex: 1 1 auto; font-size: 14px; }
.stepper-val { font-size: 22px; font-weight: 700; min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; }
.rond {
  width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
  border: 1px solid var(--trait); background: var(--carte); color: var(--encre);
  font-size: 22px; line-height: 1; cursor: pointer;
}
.rond:active { background: var(--trait); }
.feuille-plat { font-size: 19px; font-weight: 700; margin: 2px 0 4px; }
.modale-carte .cta, .modale-carte .cta-secondaire { width: 100%; margin-top: 8px; }

.quiz-haut { display: flex; justify-content: space-between; align-items: center; }
.jauge { height: 4px; background: var(--trait); border-radius: 2px; margin: 10px 0 26px; overflow: hidden; }
.jauge-in { height: 100%; background: var(--poireau); transition: width .2s; }
.quiz-q { font-size: 22px; line-height: 1.25; margin: 0 0 22px; max-width: 22em; }
.quiz-o {
  display: block; width: 100%; text-align: left; margin-bottom: 10px;
  padding: 16px 18px; font-family: inherit; font-size: 16px; cursor: pointer;
  background: var(--carte); color: var(--encre);
  border: 1px solid var(--trait); border-radius: var(--r);
}
.quiz-o:active { background: var(--trait); }
.quiz-o.actif { border-color: var(--poireau); border-width: 2px; font-weight: 600; }
.cta-secondaire.actif { border-color: var(--poireau); border-width: 2px; color: var(--poireau); font-weight: 700; }

.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { padding: 6px 11px; border-radius: 999px; font-size: 13px; border: 1px solid; }
.puce.plus { color: var(--poireau); border-color: var(--poireau); background: var(--tonPlus); }
.puce.moins { color: var(--prune); border-color: var(--prune); background: var(--tonMoins); }
.consequence { color: var(--poireau); font-weight: 600; margin-top: 8px; }

/* ---------- v3 : desserts, budget, notes ---------- */
.stats { display: flex; gap: 8px; margin: 4px 0 18px; }
.stat {
  flex: 1 1 0; background: var(--carte); border: 1px solid var(--trait);
  border-radius: var(--r); padding: 10px 8px; text-align: center; min-width: 0;
}
.stat strong { display: block; font-size: 17px; line-height: 1.2; }
.stat .petit { display: block; font-size: 11px; line-height: 1.25; margin-top: 3px; }

.repas.dessert { background: var(--note); border-left-color: var(--ocre); }
.repas.dessert .repas-quand { color: var(--ocre); font-weight: 600; }

.etoiles { display: flex; gap: 2px; margin-top: 4px; }
.etoile {
  background: none; border: none; padding: 3px 4px; font-size: 19px; line-height: 1;
  color: var(--trait); cursor: pointer;
}
.etoile.on { color: var(--ocre); }
.bloc-noter {
  background: var(--carte); border: 1px solid var(--trait);
  border-radius: var(--r); padding: 12px 14px; margin-bottom: 18px;
}
.bloc-noter h3 { margin: 0 0 8px; }
.noter-ligne { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; }
.noter-nom { font-size: 14px; min-width: 0; }

.jauge-budget { height: 8px; background: var(--trait); border-radius: 4px; overflow: hidden; margin: 6px 0 16px; }
.jauge-budget.grande { height: 12px; border-radius: 6px; margin-bottom: 18px; }
.jauge-budget .jauge-in { background: var(--poireau); height: 100%; }
.jauge-budget .jauge-in.depasse { background: var(--prune); }
.ligne-cout { display: flex; align-items: baseline; gap: 6px; }
.ligne-cout strong { font-size: 21px; }

.rayon-cout { float: right; font-weight: 400; color: var(--encre2); font-size: 13px; }
.article-droite { display: flex; flex-direction: column; align-items: flex-end; flex: 0 0 auto; }
.article-prix { font-size: 11px; color: var(--encre2); font-variant-numeric: tabular-nums; }

.ligne-semaine {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 2px; border-bottom: 1px solid var(--trait); cursor: pointer;
}
.ligne-semaine.ici { font-weight: 600; }
.ligne-semaine strong { font-variant-numeric: tabular-nums; }

.quiz-section { font-size: 12px; color: var(--encre2); margin-bottom: 6px; }
.recette-nom { cursor: pointer; }


/* ---------- v4 : densités et thèmes sombres ---------- */
body.d-compact { font-size: 15px; }
body.d-compact #vue { padding: 10px 12px 22px; }
body.d-compact .repas { padding: 7px 10px; margin-bottom: 4px; }
body.d-compact .article { padding: 9px 2px; }
body.d-compact .jour { margin-bottom: 11px; }
body.d-compact h2, body.d-compact h3 { margin: 14px 0 6px; }
body.d-compact .quiz-q { font-size: 19px; }
body.d-compact .quiz-o { padding: 12px 14px; }

body.d-large { font-size: 18px; }
body.d-large #vue { padding: 18px 18px 34px; }
body.d-large .repas { padding: 14px 15px; }
body.d-large .article { padding: 16px 2px; }
body.d-large .petit { font-size: 15px; }
body.d-large .repas-meta, body.d-large .article-prix { font-size: 14px; }
body.d-large .quiz-o { padding: 19px 20px; font-size: 17px; }
body.d-large .tab { font-size: 13.5px; }

body.sombre .cta { color: #14171A; }
body.sombre .badge { color: #14171A; }
body.sombre .article.coche .case { color: #14171A; }
body.sombre #modale { background: rgba(0,0,0,.62); }
body.sombre #toast { background: var(--carte); color: var(--encre); border: 1px solid var(--trait); }
body.sombre .rayon h3 { border-bottom-color: var(--encre2); }

/* ---------- v4.1 : marqueur alcool ---------- */
.tag-alcool {
  flex: 0 0 auto; align-self: center; white-space: nowrap;
  background: var(--tonMoins); color: var(--prune); border: 1px solid var(--prune);
  font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
}
.chip.petit-chip { font-size: 12px; padding: 7px 9px; }

/* ---------- v5 : photos, icônes, origine, minuteurs ---------- */
.photo-zone { margin: 6px 0 10px; }
.photo { width: 100%; max-height: 230px; object-fit: cover; border-radius: var(--r); display: block; }
.photo-vide {
  height: 110px; display: flex; align-items: center; justify-content: center;
  background: var(--carte); border: 1px dashed var(--trait); border-radius: var(--r); color: var(--encre2);
}

.ic { display: inline-flex; align-items: center; color: var(--encre2); flex: 0 0 auto; }
.ic-plat { align-self: center; color: var(--encre2); }
.ing-gauche { display: flex; align-items: center; gap: 9px; min-width: 0; }
.ing-gauche .ing-nom, .ing-gauche .article-nom { min-width: 0; }
.avec-icone { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
.avec-icone-txt { flex: 1 1 auto; min-width: 0; }

.repliable {
  border: 1px solid var(--trait); border-radius: var(--r);
  background: var(--carte); margin: 14px 0; overflow: hidden;
}
.repliable > summary {
  padding: 12px 14px; cursor: pointer; font-weight: 600; font-size: 14px;
  list-style: none; display: flex; justify-content: space-between; align-items: center;
}
.repliable > summary::-webkit-details-marker { display: none; }
.repliable > summary::after { content: "+"; font-size: 19px; color: var(--encre2); font-weight: 400; }
.repliable[open] > summary::after { content: "−"; }
.repliable-corps { padding: 0 14px 14px; font-size: 14.5px; line-height: 1.5; }
.repliable-corps p { margin: 0; }
.repliable-corps .recette-nom { margin-top: 10px; font-size: 13px; }

.chrono {
  display: inline-block; margin: 6px 8px 0 0; padding: 5px 11px;
  border: 1px solid var(--poireau); color: var(--poireau); background: var(--tonPlus);
  border-radius: 999px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
}

#minuteurs { display: none; flex-direction: column; gap: 1px; background: var(--trait); flex: 0 0 auto; }
#minuteurs.visible { display: flex; }
.minuteur {
  display: flex; align-items: center; gap: 10px;
  background: var(--poireau); color: #fff; padding: 8px 14px;
}
body.sombre .minuteur { color: #14171A; }
.minuteur-nom { flex: 1 1 auto; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.minuteur-temps { font-variant-numeric: tabular-nums; font-size: 16px; }
.minuteur-stop {
  background: none; border: none; color: inherit; font-size: 20px; line-height: 1;
  padding: 0 2px; cursor: pointer; opacity: .8;
}

/* ---------- v6 : saison ---------- */
.tag-saison {
  flex: 0 0 auto; white-space: nowrap; margin-left: 6px;
  background: var(--tonMoins); color: var(--prune);
  font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px;
}
.petit.vert { color: var(--poireau); font-weight: 600; }
.petit.prune { color: var(--prune); font-weight: 600; }

/* ---------- v7 : d'où vient un article ---------- */
.article-bloc { border-bottom: 1px solid var(--trait); }
.article-bloc .article { border-bottom: none; }
.chevron {
  flex: 0 0 32px; height: 32px; margin-left: 4px;
  background: none; border: 1px solid var(--trait); border-radius: 8px;
  color: var(--encre2); font-size: 17px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.chevron.ouvert { border-color: var(--poireau); color: var(--poireau); }
.origines {
  padding: 4px 0 12px 36px; margin-bottom: 4px;
  border-left: 2px solid var(--trait); margin-left: 11px;
}
.origines-titre { font-size: 11.5px; font-weight: 700; color: var(--encre2); margin-bottom: 4px; }
.origine { display: flex; align-items: center; gap: 9px; padding: 6px 0; cursor: pointer; }
.origine-txt { flex: 1 1 auto; min-width: 0; }
.origine-nom { font-size: 14px; line-height: 1.25; }
.origine-qte { flex: 0 0 auto; font-size: 13px; color: var(--encre2); font-variant-numeric: tabular-nums; }
.origines-reste { font-size: 12px; color: var(--ocre); font-weight: 600; margin-top: 6px; }

/* ---------- v8 : import et relecture ---------- */
.proposition { border: 1px solid var(--trait); border-radius: var(--r); margin-bottom: 10px; background: var(--carte); }
.proposition.gardee { border-color: var(--poireau); }
.prop-tete { display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; cursor: pointer; }
.proposition.gardee .prop-tete .case { background: var(--poireau); border-color: var(--poireau); }
.prop-txt { flex: 1 1 auto; min-width: 0; }
.prop-avis { font-size: 12px; color: var(--ocre); font-weight: 600; margin-top: 4px; }
.proposition .repliable { margin: 0; border: none; border-top: 1px solid var(--trait); border-radius: 0; }
.modale-carte .editeur + .champ-texte { margin-top: 8px; }

.recherche { margin-bottom: 10px; }

/* ---------- v9 : repas sauté ---------- */
.repas.saute { opacity: .45; border-left-color: var(--trait) !important; border-style: dashed; }
.repas.saute .repas-nom { text-decoration: line-through; }
.repas.saute .repas-meta { color: var(--prune); font-weight: 600; text-decoration: none; }
.repas.saute .ic-plat { opacity: .5; }

</style>
</head>
<body>
<div id="app">

  <header>
    <p class="titre">Menu de la semaine</p>
    <div class="nav-semaine">
      <button id="prec" aria-label="Semaine précédente">‹</button>
      <div class="nav-txt">
        <span id="periode"></span>
        <span id="relatif"></span>
      </div>

const VERS_KG = { g: 0.001, "c.à.s": 0.012, "c.à.c": 0.004, pincée: 0.0005 };
const VERS_L  = { ml: 0.001, cl: 0.01, "c.à.s": 0.015, "c.à.c": 0.005 };

function coutIngredient(ing, enseigne) {
  const p = PRIX[ing.n.toLowerCase()] || PRIX[ing.n];
  const facteurEnseigne = (ENSEIGNES[enseigne] || ENSEIGNES.carrefour).f[ing.r] || 1;
  if (!p) {
    // repli : on suppose une portion de 150 g au prix moyen du rayon
    const base = PRIX_DEFAUT[ing.r] || 5;
    const kg = VERS_KG[ing.u] !== undefined ? ing.q * VERS_KG[ing.u] : 0.15 * ing.q;
    return kg * base * facteurEnseigne;
  }
  let q;
  if (p.u === "kg") q = VERS_KG[ing.u] !== undefined ? ing.q * VERS_KG[ing.u] : ing.q * 0.15;
  else if (p.u === "l") q = VERS_L[ing.u] !== undefined ? ing.q * VERS_L[ing.u] : ing.q * 0.15;
  else q = ing.q;   // prix à la pièce
  return q * p.p * facteurEnseigne;
}

function appliquerTheme() {
  const t = THEMES[state.reglages.theme] || THEMES.potager;
  const r = document.documentElement;
  for (const [k, v] of Object.entries(t.v)) r.style.setProperty("--" + k, v);
  document.body.className = "d-" + (state.reglages.densite || "normal") + (t.sombre ? " sombre" : "");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t.v.papier);
}

// une recette passe-t-elle les régimes, les ingrédients évités et les cuisines retenues ?
function autorisee(r) {
  const g = state.reglages;
  for (const k of (g.regimes || [])) {
    const R = REGIMES[k];
    if (!R) continue;
    if (R.test && !R.test(r)) return false;
    if (R.bases && R.bases.indexOf(r.base) >= 0) return false;
    if (R.ing && r.ing.some(i => R.ing.indexOf(i.n.toLowerCase()) >= 0)) return false;
  }
  const evites = (g.evites || []).map(s => s.toLowerCase()).filter(Boolean);
  if (evites.length && r.ing.some(i => evites.some(e => i.n.toLowerCase().indexOf(e) >= 0))) return false;
  const off = g.cuisinesOff || [];
  if ((r.categorie || "plat") !== "dessert" && off.indexOf(r.cuisine) >= 0) return false;
  return true;
}

// pool réellement utilisable ; cat vaut "plat", "dessert" ou rien pour tout
function poolActif(cat) {
  return state.recettes.filter(x => !x.desactive && autorisee(x) &&
    (!cat || (x.categorie || "plat") === cat));
}

  if (!state || !state.reglages || state.reglages.langue !== "en" || s === null || s === undefined) return s;
  const k = String(s);
  if (EN[k] !== undefined) return EN[k];
  for (const [re, rep] of EN_MOTIFS) if (re.test(k)) return k.replace(re, rep);
  return traduireCompose(k);
}

// dernier recours : on traduit les fragments connus à l'intérieur d'une phrase construite
function traduireCompose(k) {
  let out = k, touche = false;
  for (const [fr, en] of FRAGMENTS) {
    if (out.indexOf(fr) >= 0) { out = out.split(fr).join(en); touche = true; }
  }
  return touche ? out : k;
}

  let bons = 0, mauvais = 0;
  for (const i of r.ing) {

    if (e === null) continue;
    if (e) bons++; else mauvais++;

  const n = bons + mauvais;
  if (!n) return 0;
  return (bons - mauvais) / n;
}

// un plat chaud pénalisé l'été, un plat froid pénalisé l'hiver. Dans [-1, 1].
function scoreTemperature(r, t) {
  const f = Math.max(-1, Math.min(1, (t - 18) / 8));    // -1 = froid, +1 = chaud
  const tr = r.traits || [];
  const a = x => tr.indexOf(x) >= 0;
  const chaud = (a("soupe") ? 1 : 0) + (a("mijote") ? 1 : 0) + (a("four") ? 0.8 : 0) + (a("long") ? 0.4 : 0);
  const frais = (r.froid ? 0.8 : 0) + (a("salade") ? 1 : 0) + (a("cru") ? 1 : 0) + (a("froid") ? 1 : 0);
  const net = Math.max(-1.5, Math.min(1.5, frais - chaud)) / 1.5;
  return f * net;
}

/* ==================================================================
   DONNÉES DE RECETTES
   Elles ne sont plus dans le HTML : l'application va les chercher une
   fois dans donnees.json. Trois filets de sécurité, dans l'ordre :
     1. le réseau (et le service worker qui a mis le fichier en cache)
     2. une copie locale en IndexedDB, écrite au premier chargement réussi
     3. un message d'erreur explicite avec un bouton pour réessayer
   ================================================================== */
let SEED = [];
let versionDonnees = null;
const EN_ETAPES = {};
const MATERIEL = {};
const ORIGINES = {};

function ouvrirDBDonnees() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("indexedDB absent"));
    const q = indexedDB.open("menu-donnees", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("blocs");
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}

async function lireMiroir() {
  try {
    const db = await ouvrirDBDonnees();
    return await new Promise(res => {
      const q = db.transaction("blocs").objectStore("blocs").get("donnees");
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  } catch (e) { return null; }
}

async function ecrireMiroir(d) {
  try {
    const db = await ouvrirDBDonnees();
    db.transaction("blocs", "readwrite").objectStore("blocs").put(d, "donnees");
  } catch (e) { /* le miroir est un confort, pas une obligation */ }
}

function installerDonnees(d) {
  SEED = d.recettes || [];
  versionDonnees = d.version || null;
  Object.assign(EN, d.enNoms || {});
  Object.assign(EN_ETAPES, d.enEtapes || {});
  Object.assign(MATERIEL, d.materiel || {});
  Object.assign(ORIGINES, d.origines || {});
}

async function chargerDonnees() {
  let reseau = null;
  try {
    const rep = await fetch("donnees.json", { cache: "no-cache" });
    if (rep.ok) reseau = await rep.json();
  } catch (e) { /* hors ligne, ou fichier absent : on tentera le miroir */ }

  if (reseau && reseau.recettes && reseau.recettes.length) {
    installerDonnees(reseau);
    ecrireMiroir(reseau);
    return { source: "reseau" };
  }

  const miroir = await lireMiroir();
  if (miroir && miroir.recettes && miroir.recettes.length) {
    installerDonnees(miroir);
    return { source: "miroir" };
  }

  throw new Error("donnees.json introuvable");
}

    const c = JSON.parse(JSON.stringify(s));
    if (p) { if (p.note) c.note = p.note; if (p.desactive) c.desactive = true; }
    out.push(c);
  }
  for (const a of (ajouts || [])) out.push(JSON.parse(JSON.stringify(a)));
  return out;
}

function extraireCouchePerso() {
  const base = new Map(SEED.map(r => [r.id, r]));
  const perso = {}, ajouts = [];
  for (const r of state.recettes) {
    if (!base.has(r.id)) { ajouts.push(r); continue; }
    if (r.modifie) { perso[r.id] = { recette: r }; continue; }
    const d = {};
    if (r.note) d.note = r.note;
    if (r.desactive) d.desactive = true;
    if (Object.keys(d).length) perso[r.id] = d;
  }
  return { perso, ajouts };
}

let state = {
  recettes: [], plans: {}, reglages: { ...DEFAUTS }, coches: {},
  quizReponses: [], profilQuiz: {}, profilAppris: {}, prixPerso: {}
};

function charger() {
  const brut = store.lire("menu-semaine-v3");
  if (brut) {
    try {
      const d = JSON.parse(brut);
      state.plans = d.plans || {};
      state.coches = d.coches || {};
      state.quizReponses = d.quizReponses || [];
      state.prixPerso = d.prixPerso || {};
      state.reglages = { ...DEFAUTS, ...(d.reglages || {}) };
      if (d.perso || d.ajouts) {
        state.recettes = construireRecettes(d.perso || {}, d.ajouts || []);
      } else if (d.recettes && d.recettes.length) {
        // sauvegarde d'une version antérieure : on en tire la couche personnelle
        state.recettes = construireRecettes({}, []);
        const base = new Map(SEED.map(r => [r.id, r]));
        const enPlus = [];
        for (const r of d.recettes) {
          const cible = state.recettes.find(x => x.id === r.id);
          if (!cible) { if (!base.has(r.id)) enPlus.push(r); continue; }
          if (r.note) cible.note = r.note;
          if (r.desactive) cible.desactive = true;
          if (r.modifie) { Object.assign(cible, r); cible.modifie = true; }
        }
        state.recettes.push(...enPlus);
      } else {
        state.recettes = poolParDefaut();
      }
      return;
    } catch (e) {}
  }
  // reprise éventuelle d'une version précédente : on ne garde que les notes
  const ancien = store.lire("menu-semaine-v2") || store.lire("menu-semaine-v1");
  state.recettes = poolParDefaut();
  if (ancien) {
    try {
      const d = JSON.parse(ancien);
      for (const r of (d.recettes || [])) {
        const cible = state.recettes.find(x => x.nom === r.nom);
        if (cible && r.bonus) cible.note = r.bonus > 0 ? 5 : 2;
      }
      if (d.quizReponses) state.quizReponses = [];
    } catch (e) {}
  }
}

let sauveId = null;
function sauverMaintenant() {
  sauveId = null;
  const { perso, ajouts } = extraireCouchePerso();
  store.ecrire("menu-semaine-v3", JSON.stringify({
    plans: state.plans, coches: state.coches, quizReponses: state.quizReponses,
    prixPerso: state.prixPerso, reglages: state.reglages, perso, ajouts
  }));
}
function sauver() { clearTimeout(sauveId); sauveId = setTimeout(sauverMaintenant, 400); }
function viderSauvegarde() { if (sauveId) { clearTimeout(sauveId); sauverMaintenant(); } }

/* ==================================================================
   SEMAINES
   ================================================================== */
const EPOCH = Date.UTC(2024, 0, 1);
function lundiDe(d0) {
  const d = new Date(Date.UTC(d0.getFullYear(), d0.getMonth(), d0.getDate()));
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d;
}
function indexSemaine(d) { return Math.round((lundiDe(d).getTime() - EPOCH) / 604800000); }
function dateDuJour(i, j) { return new Date(EPOCH + i * 604800000 + j * 86400000); }
function loc() { return state.reglages.langue === "en" ? "en-GB" : "fr-FR"; }
function formatJour(d) { return d.toLocaleDateString(loc(), { day: "numeric", month: "short", timeZone: "UTC" }); }
// une semaine appartient au mois de son jeudi
function moisDeSemaine(i) { const d = dateDuJour(i, 3); return d.getUTCFullYear() + "-" + d.getUTCMonth(); }

let semaineCourante = indexSemaine(new Date());

function derniereUtilisation() {
  const m = {};
  for (const [i, plan] of Object.entries(state.plans)) {
    const n = Number(i);
    const toutes = [
      ...plan.sessions.map((s, k) => ({ s, k, d: false })),
      ...(plan.sessionsDessert || []).map((s, k) => ({ s, k, d: true }))
    ];
    for (const { s, k, d } of toutes) {
      if (!sessionActive(plan, k, d)) continue;
      if (m[s.recetteId] === undefined || n > m[s.recetteId]) m[s.recetteId] = n;
    }
  }
  return m;
}

/* ==================================================================
   GOÛTS : quiz + notes
   ================================================================== */
function clesGout(r) {
  const c = ["base:" + r.base, "cuisine:" + (r.cuisine || "francaise")];
  for (const t of (r.traits || [])) c.push("trait:" + t);
  if (r.veg) c.push("trait:veg");
  if (r.minutes <= 30 && c.indexOf("trait:rapide") < 0) c.push("trait:rapide");
  return c;
}

function recalculerProfil() {
  const p = {};
  state.quizReponses.forEach((rep, i) => {
    if (rep === null || rep === undefined || !QUIZ[i]) return;
    const o = QUIZ[i].o[rep];
    if (o) for (const [k, v] of Object.entries(o.w)) p[k] = (p[k] || 0) + v;
  });
  state.profilQuiz = p;

  // ce que les notes ont appris, recalculé de zéro à chaque fois
  const a = {};
  for (const r of state.recettes) {
    if (!r.note) continue;
    const d = (r.note - 3) * 0.35;
    for (const c of clesGout(r)) a[c] = (a[c] || 0) + d;
  }
  for (const k of Object.keys(a)) a[k] = Math.max(-5, Math.min(5, a[k]));
  state.profilAppris = a;
}

function profilCombine() {
  const p = { ...state.profilQuiz };
  for (const [k, v] of Object.entries(state.profilAppris || {})) p[k] = (p[k] || 0) + v;
  return p;
}

function calibrerGout(actives) {
  const p = profilCombine();
  if (!Object.keys(p).length) return () => 0;
  const brut = new Map(); let max = 0;
  for (const r of actives) {
    let s = 0, n = 0;
    for (const c of clesGout(r)) if (p[c] !== undefined) { s += p[c]; n++; }
    const v = n ? s / Math.sqrt(n) : 0;
    brut.set(r.id, v);
    if (Math.abs(v) > max) max = Math.abs(v);
  }
  if (!max) return () => 0;
  return (r) => (brut.get(r.id) || 0) / max;
}

function quizRepondu() { return state.quizReponses.filter(x => x !== null && x !== undefined).length; }

/* ==================================================================
   COÛTS
   ================================================================== */
function prixDe(nom) {
  const c = nom.toLowerCase();
  if (state.prixPerso[c] !== undefined) return { p: state.prixPerso[c].p, u: state.prixPerso[c].u };
  return PRIX[c] || PRIX[nom] || null;
}

function coutLigne(ing, facteur) {
  const p = prixDe(ing.n);
  const fe = (ENSEIGNES[state.reglages.enseigne] || ENSEIGNES.carrefour).f[ing.r] || 1;
  const q = ing.q * (facteur === undefined ? 1 : facteur);
  if (!p) {
    const base = PRIX_DEFAUT[ing.r] || 5;
    const kg = VERS_KG[ing.u] !== undefined ? q * VERS_KG[ing.u] : 0.15 * q;
    return kg * base * fe;
  }
  let qq;
  if (p.u === "kg") qq = VERS_KG[ing.u] !== undefined ? q * VERS_KG[ing.u] : q * 0.15;
  else if (p.u === "l") qq = VERS_L[ing.u] !== undefined ? q * VERS_L[ing.u] : q * 0.15;
  else qq = q;
  const saison = enSaison(ing.n, moisCourantPrix());
  return qq * p.p * fe * (saison === false ? 1.4 : 1);
}

function coutRecette(r, facteur) {
  return r.ing.reduce((a, i) => a + coutLigne(i, facteur), 0);
}

function toutesSessions(plan) {
  return [...plan.sessions.map((s, i) => ({ s, i, dessert: false })),
          ...(plan.sessionsDessert || []).map((s, i) => ({ s, i, dessert: true }))];
}

function coutSemaine(plan, forcerDefaut) {
  const garde = moisPrix;
  moisPrix = moisNum(plan.idxSem);
  let t = 0;
  for (const { s, i, dessert } of toutesSessions(plan)) {
    const r = state.recettes.find(x => x.id === s.recetteId);
    if (!r || !sessionActive(plan, i, dessert)) continue;
    const actifs = dessert
      ? s.creneaux.filter(j => plan.desserts[j] && !plan.desserts[j].saute).length
      : s.creneaux.filter(k => plan.creneaux[k] && !plan.creneaux[k].saute).length;
    const portions = forcerDefaut
      ? actifs * state.reglages.couvertsDefaut
      : portionsSession(plan, i, dessert);
    t += coutRecette(r, portions / r.batch);
  }
  moisPrix = garde;
  return t;
}

function cibleHebdo() { return state.reglages.budgetMensuel * 12 / 52; }

/* ==================================================================
   PORTIONS
   ================================================================== */
function portionsSession(plan, si, dessert) {
  if (dessert) {
    const s = plan.sessionsDessert[si];
    return s.creneaux.reduce((a, j) => {
      const d = plan.desserts[j];
      return a + (d && !d.saute ? (d.couverts || 1) : 0);
    }, 0);
  }
  const s = plan.sessions[si];
  return s.creneaux.reduce((a, i) => {
    const c = plan.creneaux[i];
    return a + (c && !c.saute ? (c.couverts || 1) : 0);
  }, 0);
}

// une séance dont tous les repas sont sautés n'existe plus : ni courses, ni budget, ni rotation
function sessionActive(plan, si, dessert) { return portionsSession(plan, si, dessert) > 0; }
function facteurSession(plan, si, dessert) {
  const s = dessert ? plan.sessionsDessert[si] : plan.sessions[si];
  const r = state.recettes.find(x => x.id === s.recetteId);
  if (!r || !r.batch) return 1;
  return portionsSession(plan, si, dessert) / r.batch;
}
// couverts d'un dessert = le plus grand des deux repas du jour
function couvertsJour(plan, j) {
  const a = plan.creneaux[j * 2] ? plan.creneaux[j * 2].couverts : state.reglages.couvertsDefaut;
  const b = plan.creneaux[j * 2 + 1] ? plan.creneaux[j * 2 + 1].couverts : state.reglages.couvertsDefaut;
  return Math.max(a, b);
}

/* ==================================================================
   GÉNÉRATEUR

   Rythme de la semaine :
     lundi à vendredi, le soir  -> on cuisine le dîner (temps confortable)
                                   et, dans la foulée, le repas du lendemain midi
     lundi à vendredi, le midi  -> jamais de cuisine : soit les restes du dîner
                                   de la veille, soit le plat préparé en même temps
     samedi et dimanche         -> les quatre repas sont cuisinés sur le moment
     lundi midi                 -> préparé le dimanche soir précédent
   ================================================================== */
function genererPlan(idxSem) {
  const r = state.reglages;
  const ancien = state.plans[idxSem];
  delete state.plans[idxSem];
  const vus = derniereUtilisation();
  if (ancien) state.plans[idxSem] = ancien;

  const plats = poolActif("plat");
  const desserts = poolActif("dessert");
  if (!plats.length) return null;

  const gout = calibrerGout(poolActif());
  moisGen = moisNum(idxSem);
  tempGen = temperatureMois(idxSem);
  let assoupli = false;

  const eligibles = (pool, besoin) => {
    const ok = pool.filter(x => { const d = vus[x.id]; return d === undefined || (idxSem - d) >= r.cooldown; });
    if (ok.length >= besoin) return ok;
    assoupli = true;
    return pool.slice();
  };

  const couverts = new Array(14).fill(r.couvertsDefaut);
  const sautes = new Array(14).fill(false);
  if (ancien) for (let i = 0; i < 14; i++) {
    if (!ancien.creneaux[i]) continue;
    if (ancien.creneaux[i].couverts) couverts[i] = ancien.creneaux[i].couverts;
    if (ancien.creneaux[i].saute) sautes[i] = true;      // une absence connue survit à une régénération
  }
  const dessertsSautes = new Array(7).fill(false);
  if (ancien && ancien.desserts) for (let j = 0; j < 7; j++)
    if (ancien.desserts[j] && ancien.desserts[j].saute) dessertsSautes[j] = true;

  // --- quels midis de semaine sont les restes du dîner de la veille ---
  // lundi midi est exclu : il n'y a pas de dîner la veille dans la semaine
  const budget = Math.max(0, Math.min(4, r.restesMax));
  const restes = {};
  const candidats = [2, 4, 6, 8].map(L => ({ L, p: Math.random() })).sort((a, b) => b.p - a.p);
  for (const c of candidats) {
    if (Object.keys(restes).length >= budget) break;
    restes[c.L] = c.L - 1;    // le dîner de la veille
  }

  // --- construction de la liste des séances ---
  const creneaux = new Array(14).fill(null);
  const sessions = [];
  const bases = [];
  const utilisees = new Set();
  const dispo = eligibles(plats, 14 - budget);

  function poser(slots, moment, contrainte) {
    contrainte.alcool = alcoolPermis(moment);
    const choix = choisirRecette(dispo, utilisees, bases, vus, idxSem, gout, contrainte);
    if (!choix) return;
    utilisees.add(choix.id);
    bases.push(choix.base);
    if (bases.length > 3) bases.shift();
    const si = sessions.length;
    for (const i of slots) {
      creneaux[i] = {
        sessionIdx: si, recetteId: choix.id, couverts: couverts[i],
        role: i === moment ? "frais" : (contrainte.pourRestes ? "restes" : "veille")
      };
      if (sautes[i]) creneaux[i].saute = true;
    }
    sessions.push({ recetteId: choix.id, moment, teinte: TEINTES[si % TEINTES.length], creneaux: slots.slice(), contrainte });
  }

  // lundi midi : préparé le dimanche soir précédent
  poser([0], -1, { max: r.tempsMidiSemaine, froid: true, pourRestes: false });

  // du lundi au vendredi
  for (let j = 0; j <= 4; j++) {
    const soir = j * 2 + 1;
    const midiLendemain = (j + 1) * 2;
    const avecRestes = restes[midiLendemain] === soir;
    poser(avecRestes ? [soir, midiLendemain] : [soir], soir,
          { max: r.tempsDinerSemaine, froid: avecRestes, pourRestes: avecRestes });
    // le midi du lendemain, s'il n'est pas des restes, est un plat préparé ce soir-là
    if (!avecRestes && midiLendemain <= 8) {
      poser([midiLendemain], soir, { max: r.tempsMidiSemaine, froid: true, pourRestes: false });
    }
  }

  // week-end : tout est cuisiné sur le moment
  for (const s of [10, 11, 12, 13]) {
    if (creneaux[s] === null) poser([s], s, { max: r.tempsWeekend, froid: false, pourRestes: false });
  }

  // filet de sécurité
  for (let s = 0; s < 14; s++) if (creneaux[s] === null) poser([s], s, { max: 999, froid: false, pourRestes: false });

  const plan = { idxSem, creneaux, sessions, desserts: null, sessionsDessert: [], assoupli, genereLe: new Date().toISOString() };

  if (r.dessertsActifs && desserts.length) genererDesserts(plan, desserts, vus, idxSem, gout, eligibles, dessertsSautes);
  else plan.desserts = new Array(7).fill(null);

  ajusterAuBudget(plan, dispo, vus, idxSem, gout);
  return plan;
}

function genererDesserts(plan, desserts, vus, idxSem, gout, eligibles, sautesDessert) {
  const r = state.reglages;
  plan.desserts = new Array(7).fill(null);
  plan.sessionsDessert = [];
  const utilisees = new Set();

  const rapides = desserts.filter(x => x.minutes <= r.tempsDessertSemaine);
  const weekend = desserts.filter(x => x.batch >= 4 && x.keeps >= 2 && x.minutes > r.tempsDessertSemaine);
  const poolS = eligibles(rapides.length ? rapides : desserts, 3);
  const poolW = eligibles(weekend.length ? weekend : desserts, 1);

  // semaine : on enchaîne des desserts simples qui tiennent plusieurs jours
  let j = 0, garde = 0;
  while (j <= 4 && garde++ < 12) {
    const choix = choisirRecette(poolS, utilisees, [], vus, idxSem, gout,
      { max: r.tempsDessertSemaine, dessert: true, alcool: alcoolPermis(j * 2) || alcoolPermis(j * 2 + 1) });
    if (!choix) break;
    utilisees.add(choix.id);
    const si = plan.sessionsDessert.length;
    const jours = [];
    const debut = j;
    const portionsDispo = Math.max(1, Math.floor(choix.batch / Math.max(1, couvertsJour(plan, j))));
    for (let k = 0; k < portionsDispo && j <= 4; k++) {
      if (j - debut > choix.keeps) break;
      plan.desserts[j] = { sessionIdx: si, recetteId: choix.id, couverts: couvertsJour(plan, j), role: jours.length ? "restes" : "frais" };
      if (sautesDessert && sautesDessert[j]) plan.desserts[j].saute = true;
      jours.push(j); j++;
    }
    plan.sessionsDessert.push({ recetteId: choix.id, jour: jours[0], creneaux: jours, teinte: TEINTES[si % TEINTES.length], dessert: true });
  }

  // week-end : un seul dessert, fait le samedi, qui tient jusqu'au dimanche
  const choixW = choisirRecette(poolW, utilisees, [], vus, idxSem, gout,
    { dessert: true, weekend: true, alcool: alcoolPermis(10) || alcoolPermis(11) });
  if (choixW) {
    const si = plan.sessionsDessert.length;
    for (const jj of [5, 6]) {
      plan.desserts[jj] = { sessionIdx: si, recetteId: choixW.id, couverts: couvertsJour(plan, jj), role: jj === 5 ? "frais" : "restes" };
      if (sautesDessert && sautesDessert[jj]) plan.desserts[jj].saute = true;
    }
    plan.sessionsDessert.push({ recetteId: choixW.id, jour: 5, creneaux: [5, 6], teinte: TEINTES[si % TEINTES.length], dessert: true });
  }
}

function choisirRecette(pool, utilisees, bases, vus, idxSem, gout, c) {
  c = c || {};
  let cands = pool.filter(x => !utilisees.has(x.id));
  if (!cands.length) return null;

  if (c.max) {
    const t = cands.filter(x => x.minutes <= c.max);
    if (t.length) cands = t;
  }
  if (c.pourRestes) {
    const t = cands.filter(x => x.keeps >= 2);
    if (t.length) cands = t;
  }
  if (c.alcool === false) {
    const t = cands.filter(x => !contientAlcool(x));
    if (t.length) cands = t;          // règle de l'utilisateur : on ne la contourne que si le pool est vide
  }
  if (bases && bases.length) {
    const t = cands.filter(x => bases.indexOf(x.base) < 0);
    if (t.length) cands = t;
  }

  const poids = state.reglages.poidsGout;
  const scores = cands.map(x => {
    const d = vus[x.id];
    const anc = Math.min(12, d === undefined ? 12 : idxSem - d);
    let s = anc + Math.random() * 3 + gout(x) * 4 * poids;
    if (x.note) s += (POIDS_NOTE[x.note] || 0) * poids;
    s += scoreSaison(x, moisGen) * 3 * state.reglages.poidsSaison;
    s += scoreTemperature(x, tempGen) * 3 * state.reglages.poidsMeteo;
    if (c.froid && x.froid) s += 1.5;
    if (c.weekend) s += Math.min(3, (x.minutes - 40) / 20);   // le week-end, on peut voir plus grand
    return { x, s };
  });
  scores.sort((a, b) => b.s - a.s);
  return scores[0].x;
}

// remplace les séances les plus chères tant qu'on dépasse la cible hebdomadaire
function ajusterAuBudget(plan, dispo, vus, idxSem, gout) {
  const cible = cibleHebdo();
  if (!cible || cible <= 0) return;
  let tours = 0;
  while (coutSemaine(plan, true) > cible && tours++ < 12) {
    const prises = new Set(plan.sessions.map(s => s.recetteId));
    let pire = -1, coutPire = 0;
    plan.sessions.forEach((s, i) => {
      const r = state.recettes.find(x => x.id === s.recetteId);
      if (!r) return;
      const c = coutRecette(r, (s.creneaux.length * state.reglages.couvertsDefaut) / r.batch);
      if (c > coutPire) { coutPire = c; pire = i; }
    });
    if (pire < 0) break;
    const s = plan.sessions[pire];
    const contrainte = s.contrainte || {};
    const candidats = dispo.filter(x => !prises.has(x.id) && (!contrainte.max || x.minutes <= contrainte.max) && (!contrainte.pourRestes || x.keeps >= 2));
    if (!candidats.length) break;
    let meilleur = null, meilleurCout = coutPire;
    for (const x of candidats) {
      const c = coutRecette(x, (s.creneaux.length * state.reglages.couvertsDefaut) / x.batch);
      const penaliteGout = (gout(x) * 2 + (x.note ? POIDS_NOTE[x.note] / 2 : 0));
      if (c < meilleurCout - 0.2 && c - penaliteGout * 0.3 < meilleurCout) { meilleur = x; meilleurCout = c; }
    }
    if (!meilleur) break;
    s.recetteId = meilleur.id;
    for (const i of s.creneaux) plan.creneaux[i].recetteId = meilleur.id;
  }
}

/* ==================================================================
   LISTE DE COURSES
   ================================================================== */
function listeCourses(plan) {
  const garde = moisPrix;
  moisPrix = moisNum(plan.idxSem);
  const total = {};
  for (const { s, i, dessert } of toutesSessions(plan)) {
    const rec = state.recettes.find(x => x.id === s.recetteId);
    if (!rec || !sessionActive(plan, i, dessert)) continue;
    const f = facteurSession(plan, i, dessert);
    for (const ing of rec.ing) {
      const cle = ing.n.toLowerCase() + "|" + ing.u;
      if (!total[cle]) total[cle] = { n: ing.n, u: ing.u, q: 0, r: ing.r, cle, origines: [] };
      total[cle].q += ing.q * f;
      const dejaLa = total[cle].origines.find(o => o.id === rec.id);
      if (dejaLa) dejaLa.q += ing.q * f;
      else total[cle].origines.push({
        id: rec.id, q: ing.q * f,
        moment: dessert ? null : s.moment,
        jour: dessert ? s.jour : null
      });
    }
  }
  const placard = state.reglages.placard.map(p => p.toLowerCase());
  const parRayon = {};
  for (const a of Object.values(total)) {
    if (placard.indexOf(a.n.toLowerCase()) >= 0) continue;
    a.cout = coutLigne(a, 1);
    a.horsSaison = enSaison(a.n, moisPrix) === false;
    (parRayon[a.r] = parRayon[a.r] || []).push(a);
  }
  for (const k of Object.keys(parRayon)) parRayon[k].sort((a, b) => a.n.localeCompare(b.n, "fr"));
  moisPrix = garde;
  return parRayon;
}

function formatQte(a, pourCourses) {
  let q = a.q, u = a.u;
  if (u === "g" && q >= 1000) { q = q / 1000; u = "kg"; }
  else if (u === "ml" && q >= 1000) { q = q / 1000; u = "l"; }
  if (u === "g" || u === "ml") q = Math.max(5, Math.round(q / 5) * 5);
  else if (u === "kg" || u === "l") q = Math.max(0.05, Math.round(q * 100) / 100);
  else if (COMPTABLES.indexOf(u) >= 0) q = pourCourses ? Math.max(1, Math.ceil(q - 0.001)) : Math.max(0.5, Math.round(q * 2) / 2);
  else q = Math.max(0.25, Math.round(q * 4) / 4);
  const colle = ["g", "kg", "ml", "l", "cl"].indexOf(u) >= 0;
  if (colle) return q + " " + u;
  let mot = trad(u);
  if (q > 1 && COMPTABLES.indexOf(u) >= 0) mot = PLURIELS[mot] || (mot + "s");
  return q + " " + mot;
}
function euros(x) { return (Math.round(x * 100) / 100).toFixed(2).replace(".", ",") + " €"; }

// nombre de moments distincts où il faut être en cuisine.
// Un dessert se prépare pendant la séance de cuisine du jour : il n'ajoute pas d'occasion.
function occasions(plan) {
  const m = new Set();
  plan.sessions.forEach((s, k) => { if (sessionActive(plan, k, false)) m.add(s.moment); });
  (plan.sessionsDessert || []).forEach((s, k) => {
    if (!sessionActive(plan, k, true)) return;
    const j = s.jour;
    if (!m.has(j * 2) && !m.has(j * 2 + 1)) m.add("d" + j);
  });
  return m.size;
}

function libelleMoment(m) {
  if (m === -1) return trad("dimanche soir précédent");
  return trad(JOURS[Math.floor(m / 2)]) + " " + trad(m % 2 === 0 ? "midi" : "soir");
}

function ouvrirConvivesJour(j) {
  const plan = state.plans[semaineCourante];
  const carte = feuille("Convives du " + JOURS[j]);
  carte.appendChild(el("p", "petit", "S'applique au déjeuner, au dîner et au dessert de ce jour."));
  const actuel = plan.creneaux[j * 2] ? plan.creneaux[j * 2].couverts : state.reglages.couvertsDefaut;
  carte.appendChild(stepper("Convives", actuel, v => {
    for (const k of [0, 1]) if (plan.creneaux[j * 2 + k]) plan.creneaux[j * 2 + k].couverts = v;
    if (plan.desserts && plan.desserts[j]) plan.desserts[j].couverts = v;
    sauver(); fermerModale(); rendre();
  }));

  // Une journée peut être partiellement sautée : sauter un dîner emporte les restes
  // du lendemain midi. On propose donc les deux actions dès qu'elles ont un sens,
  // plutôt que d'en deviner une.
  const lignes = [plan.creneaux[j * 2], plan.creneaux[j * 2 + 1], plan.desserts && plan.desserts[j]];
  const aSauter = lignes.some(x => x && !x.saute);
  const aRemettre = lignes.some(x => x && x.saute);
  if (aSauter) {
    const b = el("button", "cta-secondaire danger", "Sauter la journée");
    b.onclick = () => { sauterJour(plan, j, true); sauver(); fermerModale(); rendre(); };
    carte.appendChild(b);
  }
  if (aRemettre) {
    const b = el("button", "cta-secondaire", "Remettre la journée");
    b.onclick = () => { sauterJour(plan, j, false); sauver(); fermerModale(); rendre(); };
    carte.appendChild(b);
  }
  carte.appendChild(el("p", "petit", "Utile quand vous êtes absent : les repas disparaissent du menu et des courses."));

function stepper(label, valeur, cb) {
  let v = valeur;
  const w = el("div", "stepper");
  w.appendChild(el("span", "stepper-label", label));
  const moins = el("button", "rond", "−"), aff = el("span", "stepper-val", String(v)), plus = el("button", "rond", "+");
  moins.onclick = () => { v = Math.max(1, v - 1); aff.textContent = String(v); cb(v); };
  plus.onclick = () => { v = Math.min(12, v + 1); aff.textContent = String(v); cb(v); };
  w.appendChild(moins); w.appendChild(aff); w.appendChild(plus);
  return w;
}

}
function copier(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast("Copié")).catch(() => secours(t));
  else secours(t);
}
function secours(t) {
  const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Copié"); } catch (e) { toast("Copie impossible"); }
  document.body.removeChild(ta);
}

/* ---------- Budget ---------- */
function rendreBudget(vue) {
  const r = state.reglages;
  const moisCourant = moisDeSemaine(semaineCourante);
  const [an, mo] = moisCourant.split("-").map(Number);

  vue.appendChild(el("h2", "fiche-titre", MOIS[mo] + " " + an));

  const semaines = Object.keys(state.plans).map(Number).filter(i => moisDeSemaine(i) === moisCourant).sort((a, b) => a - b);
  let total = 0, totalBase = 0;
  for (const i of semaines) { total += coutSemaine(state.plans[i]); totalBase += coutSemaine(state.plans[i], true); }

  const reste = r.budgetMensuel - total;
  const j = el("div", "jauge-budget grande");
  const dedans = el("div", "jauge-in" + (total > r.budgetMensuel ? " depasse" : ""));
  dedans.style.width = Math.min(100, Math.round(100 * total / Math.max(1, r.budgetMensuel))) + "%";
  j.appendChild(dedans);
  vue.appendChild(j);

  const st = el("div", "stats");
  st.appendChild(bloc4(euros(total), "engagé"));
  st.appendChild(bloc4(euros(r.budgetMensuel), "budget"));
  st.appendChild(bloc4(euros(Math.abs(reste)), reste >= 0 ? "restant" : "de dépassement"));
  vue.appendChild(st);

  if (total > totalBase + 0.5) {
    vue.appendChild(el("div", "note", "Sur ce mois, " + euros(total - totalBase) +
      " viennent des convives ajoutés. Hors invités, le mois serait à " + euros(totalBase) + "."));
  }
  if (semaines.length && semaines.length < 4) {
    const proj = total / semaines.length * 4.345;
    vue.appendChild(el("div", "petit", semaines.length + " semaine(s) planifiée(s). Au même rythme, le mois finirait autour de " + euros(proj) + "."));
  }

  vue.appendChild(el("h3", null, "Semaine par semaine"));
  if (!semaines.length) vue.appendChild(el("div", "vide", "Aucune semaine planifiée pour ce mois."));
  for (const i of semaines) {
    const p = state.plans[i];
    const c = coutSemaine(p), cb = coutSemaine(p, true);
    const li = el("div", "ligne-semaine" + (i === semaineCourante ? " ici" : ""));
    const g = el("div", null);
    g.appendChild(el("div", "recette-nom", formatJour(dateDuJour(i, 0)) + " – " + formatJour(dateDuJour(i, 6))));
    g.appendChild(el("div", "petit", occasions(p) + " occasions de cuisine" + (c > cb + 0.5 ? " · +" + euros(c - cb) + " d'invités" : "")));
    li.appendChild(g);
    li.appendChild(el("strong", null, euros(c)));
    li.onclick = () => { semaineCourante = i; onglet = "semaine"; rendre(); };
    vue.appendChild(li);
  }

  vue.appendChild(el("h3", null, "Réglages du budget"));
  vue.appendChild(champNombre("Budget courses du mois (€)", r.budgetMensuel, 0, 5000, v => { r.budgetMensuel = v; sauver(); rendre(); }));
  const sel = el("div", "moments");
  for (const [k, e] of Object.entries(ENSEIGNES)) {
    const b = el("button", "chip" + (r.enseigne === k ? " on" : ""), e.nom);
    b.onclick = () => { r.enseigne = k; sauver(); rendre(); };
    sel.appendChild(b);
  }
  vue.appendChild(el("p", "petit", "Enseigne de référence pour les prix."));
  vue.appendChild(sel);
  vue.appendChild(el("p", "petit", "Prix indicatifs France 2026, ajustés par rayon selon l'enseigne. Modifiables dans Réglages."));
}

/* ---------- Recettes ---------- */
function rendreRecettes(vue) {
  const barre = el("div", "barre");
  const b1 = el("button", "cta-secondaire", "Ajouter"); b1.onclick = () => ouvrirEditeur(null); barre.appendChild(b1);
  const bi = el("button", "cta-secondaire", "Importer"); bi.onclick = ouvrirImport; barre.appendChild(bi);
  const b2 = el("button", "cta-secondaire", "Proposer des recettes"); b2.onclick = () => proposerParIA(); barre.appendChild(b2);
  vue.appendChild(barre);

  const actives = poolActif();
  const gout = calibrerGout(actives);
  const vus = derniereUtilisation();
  const mois = moisNum(semaineCourante);

  const champ = el("input", "champ-texte recherche");
  champ.type = "search";
  champ.placeholder = trad("Chercher un plat, une cuisine, un ingrédient");
  champ.value = recherche;
  champ.oninput = () => { recherche = champ.value; limiteListe = 60; focusRecherche = true; rendre(); };
  vue.appendChild(champ);

  const FILTRES = [
    ["rapide", "30 min ou moins", r => r.minutes <= 30],
    ["veg", "Végétarien", r => r.veg],
    ["saison", "De saison", r => scoreSaison(r, mois) > 0],
    ["aimees", "Bien notées", r => (r.note || 0) >= 4],
    ["jamais", "Jamais faites", r => vus[r.id] === undefined]
  ];
  const gf = el("div", "moments");
  for (const [cle, lib] of FILTRES) {
    const c = el("button", "chip" + (filtres.has(cle) ? " on" : ""), lib);
    c.onclick = () => { if (filtres.has(cle)) filtres.delete(cle); else filtres.add(cle); limiteListe = 60; rendre(); };
    gf.appendChild(c);
  }
  vue.appendChild(gf);

  const q = recherche.trim().toLowerCase();
  const correspond = r => {
    if (q && !(r.nom.toLowerCase().indexOf(q) >= 0
      || (NOM_CUISINE[r.cuisine] || "").toLowerCase().indexOf(q) >= 0
      || r.base.indexOf(q) >= 0
      || r.ing.some(i => i.n.toLowerCase().indexOf(q) >= 0))) return false;
    for (const [cle, , test] of FILTRES) if (filtres.has(cle) && !test(r)) return false;
    return true;
  };

  let montrees = 0, totalTrouve = 0;
  for (const cat of ["plat", "dessert"]) {
    const liste = state.recettes.filter(r => (r.categorie || "plat") === cat && correspond(r))
      .sort((a, b) => (b.note || 0) - (a.note || 0) || gout(b) - gout(a) || a.nom.localeCompare(b.nom, "fr"));
    totalTrouve += liste.length;
    if (!liste.length) continue;
    vue.appendChild(el("h3", null, (cat === "plat" ? "Plats" : "Desserts") + " · " + liste.length));
    for (const r of liste.slice(0, Math.max(0, limiteListe - montrees))) {
      montrees++;
      const l = el("div", "recette" + (r.desactive ? " off" : ""));
      const ir = el("span", "ic ic-plat"); ir.innerHTML = svgIcone(iconePlat(r), 20);
      l.appendChild(ir);
      const t = el("div", "recette-txt");
      t.appendChild(el("div", "recette-nom", r.nom));
      const d = vus[r.id], ecart = d === undefined ? null : semaineCourante - d;
      t.appendChild(el("div", "petit", [
        r.minutes + " min",
        euros(coutRecette(r, 1) / r.batch) + "/" + trad("portion"),
        d === undefined ? trad("jamais faite") : ecart <= 0 ? trad("au menu") : trad("il y a " + ecart + " sem."),
        r.desactive ? trad("écartée") : null
      ].filter(Boolean).join(" · ")));
      t.appendChild(etoiles(r, () => { sauver(); recalculerProfil(); rendre(); }));
      l.appendChild(t);
      t.querySelector(".recette-nom").onclick = () => { echelleFiche = null; recetteOuverte = r.id; rendre(); };
      vue.appendChild(l);
    }
  }

  if (!totalTrouve) vue.appendChild(el("div", "vide", "Aucune recette ne correspond."));
  else if (totalTrouve > montrees) {
    const bp = el("button", "cta-secondaire", trad("Afficher plus") + " (" + (totalTrouve - montrees) + ")");
    bp.onclick = () => { limiteListe += 60; rendre(); };
    vue.appendChild(bp);
  }

  if (focusRecherche) {
    focusRecherche = false;
    champ.focus();
    try { champ.setSelectionRange(champ.value.length, champ.value.length); } catch (e) {}
  }
}

  const i = ecranQuiz;
  if (i >= QUIZ.length) { rendreBilanQuiz(vue); return; }
  const q = QUIZ[i];

  const haut = el("div", "quiz-haut");
  const qq = el("button", "retour", "‹ Quitter"); qq.onclick = () => { ecranQuiz = null; rendre(); };
  haut.appendChild(qq);

  vue.appendChild(haut);

  const j = el("div", "jauge"); const b = el("div", "jauge-in");
  b.style.width = Math.round((i / QUIZ.length) * 100) + "%"; j.appendChild(b); vue.appendChild(j);

  vue.appendChild(el("div", "quiz-section", SECTIONS[q.s]));
  vue.appendChild(el("h2", "quiz-q", q.q));

  const choisi = state.quizReponses[i];
  q.o.forEach((o, k) => {
    const bt = el("button", "quiz-o" + (choisi === k ? " actif" : ""), o.t);
    bt.onclick = () => {
      state.quizReponses[i] = k;
      if (o.set) { Object.assign(state.reglages, o.set); appliquerTheme(); }
      recalculerProfil(); sauver(); ecranQuiz = i + 1; rendre();
    };
    vue.appendChild(bt);
  });

  const pied = el("div", "barre");
  if (i > 0) { const p = el("button", "cta-secondaire", "Précédente"); p.onclick = () => { ecranQuiz = i - 1; rendre(); }; pied.appendChild(p); }
  const s = el("button", "cta-secondaire", "Passer");
  s.onclick = () => { state.quizReponses[i] = null; sauver(); ecranQuiz = i + 1; rendre(); };
  pied.appendChild(s);
  const f = el("button", "cta-secondaire", "Terminer ici");
  f.onclick = () => { ecranQuiz = QUIZ.length; rendre(); };

/* ---------- éditeur ---------- */
function ouvrirEditeur(id) {
  const modele = id ? state.recettes.find(x => x.id === id) : {
    id: "u" + Date.now(), nom: "Nouvelle recette", categorie: "plat", base: "legume",
    cuisine: "francaise", traits: ["rapide"], batch: 2, keeps: 3, minutes: 30, froid: false, veg: true,
    ing: [{ n: "oignon", q: 1, u: "pièce", r: "legumes" }], etapes: ["Première étape."]
  };
  const carte = feuille(id ? "Modifier" : "Nouvelle recette");
  carte.appendChild(el("p", "petit", "batch = portions correspondant aux quantités. Rayons : " + ORDRE_RAYONS.join(", ") + "."));
  const ta = el("textarea", "editeur"); ta.value = JSON.stringify(modele, null, 2); carte.appendChild(ta);
  const barre = el("div", "barre");
  const ok = el("button", "cta", "Enregistrer");
  ok.onclick = () => {
    try {
      const o = JSON.parse(ta.value);
      if (!o.id || !o.nom || !Array.isArray(o.ing) || !Array.isArray(o.etapes)) throw new Error("champs manquants");
      o.batch = Number(o.batch) || 1; o.keeps = Number(o.keeps) || 2; o.minutes = Number(o.minutes) || 30;
      o.categorie = o.categorie || "plat";
      o.modifie = true;
      const i = state.recettes.findIndex(x => x.id === o.id);
      if (i >= 0) state.recettes[i] = o; else state.recettes.push(o);
      sauver(); fermerModale(); rendre();
    } catch (e) { toast("JSON invalide : " + e.message); }
  };
  barre.appendChild(ok);
  if (id) {
    const del = el("button", "cta-secondaire danger", "Supprimer");
    del.onclick = () => { state.recettes = state.recettes.filter(x => x.id !== id); recetteOuverte = null; sauver(); fermerModale(); rendre(); };
    barre.appendChild(del);
  }
  const an = el("button", "cta-secondaire", "Annuler"); an.onclick = fermerModale; barre.appendChild(an);
  carte.appendChild(barre);
}

function resumeProfil() {
  const p = profilCombine();
  const e = Object.entries(p).filter(([k]) => LIBELLES_GOUT[k]).sort((a, b) => b[1] - a[1]);
  let t = "";
  const plus = e.filter(x => x[1] > 0).slice(0, 10).map(x => LIBELLES_GOUT[x[0]]);
  const moins = e.filter(x => x[1] < 0).reverse().slice(0, 10).map(x => LIBELLES_GOUT[x[0]]);
  if (plus.length) t += "\nGoûts confirmés : " + plus.join(", ") + ".";
  if (moins.length) t += "\nÀ éviter : " + moins.join(", ") + ".";
  const bonnes = state.recettes.filter(r => r.note >= 4).map(r => r.nom);
  const mauvaises = state.recettes.filter(r => r.note && r.note <= 2).map(r => r.nom);
  if (bonnes.length) t += "\nPlats notés 4 ou 5 : " + bonnes.slice(0, 15).join(", ") + ".";
  if (mauvaises.length) t += "\nPlats mal notés, ne rien proposer d'approchant : " + mauvaises.slice(0, 15).join(", ") + ".";
  return t;
}

async function proposerParIA() {
  const cle = state.reglages.cle;
  if (!cle) { onglet = "reglages"; rendre(); toast("Renseignez d'abord une clé API."); return; }
  toast("Demande en cours…", 60000);
  const noms = state.recettes.map(r => r.nom).join(" ; ");
  const prompt =
    "Tu génères des recettes pour une application de menu hebdomadaire, en français, pour quelqu'un qui cuisine en France " +
    "et fait ses courses chez Grand Frais, Carrefour et Auchan.\n" +
    "Contraintes : ingrédients courants, unités métriques, budget raisonnable." + resumeProfil() + "\n" +
    "Ne propose AUCUNE de ces recettes déjà présentes : " + noms + "\n\n" +
    "Réponds uniquement par un tableau JSON de 5 objets, sans texte ni balises autour :\n" +
    '[{"id":"ia1","nom":"...","categorie":"plat","base":"...","cuisine":"...","traits":["..."],' +
    '"batch":2,"keeps":3,"minutes":35,"froid":true,"veg":false,' +
    '"ing":[{"n":"oignon","q":2,"u":"pièce","r":"legumes"}],"etapes":["...","..."]}]\n' +
    'categorie : "plat" ou "dessert". base pour un plat : boeuf, volaille, porc, agneau, poisson, fruitsdemer, legumineuse, legume, oeuf, pates, riz, tofu, cereale. ' +
    'base pour un dessert : chocolat, fruit, creme, patisserie. ' +
    'cuisine : francaise, italienne, espagnole, grecque, portugaise, mediterraneenne, nordafricaine, moyenorient, indienne, chinoise, japonaise, thai, vietnamienne, coreenne, creole, mexicaine, sudamericaine, americaine, europecentrale, britannique, africaine. ' +
    'traits : epice, mijote, four, fromage, soupe, salade, froid, rapide, legumes, long, sucresale, cru, patisserie, fruit, creme, chocolat. ' +
    'rayons r : ' + ORDRE_RAYONS.join(", ") + '. ' +
    '"froid" = se mange bien froid ou réchauffé le lendemain midi. 4 à 6 étapes.';

  try {
    const rep = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": cle, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: state.reglages.modele, max_tokens: 5000, messages: [{ role: "user", content: prompt }] })
    });
    if (!rep.ok) { toast("Erreur API " + rep.status + " : " + (await rep.text()).slice(0, 110)); return; }
    const data = await rep.json();
    const txt = data.content.map(b => b.type === "text" ? b.text : "").join("").trim();
    const arr = JSON.parse(txt.replace(/```json/g, "").replace(/```/g, "").trim());
    let n = 0;
    for (const x of arr) {
      if (!x.nom || !Array.isArray(x.ing) || !Array.isArray(x.etapes)) continue;
      x.id = "ia" + Date.now() + "-" + (n++);
      x.categorie = x.categorie === "dessert" ? "dessert" : "plat";
      x.batch = Number(x.batch) || 2; x.keeps = Number(x.keeps) || 3; x.minutes = Number(x.minutes) || 30;
      x.traits = Array.isArray(x.traits) ? x.traits : [];
      state.recettes.push(x);
    }
    sauver(); onglet = "recettes"; recetteOuverte = null; ecranQuiz = null; rendre();
    toast(n + " recettes ajoutées");
  } catch (e) { toast("Échec : " + e.message); }
}

/* ---------- vue « par séance de cuisine » ---------- */
function rendreSemaineSeances(vue, plan) {
  const moments = [];
  for (const s of plan.sessions) if (moments.indexOf(s.moment) < 0) moments.push(s.moment);
  moments.sort((a, b) => a - b);

  for (const m of moments) {
    const bl = el("div", "jour");
    const en = el("div", "jour-entete");
    en.appendChild(el("span", "jour-nom", libelleMoment(m)));
    bl.appendChild(en);

    for (const s of plan.sessions.filter(x => x.moment === m)) {
      const rec = state.recettes.find(x => x.id === s.recetteId);
      const li = el("div", "repas cliquable");
      li.style.borderLeftColor = s.teinte;
      const co = el("div", "repas-corps");
      co.appendChild(el("div", "repas-nom", rec ? rec.nom : "—"));
      co.appendChild(el("div", "repas-meta",
        (rec ? rec.minutes + " min · " : "") + s.creneaux.map(i => trad(JOURS[Math.floor(i / 2)]) + " " + trad(i % 2 === 0 ? "midi" : "soir")).join(", ")));
      li.appendChild(co);
      li.onclick = () => ouvrirRepas(s.creneaux[0]);
      bl.appendChild(li);
    }
    for (const s of (plan.sessionsDessert || [])) {
      const jourMoment = m === -1 ? -1 : Math.floor(m / 2);
      if (s.jour !== jourMoment) continue;
      const rec = state.recettes.find(x => x.id === s.recetteId);
      const li = el("div", "repas dessert cliquable");
      const co = el("div", "repas-corps");
      co.appendChild(el("div", "repas-nom", rec ? rec.nom : "—"));
      co.appendChild(el("div", "repas-meta", (rec ? rec.minutes + " min · " : "") +
        s.creneaux.map(j => trad(JOURS[j])).join(", ")));
      li.appendChild(co);
      li.onclick = () => { echelleFiche = null; recetteOuverte = s.recetteId; rendre(); };
      bl.appendChild(li);
    }
    vue.appendChild(bl);
  }
}

    l.appendChild(txt);
    l.appendChild(el("span", "origine-qte", formatQte({ n: a.n, u: a.u, q: o.q, r: a.r }, false)));
    l.onclick = () => { echelleFiche = null; recetteOuverte = r ? r.id : null; onglet = "recettes"; rendre(); };
    w.appendChild(l);
  }

  // on achète à l'unité : ce qui reste après la semaine mérite d'être dit
  if (COMPTABLES.indexOf(a.u) >= 0) {
    const utilise = liste.reduce((x, o) => x + o.q, 0);
    const achat = Math.max(1, Math.ceil(utilise - 0.001));
    if (achat - utilise > 0.25) {
      w.appendChild(el("div", "origines-reste",
        trad("Il vous en restera") + " : " + formatQte({ n: a.n, u: a.u, q: achat - utilise, r: a.r }, false)));
    }
  }
  return w;
}

// une nouvelle semaine s'ouvre en haut, même si on y était déjà venu
function oublierDefilement() {
  for (const k of Object.keys(defilements)) if (k.endsWith("|" + semaineCourante)) delete defilements[k];
}

/* ==================================================================
   SAUTER UN REPAS
   Un repas sauté reste visible dans la semaine, grisé, mais ne compte
   plus : ni dans les courses, ni dans le budget, ni dans la rotation.
   Sauter un repas cuisiné retire aussi les restes qui en découlent.
   Le retour en arrière rétablit toujours la séance entière.
   ================================================================== */
function sauterCreneau(plan, idx, valeur) {
  const c = plan.creneaux[idx];
  if (!c) return;
  const sess = plan.sessions[c.sessionIdx];
  const cible = (valeur && c.role === "frais") || !valeur ? sess.creneaux : [idx];
  for (const i of cible) {
    if (!plan.creneaux[i]) continue;
    if (valeur) plan.creneaux[i].saute = true; else delete plan.creneaux[i].saute;
  }
}

function sauterDessert(plan, j, valeur) {
  const d = plan.desserts && plan.desserts[j];
  if (!d) return;
  const sess = plan.sessionsDessert[d.sessionIdx];
  const cible = (valeur && d.role === "frais") || !valeur ? sess.creneaux : [j];
  for (const k of cible) {
    if (!plan.desserts[k]) continue;
    if (valeur) plan.desserts[k].saute = true; else delete plan.desserts[k].saute;
  }
}

function sauterJour(plan, j, valeur) {
  for (const k of [0, 1]) sauterCreneau(plan, j * 2 + k, valeur);
  sauterDessert(plan, j, valeur);
}

function ouvrirDessert(j) {
  const plan = state.plans[semaineCourante];
  const d = plan.desserts && plan.desserts[j];
  if (!d) return;
  const rec = state.recettes.find(x => x.id === d.recetteId);
  const carte = feuille(trad("dessert") + " · " + trad(JOURS[j]));
  carte.appendChild(el("p", "feuille-plat", rec ? rec.nom : "—"));
  carte.appendChild(el("p", "petit", d.saute ? trad("dessert sauté")
    : d.role === "frais" ? trad("À préparer ce jour-là") : trad("Préparé plus tôt dans la semaine")));

  const b1 = el("button", "cta-secondaire", "Voir la recette");
  b1.onclick = () => {
    echelleFiche = { f: facteurSession(plan, d.sessionIdx, true), p: portionsSession(plan, d.sessionIdx, true) };
    recetteOuverte = d.recetteId; fermerModale(); rendre();
  };
  carte.appendChild(b1);

  const b2 = el("button", "cta-secondaire" + (d.saute ? "" : " danger"), d.saute ? "Remettre ce dessert" : "Sauter ce dessert");
  b2.onclick = () => { sauterDessert(plan, j, !d.saute); sauver(); fermerModale(); rendre(); };
  carte.appendChild(b2);
}

/* ==================================================================
   MATÉRIEL
   ================================================================== */
const NOM_MATERIEL = {
  planche: "planche et couteau", poele: "poêle", casserole: "casserole", cocotte: "cocotte",
  wok: "wok", four: "four", platGratin: "plat à gratin", mouleTarte: "moule à tarte",
  mouleCake: "moule à cake", mouleGateau: "moule à gâteau", mouleCanneles: "moules à cannelés",
  mouleCharlotte: "moule à charlotte", mixeur: "mixeur", presseP: "presse-purée", fouet: "fouet",
  batteur: "batteur électrique", bainMarie: "bain-marie", friteuse: "grande casserole pour frire",
  vapeur: "cuit-vapeur", ramequins: "ramequins", passoire: "passoire", saladier: "saladier",
  rape: "râpe", papierCuisson: "papier cuisson", rouleau: "rouleau à pâtisserie", microOndes: "micro-ondes"
};

function materielDe(r) { return (MATERIEL[r.id] || []).map(k => NOM_MATERIEL[k] || k); }

// tout le matériel d'une séance de cuisine, dédoublonné
function materielSeance(plan, moment) {
  const s = new Set();
  plan.sessions.forEach((sess, k) => {
    if (sess.moment !== moment || !sessionActive(plan, k, false)) return;
    const r = state.recettes.find(x => x.id === sess.recetteId);
    if (r) materielDe(r).forEach(m => s.add(m));
  });
  for (const sess of (plan.sessionsDessert || [])) {
    const j = moment === -1 ? -1 : Math.floor(moment / 2);
    if (sess.jour !== j) continue;
    const r = state.recettes.find(x => x.id === sess.recetteId);
    if (r) materielDe(r).forEach(m => s.add(m));
  }
  return [...s];
}

/* ==================================================================
   PHOTOS  —  IndexedDB, car les images dépassent vite localStorage
   ================================================================== */
function ouvrirDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("indexedDB absent"));
    const q = indexedDB.open("menu-photos", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("photos");
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function lirePhoto(id) {
  try {
    const db = await ouvrirDB();
    return await new Promise(res => {
      const q = db.transaction("photos").objectStore("photos").get(id);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function ecrirePhoto(id, data) {
  try { const db = await ouvrirDB(); db.transaction("photos", "readwrite").objectStore("photos").put(data, id); }
  catch (e) { toast("Stockage photo indisponible"); }
}
async function effacerPhoto(id) {
  try { const db = await ouvrirDB(); db.transaction("photos", "readwrite").objectStore("photos").delete(id); }
  catch (e) {}
}

// réduction avant stockage : 720 px de large suffisent et tiennent en ~60 Ko
function reduireImage(fichier, maxPx) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxPx / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(fichier);
  });
}

function champPhoto(r, apres) {
  const w = el("div", "photo-zone");

function boutonsPhoto(r, existe, apres) {
  const barre = el("div", "barre");

  inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment"; inp.style.display = "none";
  inp.onchange = async () => {
