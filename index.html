<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EDF0E8">
<meta name="mobile-web-app-capable" content="yes">
<title>Menu de la semaine</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --papier: #EDF0E8;
  --carte: #FCFDFA;
  --encre: #1B2119;
  --encre2: #5A6455;
  --trait: #D2D8C8;
  --poireau: #2F6B3F;
  --prune: #6E2D46;
  --ocre: #8A6410;
  --r: 10px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--papier);
  color: var(--encre);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overscroll-behavior: none;
}

#app { display: flex; flex-direction: column; height: 100%; }

/* ---------- en-tête ---------- */
header {
  flex: 0 0 auto;
  padding: 14px 16px 10px;
  background: var(--papier);
  border-bottom: 1px solid var(--trait);
  padding-top: max(14px, env(safe-area-inset-top));
}
.titre { font-size: 15px; font-weight: 700; letter-spacing: .01em; margin: 0 0 6px; }
.nav-semaine { display: flex; align-items: baseline; gap: 10px; }
.nav-semaine button {
  border: 1px solid var(--trait); background: var(--carte); color: var(--encre);
  width: 34px; height: 34px; border-radius: 50%; font-size: 17px; line-height: 1;
  cursor: pointer; flex: 0 0 auto;
}
.nav-semaine button:active { background: var(--trait); }
.nav-txt { flex: 1 1 auto; min-width: 0; }
#periode { display: block; font-size: 19px; font-weight: 700; }
#relatif { display: block; font-size: 13px; color: var(--encre2); }

/* ---------- corps ---------- */
#vue {
  flex: 1 1 auto; overflow-y: auto;
  padding: 14px 16px 28px;
  -webkit-overflow-scrolling: touch;
}

h2, h3 { margin: 20px 0 8px; }
h3 { font-size: 14px; font-weight: 700; color: var(--encre2); }
.fiche-titre { font-size: 24px; line-height: 1.2; margin: 6px 0 4px; }
.petit { font-size: 13px; color: var(--encre2); }
.centre { text-align: center; margin-top: 18px; }

.barre { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.cta, .cta-secondaire {
  flex: 1 1 auto; min-height: 46px; padding: 11px 16px;
  border-radius: var(--r); font-size: 15px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent;
}
.cta { background: var(--poireau); color: #fff; }
.cta:active { filter: brightness(0.88); }
.cta-secondaire { background: var(--carte); color: var(--encre); border-color: var(--trait); }
.cta-secondaire:active { background: var(--trait); }
.danger { color: var(--prune); }

.note {
  background: var(--note); border-left: 3px solid var(--ocre);
  padding: 10px 12px; border-radius: 0 var(--r) var(--r) 0;
  font-size: 13px; margin-bottom: 16px;
}
.vide { padding: 34px 6px; color: var(--encre2); }
.vide p { margin: 0 0 8px; }

/* ---------- séances de cuisine ---------- */
.resume { margin-bottom: 22px; }
.seance {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 0; border-bottom: 1px solid var(--trait); cursor: pointer;
}
.seance:last-child { border-bottom: none; }
.pastille { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; flex: 0 0 auto; }
.seance-txt { min-width: 0; }
.seance-txt strong { text-transform: none; }

/* ---------- grille des repas ---------- */
.jour { margin-bottom: 16px; }
.jour-entete {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 5px; border-bottom: 1px solid var(--trait); margin-bottom: 6px;
}
.jour-nom { font-weight: 700; font-size: 15px; }
.jour-date { font-size: 13px; color: var(--encre2); }

.repas {
  display: flex; align-items: flex-start; gap: 11px;
  background: var(--carte);
  border: 1px solid var(--trait);
  border-left: 4px solid var(--trait);
  border-radius: 4px var(--r) var(--r) 4px;
  padding: 10px 12px; margin-bottom: 5px;
}
.repas.cliquable { cursor: pointer; }
.repas.cliquable:active { background: var(--survol); }
.repas-quand { flex: 0 0 38px; font-size: 12px; color: var(--encre2); padding-top: 2px; }
.repas-corps { min-width: 0; flex: 1 1 auto; }
.repas-nom { font-weight: 600; line-height: 1.3; }
.repas-meta { font-size: 12px; color: var(--encre2); margin-top: 1px; }
.repas.cuisson .repas-meta { color: var(--poireau); font-weight: 600; }
.repas-vide { color: var(--encre2); }

/* ---------- courses ---------- */
.rayon { margin-bottom: 20px; }
.rayon h3 {
  margin: 0 0 6px; padding-bottom: 5px;
  border-bottom: 2px solid var(--encre); color: var(--encre); font-size: 15px;
}
.article {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 2px; border-bottom: 1px solid var(--trait); cursor: pointer;
}
.case {
  flex: 0 0 24px; height: 24px; border: 1.5px solid var(--encre2);
  border-radius: 5px; display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #fff; line-height: 1;
}
.article.coche .case { background: var(--poireau); border-color: var(--poireau); }
.article-txt { flex: 1 1 auto; display: flex; justify-content: space-between; gap: 12px; min-width: 0; }
.article-nom { min-width: 0; }
.article-qte { color: var(--encre2); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.article.coche .article-txt { text-decoration: line-through; opacity: .45; }

/* ---------- recettes ---------- */
.recette {
  padding: 12px 2px; border-bottom: 1px solid var(--trait); cursor: pointer;
}
.recette.off { opacity: .45; }
.recette-nom { font-weight: 600; }
.retour { background: none; border: none; color: var(--poireau); font-size: 15px; padding: 4px 0; cursor: pointer; }

.ing-liste { border-top: 1px solid var(--trait); }
.ing {
  display: flex; justify-content: space-between; gap: 14px;
  padding: 9px 2px; border-bottom: 1px solid var(--trait);
}
.ing-qte { color: var(--encre2); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.etapes { padding-left: 20px; margin: 8px 0 0; }
.etapes li { margin-bottom: 10px; }

/* ---------- réglages ---------- */
.bloc { margin-bottom: 26px; }
.bloc h3 { margin-top: 0; }
.champ { margin-top: 8px; }
.champ label { display: block; font-size: 14px; margin-bottom: 5px; }
.champ-texte {
  width: 100%; padding: 11px 12px; margin-top: 6px;
  border: 1px solid var(--trait); border-radius: var(--r);
  background: var(--carte); color: var(--encre);
  font-family: inherit; font-size: 15px;
}
textarea.champ-texte { min-height: 76px; resize: vertical; }
.moments { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  padding: 8px 11px; border-radius: 999px; font-size: 13px; cursor: pointer;
  border: 1px solid var(--trait); background: var(--carte); color: var(--encre2);
}
.chip.on { background: var(--poireau); border-color: var(--poireau); color: #fff; font-weight: 600; }

/* ---------- modale ---------- */
#modale {
  position: fixed; inset: 0; background: rgba(27,33,25,.5);
  display: none; align-items: flex-end; justify-content: center; z-index: 40;
}
#modale.ouverte { display: flex; }
.modale-carte {
  background: var(--papier); width: 100%; max-height: 88%;
  overflow-y: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  border-radius: 16px 16px 0 0;
}
.modale-carte h3 { margin-top: 0; color: var(--encre); font-size: 17px; }
.editeur {
  width: 100%; min-height: 300px; padding: 11px;
  border: 1px solid var(--trait); border-radius: var(--r);
  background: var(--carte); color: var(--encre);
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12.5px;
}

/* ---------- onglets ---------- */
nav {
  flex: 0 0 auto; display: flex;
  background: var(--carte); border-top: 1px solid var(--trait);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1 1 0; padding: 11px 4px 13px; background: none; border: none;
  font-family: inherit; font-size: 12.5px; color: var(--encre2); cursor: pointer;
  border-top: 2px solid transparent; margin-top: -1px;
}
.tab.actif { color: var(--poireau); font-weight: 700; border-top-color: var(--poireau); }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(12px);
  background: var(--encre); color: var(--papier);
  padding: 11px 16px; border-radius: var(--r); font-size: 14px;
  max-width: 88%; text-align: center; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 50;
}
#toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
:focus-visible { outline: 2px solid var(--poireau); outline-offset: 2px; }

.repas-extra { font-size: 12px; font-weight: 600; margin-top: 3px; }

/* ---------- v2 : convives, quiz, feuilles ---------- */
.jour-droite { display: flex; align-items: baseline; gap: 10px; }
.mini {
  background: none; border: none; font-family: inherit; font-size: 12px;
  color: var(--poireau); cursor: pointer; padding: 2px 0; text-decoration: underline;
}
.badge {
  flex: 0 0 auto; align-self: center; background: var(--prune); color: #fff;
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
}
.repas.restes { background: var(--survol); border-style: dashed; border-left-style: solid; }
.repas.restes .repas-meta { color: var(--prune); font-weight: 600; }
.note.cliquable { cursor: pointer; }

.stepper { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
.stepper-label { flex: 1 1 auto; font-size: 14px; }
.stepper-val { font-size: 22px; font-weight: 700; min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; }
.rond {
  width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
  border: 1px solid var(--trait); background: var(--carte); color: var(--encre);
  font-size: 22px; line-height: 1; cursor: pointer;
}
.rond:active { background: var(--trait); }
.feuille-plat { font-size: 19px; font-weight: 700; margin: 2px 0 4px; }
.modale-carte .cta, .modale-carte .cta-secondaire { width: 100%; margin-top: 8px; }

.quiz-haut { display: flex; justify-content: space-between; align-items: center; }
.jauge { height: 4px; background: var(--trait); border-radius: 2px; margin: 10px 0 26px; overflow: hidden; }
.jauge-in { height: 100%; background: var(--poireau); transition: width .2s; }
.quiz-q { font-size: 22px; line-height: 1.25; margin: 0 0 22px; max-width: 22em; }
.quiz-o {
  display: block; width: 100%; text-align: left; margin-bottom: 10px;
  padding: 16px 18px; font-family: inherit; font-size: 16px; cursor: pointer;
  background: var(--carte); color: var(--encre);
  border: 1px solid var(--trait); border-radius: var(--r);
}
.quiz-o:active { background: var(--trait); }
.quiz-o.actif { border-color: var(--poireau); border-width: 2px; font-weight: 600; }
.cta-secondaire.actif { border-color: var(--poireau); border-width: 2px; color: var(--poireau); font-weight: 700; }

.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { padding: 6px 11px; border-radius: 999px; font-size: 13px; border: 1px solid; }
.puce.plus { color: var(--poireau); border-color: var(--poireau); background: var(--tonPlus); }
.puce.moins { color: var(--prune); border-color: var(--prune); background: var(--tonMoins); }
.consequence { color: var(--poireau); font-weight: 600; margin-top: 8px; }

/* ---------- v3 : desserts, budget, notes ---------- */
.stats { display: flex; gap: 8px; margin: 4px 0 18px; }
.stat {
  flex: 1 1 0; background: var(--carte); border: 1px solid var(--trait);
  border-radius: var(--r); padding: 10px 8px; text-align: center; min-width: 0;
}
.stat strong { display: block; font-size: 17px; line-height: 1.2; }
.stat .petit { display: block; font-size: 11px; line-height: 1.25; margin-top: 3px; }

.repas.dessert { background: var(--note); border-left-color: var(--ocre); }
.repas.dessert .repas-quand { color: var(--ocre); font-weight: 600; }

.etoiles { display: flex; gap: 2px; margin-top: 4px; }
.etoile {
  background: none; border: none; padding: 3px 4px; font-size: 19px; line-height: 1;
  color: var(--trait); cursor: pointer;
}
.etoile.on { color: var(--ocre); }
.bloc-noter {
  background: var(--carte); border: 1px solid var(--trait);
  border-radius: var(--r); padding: 12px 14px; margin-bottom: 18px;
}
.bloc-noter h3 { margin: 0 0 8px; }
.noter-ligne { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; }
.noter-nom { font-size: 14px; min-width: 0; }

.jauge-budget { height: 8px; background: var(--trait); border-radius: 4px; overflow: hidden; margin: 6px 0 16px; }
.jauge-budget.grande { height: 12px; border-radius: 6px; margin-bottom: 18px; }
.jauge-budget .jauge-in { background: var(--poireau); height: 100%; }
.jauge-budget .jauge-in.depasse { background: var(--prune); }
.ligne-cout { display: flex; align-items: baseline; gap: 6px; }
.ligne-cout strong { font-size: 21px; }

.rayon-cout { float: right; font-weight: 400; color: var(--encre2); font-size: 13px; }
.article-droite { display: flex; flex-direction: column; align-items: flex-end; flex: 0 0 auto; }
.article-prix { font-size: 11px; color: var(--encre2); font-variant-numeric: tabular-nums; }

.ligne-semaine {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 2px; border-bottom: 1px solid var(--trait); cursor: pointer;
}
.ligne-semaine.ici { font-weight: 600; }
.ligne-semaine strong { font-variant-numeric: tabular-nums; }

.quiz-section { font-size: 12px; color: var(--encre2); margin-bottom: 6px; }
.recette-nom { cursor: pointer; }


/* ---------- v4 : densités et thèmes sombres ---------- */
body.d-compact { font-size: 15px; }
body.d-compact #vue { padding: 10px 12px 22px; }
body.d-compact .repas { padding: 7px 10px; margin-bottom: 4px; }
body.d-compact .article { padding: 9px 2px; }
body.d-compact .jour { margin-bottom: 11px; }
body.d-compact h2, body.d-compact h3 { margin: 14px 0 6px; }
body.d-compact .quiz-q { font-size: 19px; }
body.d-compact .quiz-o { padding: 12px 14px; }

body.d-large { font-size: 18px; }
body.d-large #vue { padding: 18px 18px 34px; }
body.d-large .repas { padding: 14px 15px; }
body.d-large .article { padding: 16px 2px; }
body.d-large .petit { font-size: 15px; }
body.d-large .repas-meta, body.d-large .article-prix { font-size: 14px; }
body.d-large .quiz-o { padding: 19px 20px; font-size: 17px; }
body.d-large .tab { font-size: 13.5px; }

body.sombre .cta { color: #14171A; }
body.sombre .badge { color: #14171A; }
body.sombre .article.coche .case { color: #14171A; }
body.sombre #modale { background: rgba(0,0,0,.62); }
body.sombre #toast { background: var(--carte); color: var(--encre); border: 1px solid var(--trait); }
body.sombre .rayon h3 { border-bottom-color: var(--encre2); }

/* ---------- v4.1 : marqueur alcool ---------- */
.tag-alcool {
  flex: 0 0 auto; align-self: center; white-space: nowrap;
  background: var(--tonMoins); color: var(--prune); border: 1px solid var(--prune);
  font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
}
.chip.petit-chip { font-size: 12px; padding: 7px 9px; }

/* ---------- v5 : photos, icônes, origine, minuteurs ---------- */
.photo-zone { margin: 6px 0 10px; }
.photo { width: 100%; max-height: 230px; object-fit: cover; border-radius: var(--r); display: block; }
.photo-vide {
  height: 110px; display: flex; align-items: center; justify-content: center;
  background: var(--carte); border: 1px dashed var(--trait); border-radius: var(--r); color: var(--encre2);
}

.ic { display: inline-flex; align-items: center; color: var(--encre2); flex: 0 0 auto; }
.ic-plat { align-self: center; color: var(--encre2); }
.ing-gauche { display: flex; align-items: center; gap: 9px; min-width: 0; }
.ing-gauche .ing-nom, .ing-gauche .article-nom { min-width: 0; }
.avec-icone { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
.avec-icone-txt { flex: 1 1 auto; min-width: 0; }

.repliable {
  border: 1px solid var(--trait); border-radius: var(--r);
  background: var(--carte); margin: 14px 0; overflow: hidden;
}
.repliable > summary {
  padding: 12px 14px; cursor: pointer; font-weight: 600; font-size: 14px;
  list-style: none; display: flex; justify-content: space-between; align-items: center;
}
.repliable > summary::-webkit-details-marker { display: none; }
.repliable > summary::after { content: "+"; font-size: 19px; color: var(--encre2); font-weight: 400; }
.repliable[open] > summary::after { content: "−"; }
.repliable-corps { padding: 0 14px 14px; font-size: 14.5px; line-height: 1.5; }
.repliable-corps p { margin: 0; }
.repliable-corps .recette-nom { margin-top: 10px; font-size: 13px; }

.chrono {
  display: inline-block; margin: 6px 8px 0 0; padding: 5px 11px;
  border: 1px solid var(--poireau); color: var(--poireau); background: var(--tonPlus);
  border-radius: 999px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
}

#minuteurs { display: none; flex-direction: column; gap: 1px; background: var(--trait); flex: 0 0 auto; }
#minuteurs.visible { display: flex; }
.minuteur {
  display: flex; align-items: center; gap: 10px;
  background: var(--poireau); color: #fff; padding: 8px 14px;
}
body.sombre .minuteur { color: #14171A; }
.minuteur-nom { flex: 1 1 auto; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.minuteur-temps { font-variant-numeric: tabular-nums; font-size: 16px; }
.minuteur-stop {
  background: none; border: none; color: inherit; font-size: 20px; line-height: 1;
  padding: 0 2px; cursor: pointer; opacity: .8;
}

/* ---------- v6 : saison ---------- */
.tag-saison {
  flex: 0 0 auto; white-space: nowrap; margin-left: 6px;
  background: var(--tonMoins); color: var(--prune);
  font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px;
}
.petit.vert { color: var(--poireau); font-weight: 600; }
.petit.prune { color: var(--prune); font-weight: 600; }

/* ---------- v7 : d'où vient un article ---------- */
.article-bloc { border-bottom: 1px solid var(--trait); }
.article-bloc .article { border-bottom: none; }
.chevron {
  flex: 0 0 32px; height: 32px; margin-left: 4px;
  background: none; border: 1px solid var(--trait); border-radius: 8px;
  color: var(--encre2); font-size: 17px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.chevron.ouvert { border-color: var(--poireau); color: var(--poireau); }
.origines {
  padding: 4px 0 12px 36px; margin-bottom: 4px;
  border-left: 2px solid var(--trait); margin-left: 11px;
}
.origines-titre { font-size: 11.5px; font-weight: 700; color: var(--encre2); margin-bottom: 4px; }
.origine { display: flex; align-items: center; gap: 9px; padding: 6px 0; cursor: pointer; }
.origine-txt { flex: 1 1 auto; min-width: 0; }
.origine-nom { font-size: 14px; line-height: 1.25; }
.origine-qte { flex: 0 0 auto; font-size: 13px; color: var(--encre2); font-variant-numeric: tabular-nums; }
.origines-reste { font-size: 12px; color: var(--ocre); font-weight: 600; margin-top: 6px; }

</style>
</head>
<body>
<div id="app">

  <header>
    <p class="titre">Menu de la semaine</p>
    <div class="nav-semaine">
      <button id="prec" aria-label="Semaine précédente">‹</button>
      <div class="nav-txt">
        <span id="periode"></span>
        <span id="relatif"></span>
      </div>
      <button id="suiv" aria-label="Semaine suivante">›</button>
    </div>
  </header>

  <main id="vue"></main>

  <div id="minuteurs"></div>

  <nav>
    <button class="tab actif" data-onglet="semaine">Semaine</button>
    <button class="tab" data-onglet="courses">Courses</button>
    <button class="tab" data-onglet="budget">Budget</button>
    <button class="tab" data-onglet="recettes">Recettes</button>
    <button class="tab" data-onglet="reglages">Réglages</button>
  </nav>

</div>

<div id="modale"></div>
<div id="toast"></div>

<script>
/* ==================================================================
   FORMAT COMPACT DES RECETTES
   R(id, nom, categorie, base, cuisine, traits, batch, keeps, minutes,
     drapeaux, ingrédients, étapes)
     categorie : "plat" | "dessert"
     drapeaux  : F = se mange froid / se transporte, V = végétarien
     ingrédient : [nom, quantité, unité, rayon]
   ================================================================== */
const RAY = { l: "legumes", v: "viande", c: "cremerie", s: "surgele", e: "epicerie", b: "boulangerie", d: "boisson" };
const UNI = { g: "g", m: "ml", p: "pièce", a: "gousse", s: "c.à.s", c: "c.à.c", u: "cube", q: "bouquet", t: "tranche", n: "pincée" };

function R(id, nom, cat, base, cuisine, traits, b, k, min, fl, ing, etapes) {
  return {
    id, nom, categorie: cat, base, cuisine,
    traits: traits ? traits.split(" ") : [],
    batch: b, keeps: k, minutes: min,
    froid: fl.indexOf("F") >= 0, veg: fl.indexOf("V") >= 0,
    ing: ing.map(x => ({ n: x[0], q: x[1], u: UNI[x[2]], r: RAY[x[3]] })),
    etapes
  };
}

// écarts constatés par enseigne, par rayon (1 = référence)

  carrefour: { nom: "Carrefour", f: { legumes: 1.00, viande: 1.00, cremerie: 1.00, surgele: 1.00, epicerie: 1.00, boulangerie: 1.00, boisson: 1.00 } },

};

// conversion d'une ligne de recette vers l'unité de référence du prix
const VERS_KG = { g: 0.001, "c.à.s": 0.012, "c.à.c": 0.004, pincée: 0.0005 };
const VERS_L  = { ml: 0.001, cl: 0.01, "c.à.s": 0.015, "c.à.c": 0.005 };

function coutIngredient(ing, enseigne) {
  const p = PRIX[ing.n.toLowerCase()] || PRIX[ing.n];
  const facteurEnseigne = (ENSEIGNES[enseigne] || ENSEIGNES.carrefour).f[ing.r] || 1;
  if (!p) {
    // repli : on suppose une portion de 150 g au prix moyen du rayon
    const base = PRIX_DEFAUT[ing.r] || 5;
    const kg = VERS_KG[ing.u] !== undefined ? ing.q * VERS_KG[ing.u] : 0.15 * ing.q;
    return kg * base * facteurEnseigne;
  }
  let q;
  if (p.u === "kg") q = VERS_KG[ing.u] !== undefined ? ing.q * VERS_KG[ing.u] : ing.q * 0.15;
  else if (p.u === "l") q = VERS_L[ing.u] !== undefined ? ing.q * VERS_L[ing.u] : ing.q * 0.15;
  else q = ing.q;   // prix à la pièce
  return q * p.p * facteurEnseigne;
}

function prixConnu(nom) { return !!(PRIX[nom.toLowerCase()] || PRIX[nom]); }

/* ==================================================================
   QUIZ DE GOÛTS
   Chaque réponse déplace des poids sur des clés :
     base:<x> | cuisine:<x> | trait:<x>
   Ces poids classent les recettes du pool et orientent l'IA.
   ================================================================== */
function Q(s, q, ...o) { return { s, q, o: o.map(x => ({ t: x[0], w: x[1], set: x[2] })) }; }

// question fréquence sur une seule clé
function QF(s, q, cle, fort) {
  const f = fort || 2;
  return Q(s, q, ["Souvent", { [cle]: f }], ["De temps en temps", { [cle]: 0.5 }], ["Rarement", { [cle]: -f }]);
}
// question cuisine
function QC(s, q, cle) {
  return Q(s, q, ["Oui, j'aime", { ["cuisine:" + cle]: 2 }], ["Ça dépend", { ["cuisine:" + cle]: 0.5 }], ["Pas trop", { ["cuisine:" + cle]: -2 }]);
}

function appliquerTheme() {
  const t = THEMES[state.reglages.theme] || THEMES.potager;
  const r = document.documentElement;
  for (const [k, v] of Object.entries(t.v)) r.style.setProperty("--" + k, v);
  document.body.className = "d-" + (state.reglages.densite || "normal") + (t.sombre ? " sombre" : "");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t.v.papier);
}

// une recette passe-t-elle les régimes, les ingrédients évités et les cuisines retenues ?
function autorisee(r) {
  const g = state.reglages;
  for (const k of (g.regimes || [])) {
    const R = REGIMES[k];
    if (!R) continue;
    if (R.test && !R.test(r)) return false;
    if (R.bases && R.bases.indexOf(r.base) >= 0) return false;
    if (R.ing && r.ing.some(i => R.ing.indexOf(i.n.toLowerCase()) >= 0)) return false;
  }
  const evites = (g.evites || []).map(s => s.toLowerCase()).filter(Boolean);
  if (evites.length && r.ing.some(i => evites.some(e => i.n.toLowerCase().indexOf(e) >= 0))) return false;
  const off = g.cuisinesOff || [];
  if ((r.categorie || "plat") !== "dessert" && off.indexOf(r.cuisine) >= 0) return false;
  return true;
}

// pool réellement utilisable ; cat vaut "plat", "dessert" ou rien pour tout
function poolActif(cat) {
  return state.recettes.filter(x => !x.desactive && autorisee(x) &&
    (!cat || (x.categorie || "plat") === cat));
}

}

// dernier recours : on traduit les fragments connus à l'intérieur d'une phrase construite
function traduireCompose(k) {
  let out = k, touche = false;
  for (const [fr, en] of FRAGMENTS) {
    if (out.indexOf(fr) >= 0) { out = out.split(fr).join(en); touche = true; }
  }
  return touche ? out : k;
}

function svgIcone(cle, taille) {
  const c = ICONES[cle];
  if (!c) return "";
  const t = taille || 20;
  return '<svg viewBox="0 0 24 24" width="' + t + '" height="' + t + '" fill="none" stroke="currentColor" ' +
         'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + c + '</svg>';
}

/* --- ingrédient vers catégorie : règles dans l'ordre, la première qui matche gagne --- */
const REGLES_ICONE = [
  [/saumon|cabillaud|colin|thon|sardine|anchois/, "poisson"],
  [/crevette|moule|calamar/, "fruitsDeMer"],
  [/poulet|dinde/, "volaille"],
  [/bœuf|boeuf|steak|agneau/, "viandeRouge"],
  [/lardon|chorizo|saucisse|porc|jambon|merguez|bacon/, "porc"],
  [/^œufs$/, "oeuf"],
  [/gruyère|parmesan|mozzarella|feta|chèvre|ricotta|mascarpone|comté|roquefort|cheddar|halloumi|burrata/, "fromage"],
  [/lait|crème|yaourt|fromage blanc|beurre$/, "laitage"],
  [/pâte (brisée|feuilletée|filo)|gnocchis|feuilles de riz/, "pate"],
  [/tofu/, "legumineuse"],
  [/carotte|pomme de terre|patate douce|navet|betterave|poireau|panais/, "racine"],
  [/épinard|salade|chou\b|chou blanc|chou chinois|endive|germes/, "feuille"],
  [/oignon|échalote|^ail$/, "oignon"],
  [/champignon/, "champignon"],
  [/citron|orange$/, "agrume"],
  [/persil|coriandre fraîche|basilic|menthe|ciboulette|aneth|gingembre|piment frais/, "herbe"],
  [/pomme$|poire|banane|fraise|framboise|pêche|abricot$|cerise|ananas|mangue|rhubarbe|avocat/, "fruit"],
  [/tomate|courgette|aubergine|poivron|concombre|brocoli|chou-fleur|haricots verts|petits pois|potimarron|butternut|céleri|fenouil|artichaut/, "legumeFruit"],
  [/spaghetti|tagliatelle|macaroni|penne|lasagne|nouille/, "pates"],
  [/riz|semoule|boulgour|quinoa|polenta|avoine|maïzena/, "cereale"],
  [/lentille|pois chiche|haricots (rouges|blancs|noirs)/, "legumineuse"],
  [/concassée|passata|concentré de tomate|maïs en conserve|olive|câpre|cornichon/, "conserve"],
  [/chocolat|cacao/, "chocolat"],
  [/amande|^noix|cajou|pignon|sésame|cacahuète|abricots secs|raisins secs|datte|spéculoos|biscuits/, "noix"],
  [/farine|sucre|levure|chapelure|gélatine|agar|panko/, "farine"],
  [/huile|vinaigre|sauce|coco|miel|confiture|compote|pesto|tahini|moutarde|mayonnaise|curry en pâte|pâte de curry|miso|gochujang|harissa|mirin/, "liquide"],

const ICONE_RAYON = { legumes: "legumeFruit", viande: "viandeRouge", cremerie: "laitage",
  surgele: "legumeFruit", epicerie: "epice", boulangerie: "pain", boisson: "liquide" };

function icone(nom, rayon) {
  const n = (nom || "").toLowerCase();
  for (const [re, cle] of REGLES_ICONE) if (re.test(n)) return cle;
  return ICONE_RAYON[rayon] || "epice";
}

/* --- plat vers icône --- */
const ICONE_BASE = {
  boeuf: "viandeRouge", agneau: "viandeRouge", volaille: "volaille", porc: "porc",
  poisson: "poisson", fruitsdemer: "fruitsDeMer", legumineuse: "legumineuse",
  legume: "legumeFruit", oeuf: "oeuf", pates: "pates", riz: "cereale", cereale: "cereale",
  tofu: "legumineuse", chocolat: "chocolat", fruit: "fruit", creme: "laitage", patisserie: "gateau"
};

function iconePlat(r) {
  if (!r) return "epice";
  const t = r.traits || [];
  if ((r.categorie || "plat") === "dessert") {
    if (t.indexOf("patisserie") >= 0 && /tarte|tatin/i.test(r.nom)) return "tarte";
    return ICONE_BASE[r.base] || "gateau";
  }
  if (r.type === "soupe" || t.indexOf("soupe") >= 0) return "platSoupe";
  if (r.type === "salade" || t.indexOf("salade") >= 0) return "platSalade";
  if (t.indexOf("mijote") >= 0) return "platMijote";
  if (t.indexOf("four") >= 0) return "platFour";
  return ICONE_BASE[r.base] || "platPoele";
}

/* ===== ORIGINE DES PLATS ===== */
const ORIGINES = {
m01:{fr:"Bourgogne. Un plat de paysan : des morceaux de bœuf trop durs pour être grillés, attendris des heures durant dans le vin de la région. Escoffier l'a codifié au début du XXe siècle.",en:"Burgundy. A peasant dish: cuts of beef too tough to grill, tenderised for hours in the local wine. Escoffier codified it in the early twentieth century."},
m02:{fr:"Doit son nom à Antoine Parmentier, pharmacien militaire qui passa les années 1780 à convaincre les Français que la pomme de terre n'était pas réservée aux cochons.",en:"Named after Antoine Parmentier, an army pharmacist who spent the 1780s persuading the French that potatoes weren't just pig food."},
m03:{fr:"Lorraine. Le mot vient du germanique « Kuchen », gâteau. La recette d'origine ne contenait que des œufs, de la crème et du lard : le fromage est un ajout tardif.",en:"Lorraine. The word comes from the Germanic Kuchen, cake. The original held only eggs, cream and bacon; the cheese is a later addition."},
m04:{fr:"Le rituel du dimanche français. Le poulet rôti était longtemps un luxe hebdomadaire, d'où l'expression prêtée à Henri IV sur la poule au pot.",en:"The French Sunday ritual. Roast chicken was long a weekly luxury, hence the line attributed to Henri IV about a chicken in every pot."},
m05:{fr:"Une blanquette est un ragoût « blanc » : on ne colore jamais la viande. Traditionnellement au veau, elle se décline ici au bœuf.",en:"A blanquette is a white stew: the meat is never browned. Traditionally veal, made here with beef."},
m06:{fr:"Provence, plein été. Le gratin de courgettes est né d'un problème de jardinier : que faire quand le potager en produit plus qu'on ne peut en manger.",en:"Provence, high summer. The courgette gratin was born of a gardener's problem: what to do when the vegetable patch produces more than you can eat."},
m07:{fr:"Le potimarron est japonais : la courge Hokkaido, arrivée en France au XXe siècle. Son nom mêle potiron et marron, pour son goût de châtaigne.",en:"Red kuri squash is Japanese, a Hokkaido variety that reached France in the twentieth century. Its French name blends pumpkin and chestnut, for its taste."},
m08:{fr:"L'ancêtre de la vichyssoise, laquelle ne vient pas de Vichy mais de New York : un chef français l'y servit froide dans les années 1910.",en:"The ancestor of vichyssoise, which comes not from Vichy but from New York, where a French chef served it chilled in the 1910s."},
m09:{fr:"La soupe des Halles de Paris, avalée à l'aube par les forts des marchés et, dit-on, par les noctambules en fin de soirée.",en:"The soup of the Paris markets, eaten at dawn by the porters of Les Halles and, so the story goes, by revellers on the way home."},
m10:{fr:"Cuisine familiale française d'après-guerre, bâtie autour de la boîte de thon, qui rendit le poisson bon marché et disponible partout.",en:"Postwar French home cooking, built around the tin of tuna that made fish cheap and available everywhere."},
m11:{fr:"Le plat de pique-nique par excellence : il se prépare la veille, voyage sans dommage et se mange froid.",en:"The picnic dish par excellence: made the day before, it travels without damage and is eaten cold."},
m12:{fr:"Bretagne. Le sarrasin poussait sur les sols pauvres où le froment échouait. « Complète » veut dire jambon, œuf et fromage.",en:"Brittany. Buckwheat grew on poor soil where wheat failed. Complète means ham, egg and cheese."},
m13:{fr:"L'endive fut obtenue par hasard en Belgique au XIXe siècle, en forçant des racines de chicorée à l'obscurité dans une cave.",en:"Chicory was obtained by accident in nineteenth-century Belgium, by forcing roots to sprout in the dark of a cellar."},
m14:{fr:"Le pesto vient de Gênes, où le basilic se pilait au mortier avec de l'huile de Ligurie. « Pesto » et « pilon » partagent la même racine.",en:"Pesto comes from Genoa, where basil was pounded in a mortar with Ligurian oil. Pesto and pestle share a root."},
m15:{fr:"La papillote enferme les arômes plutôt que de les laisser s'échapper : une cuisson à la vapeur de son propre jus.",en:"The papillote traps the aromas rather than letting them escape: the fish steams in its own juices."},
m16:{fr:"Pays basque. Le piment d'Espelette y remplaça le poivre, trop coûteux, après son arrivée d'Amérique au XVIe siècle.",en:"Basque country. Espelette pepper replaced costly black pepper there after arriving from the Americas in the sixteenth century."},
m17:{fr:"Savoie, mais récente : la tartiflette fut lancée dans les années 1980 par l'interprofession du reblochon pour écouler du fromage.",en:"Savoie, but recent: tartiflette was launched in the 1980s by the Reblochon producers' association to shift cheese."},
m18:{fr:"Apparu dans les cafés parisiens vers 1910. Le nom serait une plaisanterie de comptoir sur la viande « croquée » par le monsieur.",en:"Appeared in Paris cafés around 1910. The name is said to be a counter joke about the gentleman crunching into his meat."},
m19:{fr:"Provence. Le pistou est le cousin du pesto ligure, mais sans pignons : seulement basilic, ail et huile d'olive.",en:"Provence. Pistou is the cousin of Ligurian pesto but without pine nuts: just basil, garlic and olive oil."},
m20:{fr:"Pays nantais. La légende veut qu'une cuisinière ait oublié les jaunes d'œufs d'une béarnaise et obtenu, par accident, cette émulsion au beurre.",en:"The Nantes region. Legend has it a cook forgot the egg yolks in a béarnaise and accidentally produced this butter emulsion."},
m21:{fr:"Naples ou Ischia, milieu du XXe siècle. L'origine du nom est disputée et probablement moins sulfureuse qu'on ne le raconte.",en:"Naples or Ischia, mid twentieth century. The origin of the name is disputed and probably less scandalous than the stories suggest."},
m22:{fr:"Plaine du Pô, où l'on cultive le riz depuis le XVe siècle. Le grain rond libère son amidon et fait la crème, sans crème.",en:"The Po valley, where rice has been grown since the fifteenth century. The round grain releases its starch and makes the cream, without cream."},
m23:{fr:"Émilie-Romagne. Le ragù bolognese authentique contient très peu de tomate : c'est un ragoût de viande, pas une sauce tomate.",en:"Emilia-Romagna. Authentic ragù bolognese contains very little tomato: it is a meat stew, not a tomato sauce."},
m24:{fr:"Cucina povera : des haricots pour les protéines, des pâtes pour l'énergie, et rien de gaspillé. On y jetait les bouts de pâtes dépareillés.",en:"Cucina povera: beans for protein, pasta for energy, nothing wasted. Odd ends of pasta went in together."},
m25:{fr:"Italie du Sud. La Campanie et la Sicile se disputent la paternité, et le nom ne vient peut-être pas de Parme mais du sicilien « parmiciana », volet.",en:"Southern Italy. Campania and Sicily both claim it, and the name may come not from Parma but from the Sicilian parmiciana, a shutter slat."},
m26:{fr:"Milan. « Osso buco » signifie os troué : la moelle du jarret est la meilleure part. Traditionnellement au veau.",en:"Milan. Osso buco means hollow bone: the marrow in the shin is the best part. Traditionally veal."},
m27:{fr:"Rome. Le plat des bergers : du fromage de brebis et du poivre se transportaient sans se gâter dans la montagne.",en:"Rome. A shepherd's dish: sheep's cheese and pepper travelled into the hills without spoiling."},
m28:{fr:"Il n'existe pas de recette de minestrone. C'est une méthode : tout ce que donne le jardin, coupé petit et mijoté.",en:"There is no recipe for minestrone. It is a method: whatever the garden gives, chopped small and simmered."},
m29:{fr:"Milan. La cotoletta alla milanese et le Wiener Schnitzel se disputent l'antériorité depuis le XIXe siècle, sans vainqueur clair.",en:"Milan. The cotoletta alla milanese and the Wiener Schnitzel have disputed seniority since the nineteenth century, with no clear winner."},
m30:{fr:"La burrata est née dans les Pouilles au XXe siècle, pour ne pas perdre les chutes de mozzarella : on les enferme dans une poche de pâte avec de la crème.",en:"Burrata was created in Puglia in the twentieth century to save mozzarella offcuts, wrapped with cream inside a pouch of curd."},
m31:{fr:"Espagne, autour de 1800. Une tortilla nourrit beaucoup de monde avec peu : des œufs, des pommes de terre, de l'huile.",en:"Spain, around 1800. A tortilla feeds many people on little: eggs, potatoes, oil."},
m32:{fr:"Valence. La paella d'origine se faisait au feu de bois d'oranger, avec du lapin et des escargots. Les fruits de mer sont une version côtière.",en:"Valencia. The original paella was cooked over orange wood with rabbit and snails. Seafood is a coastal variant."},
m33:{fr:"Tapa de Séville, héritée d'al-Andalus : les épinards et les pois chiches y arrivèrent avec la cuisine arabe.",en:"A Seville tapa inherited from al-Andalus: spinach and chickpeas both arrived with Arab cooking."},
m34:{fr:"Andalousie. Servi encore grésillant dans sa cazuela de terre cuite, avec du pain pour l'huile à l'ail.",en:"Andalusia. Served still sizzling in its earthenware cazuela, with bread for the garlic oil."},
m35:{fr:"Grèce. La couche de béchamel n'est pas ancienne : elle fut ajoutée dans les années 1920 par Nikolaos Tselementes, qui voulait franciser la cuisine grecque.",en:"Greece. The béchamel layer is not ancient: it was added in the 1920s by Nikolaos Tselementes, who wanted to Frenchify Greek cooking."},
m36:{fr:"« Horiatiki » veut dire salade du village. La vraie ne contient pas de salade verte, et la feta arrive en un seul bloc posé dessus.",en:"Horiatiki means village salad. The real thing contains no lettuce, and the feta arrives as a single slab laid on top."},
m37:{fr:"Grèce. Les gemista appartiennent aux « ladera », ces plats à l'huile d'olive que l'on mange tièdes et qui se passent de viande les jours de jeûne.",en:"Greece. Gemista belong to the ladera, olive-oil dishes eaten warm that do without meat on fasting days."},
m38:{fr:"Lisbonne. La morue séchée nourrit le Portugal depuis que ses marins pêchaient à Terre-Neuve. On dit qu'il existe une recette par jour de l'année.",en:"Lisbon. Salt cod has fed Portugal since its sailors fished off Newfoundland. They say there is a recipe for every day of the year."},
m39:{fr:"Minho, au nord du Portugal. Le chou y est coupé en filaments si fins que la coupe est devenue une spécialité en soi.",en:"Minho, in northern Portugal. The cabbage is shredded so finely that the cutting became a speciality in itself."},
m40:{fr:"Nice. Le nom vient de « touiller », remuer. Les puristes cuisent chaque légume séparément pour qu'aucun ne se délite.",en:"Nice. The name comes from touiller, to stir. Purists cook each vegetable separately so none collapses."},
m41:{fr:"La lentille verte du Puy pousse sur les sols volcaniques du Velay et fut le premier légume sec à obtenir une AOC.",en:"Green Puy lentils grow on the volcanic soils of the Velay and were the first pulse to receive a French protected origin label."},
m42:{fr:"Levant. Le vrai taboulé est une salade de persil avec un peu de boulgour ; la version française a inversé les proportions.",en:"The Levant. Real tabbouleh is a parsley salad with a little bulgur; the French version reversed the proportions."},
m43:{fr:"Maghreb, sans doute tunisienne. Elle a essaimé dans toute la Méditerranée et jusqu'en Israël, où elle est devenue un plat du petit-déjeuner.",en:"The Maghreb, probably Tunisia. It spread across the Mediterranean and into Israel, where it became a breakfast dish."},
m44:{fr:"Le tajine désigne d'abord le plat en terre à couvercle conique, qui fait retomber la vapeur sur les aliments. Le sucré-salé est une signature marocaine.",en:"Tagine first means the conical earthenware pot, which returns the steam to the food. The sweet-savoury pairing is a Moroccan signature."},
m45:{fr:"Berbère d'origine. La semoule cuit à la vapeur du bouillon, jamais dedans. Le couscous figure régulièrement parmi les plats préférés des Français.",en:"Berber in origin. The semolina steams over the broth, never in it. Couscous regularly ranks among France's favourite dishes."},
m46:{fr:"Maghreb. La kefta désigne la viande hachée aux épices ; on la façonne en boulettes ou autour d'une brochette plate.",en:"The Maghreb. Kefta means spiced minced meat, shaped into balls or moulded around a flat skewer."},
m47:{fr:"Levant. Le falafel serait né chez les Coptes d'Égypte, aux fèves, avant de passer aux pois chiches en remontant vers le nord.",en:"The Levant. Falafel is thought to have begun among Egypt's Copts, made with broad beans, before switching to chickpeas further north."},
m48:{fr:"Le mujaddara figure déjà dans un livre de cuisine bagdadien du XIIIe siècle. Les oignons frits noirs en sont la signature.",en:"Mujaddara already appears in a thirteenth-century Baghdad cookbook. The darkly fried onions are its signature."},
m49:{fr:"Moyen-Orient. La viande hachée moulée sur la brochette cuit plus vite et plus régulièrement qu'un morceau entier.",en:"The Middle East. Minced meat moulded onto the skewer cooks faster and more evenly than a whole piece."},
m50:{fr:"« Fatteh » vient de l'arabe « fatta », briser. C'est une famille de plats bâtis sur du pain rassis que l'on casse au fond du plat.",en:"Fatteh comes from the Arabic fatta, to break. It is a family of dishes built on stale bread broken into the bottom of the dish."},
m51:{fr:"Sous-continent indien. Le dhal est le plat quotidien par excellence : des légumineuses, des épices, et de quoi tenir la journée.",en:"The Indian subcontinent. Dhal is the everyday dish par excellence: pulses, spices, and enough to see out the day."},
m52:{fr:"Inde du Nord. Le chana palak associe deux ingrédients bon marché en un plat complet, largement végétarien par tradition.",en:"North India. Chana palak pairs two cheap ingredients into a complete dish, largely vegetarian by tradition."},
m53:{fr:"Probablement britannique. Un restaurateur de Glasgow revendique l'avoir inventé dans les années 1970 en allongeant un poulet tikka jugé trop sec.",en:"Probably British. A Glasgow restaurateur claims to have invented it in the 1970s by loosening a chicken tikka judged too dry."},
m54:{fr:"Pendjab. Aloo pour la pomme de terre, gobi pour le chou-fleur : le nom est la liste des courses.",en:"Punjab. Aloo for potato, gobi for cauliflower: the name is the shopping list."},
m55:{fr:"Cuisine des cours moghole, d'inspiration persane. Le riz et la garniture cuisent séparément avant d'être scellés ensemble à feu très doux.",en:"The cooking of the Mughal courts, Persian in inspiration. Rice and filling cook separately before being sealed together over very low heat."},
m56:{fr:"Côte de Malabar. Le lait de coco y remplace le yaourt du Nord comme milieu de cuisson des currys.",en:"The Malabar coast. Coconut milk replaces the yoghurt of the north as the cooking medium for curries."},
m57:{fr:"Sauté cantonais popularisé par les restaurants chinois d'Occident. La maïzena sur la viande, dite « velouting », la garde tendre à feu vif.",en:"A Cantonese stir-fry popularised by Chinese restaurants in the West. The cornflour coating, known as velveting, keeps the meat tender over high heat."},
m58:{fr:"Chengdu, Sichuan, XIXe siècle. « Mapo » signifie la vieille femme grêlée : la tenancière de l'échoppe où le plat fut servi.",en:"Chengdu, Sichuan, nineteenth century. Mapo means the pockmarked old woman, the keeper of the stall where the dish was served."},
m59:{fr:"En Chine on l'appelle riz de Yangzhou. Le nom français dit « cantonais », par raccourci hérité des premiers restaurants chinois de Paris.",en:"In China it is called Yangzhou rice. The French name says Cantonese, a shorthand inherited from the first Chinese restaurants in Paris."},
m60:{fr:"Un classique du répertoire des restaurants chinois en France, où il figure sur presque toutes les cartes depuis les années 1970.",en:"A staple of the Chinese restaurant repertoire in France, on almost every menu since the 1970s."},
m61:{fr:"Les soupes de nouilles traversent toute la Chine. Le bouillon est la vraie recette : les nouilles n'en sont que le support.",en:"Noodle soups run right across China. The broth is the real recipe; the noodles are only the vehicle."},
m62:{fr:"« Donburi » désigne le bol de riz garni. « Teriyaki » vient de « teri », le brillant, et « yaki », le grillé : c'est la laque, pas la sauce.",en:"Donburi means the topped rice bowl. Teriyaki comes from teri, shine, and yaki, grilled: it describes the glaze, not a sauce."},
m63:{fr:"Japon. Le miso est une pâte de soja fermentée. On ne la fait jamais bouillir, sous peine de tuer les ferments et l'arôme.",en:"Japan. Miso is fermented soybean paste. It is never boiled, or the ferments and the aroma are lost."},
m64:{fr:"Cuisine « yōshoku » : le Japon de l'ère Meiji adaptant les plats occidentaux. La côtelette panée y est devenue une institution.",en:"Yōshoku cooking: Meiji-era Japan adapting Western dishes. The breaded cutlet became an institution there."},
m65:{fr:"Le curry arriva au Japon par la marine britannique, pas par l'Inde. D'où sa texture épaisse, liée au roux, très éloignée d'un curry indien.",en:"Curry reached Japan through the British navy, not through India. Hence its thick roux-bound texture, far removed from an Indian curry."},
m66:{fr:"Thaïlande. « Kaeng khiao wan » signifie curry vert doux : la couleur vient des piments frais, pas de l'absence de force.",en:"Thailand. Kaeng khiao wan means sweet green curry: the colour comes from fresh chillies, not from any lack of heat."},
m67:{fr:"Promu comme plat national par le gouvernement thaïlandais dans les années 1930-40, dans une campagne visant à forger une identité culinaire moderne.",en:"Promoted as a national dish by the Thai government in the 1930s and 1940s, in a campaign to forge a modern culinary identity."},
m68:{fr:"Isan, nord-est de la Thaïlande. L'équilibre acide, salé, sucré, piquant s'y règle à chaque assiette, jamais une fois pour toutes.",en:"Isan, north-eastern Thailand. The balance of sour, salty, sweet and hot is tuned plate by plate, never once and for all."},
m69:{fr:"Sud du Viêt Nam. Le bún thịt nướng réunit dans un seul bol du chaud, du froid, du croquant et des herbes crues.",en:"Southern Vietnam. Bún thịt nướng brings hot, cold, crunchy and raw herbs together in a single bowl."},
m70:{fr:"Hanoï, début du XXe siècle. L'influence du pot-au-feu français sur sa naissance est débattue depuis longtemps, sans preuve décisive.",en:"Hanoi, early twentieth century. The influence of the French pot-au-feu on its birth has long been debated, with no decisive evidence."},
m71:{fr:"Corée. « Bibim » veut dire mélanger, « bap » le riz : le plat n'existe qu'une fois tout écrasé ensemble à la cuillère.",en:"Korea. Bibim means to mix, bap means rice: the dish only exists once everything is mashed together with a spoon."},
m72:{fr:"Le kimchi vieilli, trop acide pour être mangé cru, trouve sa seconde vie à la poêle. Le « kimjang », sa préparation collective, est classé par l'UNESCO.",en:"Aged kimchi, too sour to eat raw, finds a second life in the pan. Kimjang, the communal making of it, is listed by UNESCO."},
m73:{fr:"La Réunion. Le rougail désigne à l'origine un condiment pilé ; le rougail saucisse en est la version en plat, devenue emblème de l'île.",en:"Réunion. Rougail originally meant a pounded condiment; rougail saucisse is the main-course version, now an emblem of the island."},
m74:{fr:"Antilles. Le colombo fut apporté au XIXe siècle par les travailleurs engagés venus du sud de l'Inde après l'abolition de l'esclavage.",en:"The French Antilles. Colombo was brought in the nineteenth century by indentured workers from southern India after the abolition of slavery."},
m75:{fr:"Version végétarienne du chili texan, née dans les cuisines militantes américaines des années 1970. « Sin carne » : sans viande.",en:"A vegetarian take on Texan chilli, born in American activist kitchens of the 1970s. Sin carne means without meat."},
m76:{fr:"Tex-Mex. Les fajitas viennent des ouvriers des ranchs du Rio Grande, payés en bas morceaux dont la bavette, longtemps méprisée.",en:"Tex-Mex. Fajitas come from Rio Grande ranch workers, paid in cheap cuts including the long-scorned skirt steak."},
m77:{fr:"Mexique. Rouler une tortilla autour d'une garniture est une pratique préhispanique ; le mot signifie simplement « pimentée ».",en:"Mexico. Rolling a tortilla around a filling is a pre-Hispanic practice; the word simply means chillied."},
m78:{fr:"Brésil. La feijoada se sert traditionnellement le samedi, et se mange lentement : elle est réputée occuper l'après-midi entier.",en:"Brazil. Feijoada is traditionally served on Saturdays and eaten slowly: it is said to take up the whole afternoon."},
m79:{fr:"Pérou, plat national. La technique est précolombienne ; le citron vert, lui, arriva avec les Espagnols et remplaça les fruits acides locaux.",en:"Peru, the national dish. The technique is pre-Columbian; the lime arrived with the Spanish and replaced local sour fruits."},
m80:{fr:"Texas. Les « chili queens » de San Antonio le vendaient sur les places la nuit au XIXe siècle. Au Texas, il ne contient pas de haricots.",en:"Texas. The chilli queens of San Antonio sold it in the squares at night in the nineteenth century. In Texas it contains no beans."},
m81:{fr:"Jefferson rapporta d'Europe une machine à pâtes et le goût du macaroni au fromage. Kraft en fit un produit en boîte en 1937, en pleine Dépression.",en:"Jefferson brought back a pasta machine from Europe along with a taste for macaroni cheese. Kraft boxed it in 1937, in the depths of the Depression."},
m82:{fr:"Le steak haché « à la mode de Hambourg » traversa l'Atlantique avec les migrants allemands ; les Américains le mirent dans du pain.",en:"Hamburg-style minced steak crossed the Atlantic with German migrants; Americans put it in bread."},
m83:{fr:"Hongrie. « Gulyás » signifie bouvier : c'était le ragoût des gardiens de troupeaux dans la plaine, au paprika séché qui se transportait facilement.",en:"Hungary. Gulyás means herdsman: the stew of cattle drovers on the plain, using dried paprika that travelled easily."},
m84:{fr:"Alsace. La fermentation du chou serait venue d'Asie centrale par les routes commerciales, bien avant d'être une spécialité alsacienne.",en:"Alsace. Cabbage fermentation is thought to have come from Central Asia along trade routes, long before becoming an Alsatian speciality."},
m85:{fr:"Suède. La tradition veut que Charles XII ait rapporté la recette de son long exil en territoire ottoman, au début du XVIIIe siècle.",en:"Sweden. Tradition holds that Charles XII brought the recipe back from his long exile in Ottoman territory in the early eighteenth century."},
m86:{fr:"Royaume-Uni. Le nom distingue la viande : « shepherd's » à l'agneau, « cottage » au bœuf. Les deux recyclaient le rôti du dimanche.",en:"Britain. The name distinguishes the meat: shepherd's for lamb, cottage for beef. Both recycled the Sunday roast."},
m87:{fr:"Royaume-Uni. Héritage du poisson du vendredi, et de siècles de cuisine côtière où la purée servait de couvercle étanche.",en:"Britain. A legacy of Friday fish and of centuries of coastal cooking, where mash served as a watertight lid."},
m88:{fr:"Mali et Sénégal. Le mafé est bâti sur la pâte d'arachide, cultivée massivement en Afrique de l'Ouest depuis le XIXe siècle.",en:"Mali and Senegal. Mafé is built on groundnut paste, grown on a large scale in West Africa since the nineteenth century."},
m89:{fr:"Casamance, Sénégal. Le yassa repose sur une marinade longue au citron et à l'oignon, qui attendrit et parfume avant même la cuisson.",en:"Casamance, Senegal. Yassa rests on a long lemon and onion marinade that tenderises and flavours before any cooking begins."},
m90:{fr:"Nord de l'Espagne. Les fabes et le chorizo forment la base des potées asturiennes, que l'on décline du plus simple au plus copieux.",en:"Northern Spain. Beans and chorizo form the base of Asturian stews, from the simplest version to the most substantial."}
};

/* ===== ORIGINE DES DESSERTS ===== */
Object.assign(ORIGINES, {
d01:{fr:"Le mot vient du latin « composita », mélange. Cuire les fruits dans le sucre fut d'abord une technique de conservation, pas un dessert.",en:"The word comes from the Latin composita, a mixture. Cooking fruit in sugar was first a means of preservation, not a dessert."},
d02:{fr:"Le riz au lait est antique, mais il fut longtemps un luxe : le riz venait d'Asie et le sucre était vendu chez l'apothicaire.",en:"Rice pudding is ancient but was long a luxury: rice came from Asia and sugar was sold by the apothecary."},
d03:{fr:"La salade de fruits doit tout au sucre et au froid : avant la réfrigération domestique, on la servait aussitôt coupée.",en:"Fruit salad owes everything to sugar and cold: before domestic refrigeration it was served the moment it was cut."},

d05:{fr:"On attribue volontiers l'invention à Toulouse-Lautrec, qui l'aurait appelée « mayonnaise de chocolat ». L'anecdote est jolie et mal documentée.",en:"The invention is often credited to Toulouse-Lautrec, who supposedly called it chocolate mayonnaise. The story is charming and poorly documented."},
d06:{fr:"Le fromage blanc est un fromage arrêté en chemin : caillé, égoutté, jamais affiné. Le coulis n'est là que pour l'acidité.",en:"Fromage blanc is a cheese stopped halfway: curdled, drained, never ripened. The coulis is there only for acidity."},
d07:{fr:"Antilles et océan Indien. La banane rôtie au rhum est un dessert de fin de repas créole, né là où les deux poussent côte à côte.",en:"The Caribbean and Indian Ocean. Bananas roasted with rum are a creole end-of-meal dessert, born where both grow side by side."},
d08:{fr:"Dessert d'enfance français, cousin du riz au lait. La semoule de blé dur cuit en huit minutes là où le riz en demande trente.",en:"A French childhood dessert, cousin to rice pudding. Durum semolina cooks in eight minutes where rice needs thirty."},
d09:{fr:"Le plus simple des desserts au four : une pomme évidée tient debout, se remplit et cuit dans sa propre peau.",en:"The simplest of baked desserts: a cored apple stands up, fills up and cooks inside its own skin."},
d10:{fr:"Britannique et né du rationnement : pendant la Seconde Guerre mondiale, le crumble demandait bien moins de farine et de beurre qu'une tourte.",en:"British, and born of rationing: during the Second World War a crumble needed far less flour and butter than a pie."},
d11:{fr:"Médiéval, et le nom dit tout : c'est du pain perdu, rattrapé. Les Anglais l'appellent « French toast », les Espagnols « torrijas ».",en:"Medieval, and the French name says it all: lost bread, rescued. The English call it French toast, the Spanish torrijas."},
d12:{fr:"Europe médiévale. Pocher un fruit dur dans du vin épicé le rendait mangeable et le conservait plusieurs jours.",en:"Medieval Europe. Poaching a hard fruit in spiced wine made it edible and kept it for several days."},
d13:{fr:"Le premier gâteau que font les enfants français, parce qu'il se mesure au pot de yaourt vide : pas de balance, pas d'excuse.",en:"The first cake French children make, because it is measured in empty yoghurt pots: no scales, no excuses."},
d14:{fr:"Piémont. « Panna cotta » veut dire crème cuite, ce qui est presque un contresens : elle n'est que chauffée, jamais bouillie.",en:"Piedmont. Panna cotta means cooked cream, which is almost a misnomer: it is only warmed, never boiled."},
d15:{fr:"Chicago, 1893. Une pâtissière du Palmer House aurait créé ce gâteau dense pour les paniers-repas de l'Exposition universelle.",en:"Chicago, 1893. A pastry cook at the Palmer House is said to have created this dense cake for lunch baskets at the World's Fair."},
d16:{fr:"Massachusetts, années 1930. Ruth Wakefield cassa du chocolat dans sa pâte en espérant qu'il fondrait. Il ne fondit pas, et tant mieux.",en:"Massachusetts, 1930s. Ruth Wakefield broke chocolate into her dough expecting it to melt. It didn't, and so much the better."},
d17:{fr:"Commercy, en Lorraine. La bosse vient du choc thermique : pâte froide, four très chaud. Proust en a fait le reste.",en:"Commercy, in Lorraine. The hump comes from thermal shock: cold batter, very hot oven. Proust did the rest."},
d18:{fr:"Le plus récent de ce carnet : le smoothie bowl est né dans les années 2010, sur les réseaux autant que dans les cuisines.",en:"The most recent thing in this book: the smoothie bowl appeared in the 2010s, on social media as much as in kitchens."},
d19:{fr:"Limousin. La tradition veut qu'on laisse les noyaux : ils parfumeraient la pâte à l'amande pendant la cuisson.",en:"Limousin. Tradition says to leave the stones in: they are held to lend an almond note during baking."},
d20:{fr:"Né sur internet au milieu des années 2000. Sa raison d'être est arithmétique : un gâteau pour une personne, en quatre-vingt-dix secondes.",en:"Born on the internet in the mid 2000s. Its reason to exist is arithmetic: a cake for one person, in ninety seconds."},
d21:{fr:"Lamotte-Beuvron, Sologne. Les sœurs Tatin auraient raté une tarte aux pommes et l'auraient rattrapée en posant la pâte par-dessus.",en:"Lamotte-Beuvron, in the Sologne. The Tatin sisters are said to have botched an apple tart and saved it by laying the pastry on top."},
d22:{fr:"Le cœur coulant fut popularisé dans les années 1980, notamment par Michel Bras en Aubrac. Tout se joue sur deux minutes de cuisson.",en:"The molten centre was popularised in the 1980s, notably by Michel Bras in the Aubrac. Everything hinges on two minutes of baking."},
d23:{fr:"La meringue sur une crème au citron est attribuée à Elizabeth Goodfellow, pâtissière de Philadelphie au début du XIXe siècle.",en:"Meringue over lemon curd is attributed to Elizabeth Goodfellow, a Philadelphia pastry cook of the early nineteenth century."},
d24:{fr:"Les Grecs en servaient aux athlètes d'Olympie. La version new-yorkaise, au cream cheese, ne date que de la fin du XIXe siècle.",en:"The Greeks served it to athletes at Olympia. The New York version, with cream cheese, dates only from the late nineteenth century."},
d25:{fr:"Vénétie ou Frioul, années 1960-70. « Tira mi sù » signifie « remonte-moi » : le café et le sucre étaient censés donner un coup de fouet.",en:"Veneto or Friuli, 1960s or 70s. Tira mi sù means pick me up: the coffee and sugar were meant to give a lift."},
d26:{fr:"Bretagne. « Far » vient du latin « far », le blé. À l'origine c'était une bouillie salée, servie avec la viande.",en:"Brittany. Far comes from the Latin far, wheat. It began as a savoury porridge served alongside meat."},
d27:{fr:"La poudre d'amandes au fond n'est pas une gourmandise : elle absorbe le jus des pommes et empêche la pâte de détremper.",en:"The ground almonds on the base are not an indulgence: they absorb the apple juices and stop the pastry going soggy."},
d28:{fr:"Le flan pâtissier est le gâteau des boulangeries parisiennes, vendu à la part depuis plus d'un siècle et jamais servi entier.",en:"Custard tart is the cake of Paris bakeries, sold by the slice for over a century and never served whole."},
d29:{fr:"Le crumble aux fruits rouges est la version estivale du dessert britannique : les fruits rendent plus de jus, la croûte doit être plus épaisse.",en:"Berry crumble is the summer version of the British dessert: the fruit releases more juice, so the topping must be thicker."},
d30:{fr:"Cuisines du palais de Topkapı, à Istanbul. Le baklava se partageait entre les janissaires lors d'une cérémonie annuelle.",en:"The kitchens of Topkapı Palace in Istanbul. Baklava was shared among the janissaries at an annual ceremony."},
d31:{fr:"Cambo-les-Bains, XIXe siècle. Le gâteau basque d'origine était fourré à la confiture de cerise noire d'Itxassou, pas à la crème.",en:"Cambo-les-Bains, nineteenth century. The original gâteau basque was filled with black cherry jam from Itxassou, not with cream."},
d32:{fr:"Nommée en l'honneur de la reine Charlotte, épouse de George III. Carême en tira la charlotte russe, montée avec des biscuits à la cuillère.",en:"Named in honour of Queen Charlotte, wife of George III. Carême developed the charlotte russe from it, built with sponge fingers."},
d33:{fr:"Bordeaux. Les couvents récupéraient les jaunes d'œufs dont les chais se débarrassaient : les blancs servaient à clarifier le vin.",en:"Bordeaux. Convents took in the egg yolks the wine cellars discarded: the whites were used to fine the wine."},
d34:{fr:"Le marbrage n'est pas décoratif à l'origine : il permettait d'utiliser deux restes de pâte dans un seul moule.",en:"Marbling was not originally decorative: it allowed two leftover batters to be used in a single tin."}

function enSaison(nom, mois) {
  const s = SAISONS[(nom || "").toLowerCase()];
  if (!s) return null;                 // pas un produit frais suivi
  return s.indexOf(mois) >= 0;
}

// part des produits frais de la recette qui sont de saison, dans [-1, 1]
function scoreSaison(r, mois) {
  let bons = 0, mauvais = 0;
  for (const i of r.ing) {
    const e = enSaison(i.n, mois);
    if (e === null) continue;
    if (e) bons++; else mauvais++;
  }
  const n = bons + mauvais;
  if (!n) return 0;
  return (bons - mauvais) / n;
}

function moisNum(idxSem) { return dateDuJour(idxSem, 3).getUTCMonth() + 1; }

function temperatureMois(idxSem) {
  const r = state.reglages;
  if (r.forcerMeteo === "chaud") return 28;
  if (r.forcerMeteo === "froid") return 6;
  if (r.forcerMeteo === "tempere") return 18;
  const c = CLIMATS[r.zone] || CLIMATS.rhonealpes;
  return c.t[moisNum(idxSem) - 1];
}

function libelleTemperature(t) {
  if (t >= 26) return "il fera chaud";
  if (t >= 21) return "il fera doux";
  if (t >= 13) return "temps tempéré";
  return "il fera froid";
}

// un plat chaud pénalisé l'été, un plat froid pénalisé l'hiver. Dans [-1, 1].
function scoreTemperature(r, t) {
  const f = Math.max(-1, Math.min(1, (t - 18) / 8));    // -1 = froid, +1 = chaud
  const tr = r.traits || [];
  const a = x => tr.indexOf(x) >= 0;
  const chaud = (a("soupe") ? 1 : 0) + (a("mijote") ? 1 : 0) + (a("four") ? 0.8 : 0) + (a("long") ? 0.4 : 0);
  const frais = (r.froid ? 0.8 : 0) + (a("salade") ? 1 : 0) + (a("cru") ? 1 : 0) + (a("froid") ? 1 : 0);
  const net = Math.max(-1.5, Math.min(1.5, frais - chaud)) / 1.5;
  return f * net;
}
