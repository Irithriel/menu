  tempsMidiSemaine: 30,        // plat du midi, préparé la veille au soir en plus du dîner
  tempsDinerSemaine: 60,       // dîner du lundi au vendredi
  tempsWeekend: 95,            // samedi et dimanche, midi comme soir
  tempsDessertSemaine: 35,     // dessert de semaine
  dessertsActifs: true,
  budgetMensuel: 300,
  enseigne: "mixte",
  modele: "claude-sonnet-5",
  cle: "",
  placard: ["sel", "poivre", "huile d'olive", "farine", "sucre", "levure chimique"],
  historiqueMax: 16,
  langue: "fr", theme: "potager", densite: "normal",
  vueSemaine: "jours", afficherPrix: true,
  regimes: [], evites: [], cuisinesOff: [],
  alcoolMoments: [-1, 1, 3, 5, 7, 9, 11, 13],  // moments où l'on accepte de cuisiner avec de l'alcool
  heureMidi: "12:30", heureSoir: "19:30",      // pour l'export vers l'agenda
  jourCourses: 5, heureCourses: "10:00", alerteCuisine: 30,
  zone: "rhonealpes", forcerMeteo: "auto",   // climat : mois + région, sans réseau
  poidsSaison: 2, poidsMeteo: 2              // influence sur le tirage (0 = aucune)
};

const JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
const JOURS_C = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const RAYONS = {
  legumes: "Fruits & légumes", viande: "Boucherie & poissonnerie", cremerie: "Crèmerie & œufs",
  surgele: "Surgelés", epicerie: "Épicerie", boulangerie: "Boulangerie", boisson: "Boissons"
};
const ORDRE_RAYONS = ["legumes", "viande", "cremerie", "surgele", "epicerie", "boulangerie", "boisson"];
const TEINTES = ["#2F6B3F", "#6E2D46", "#1D5A6B", "#8A6410", "#4A3F7A", "#7A3520", "#3C6155", "#5B4A2E"];
const COMPTABLES = ["pièce", "gousse", "cube", "bouquet", "tranche"];

// note -> influence sur le tirage
const POIDS_NOTE = { 1: -5, 2: -2.5, 3: 0, 4: 1.5, 5: 3 };

// contexte saisonnier de la semaine en cours de génération
let moisGen = 1, tempGen = 18;
// mois retenu pour la saisonnalité des prix : celui du plan que l'on chiffre
let moisPrix = null;
function moisCourantPrix() { return moisPrix !== null ? moisPrix : moisNum(semaineCourante); }

// alcool en cuisine : seuls ces ingrédients comptent
const ALCOOLS = ["vin rouge", "vin blanc sec", "bière blonde", "rhum"];
// les dix moments où l'on est réellement en cuisine dans la semaine
const MOMENTS_CUISSON = [-1, 1, 3, 5, 7, 9, 10, 11, 12, 13];
const PRESETS_ALCOOL = {
  "Jamais": [],
  "Dîners uniquement": [-1, 1, 3, 5, 7, 9, 11, 13],
  "En semaine uniquement": [1, 3, 5, 7, 9],
  "Le week-end uniquement": [-1, 10, 11, 12, 13],
  "Toujours": MOMENTS_CUISSON.slice()
};

function contientAlcool(r) { return r.ing.some(i => ALCOOLS.indexOf(i.n.toLowerCase()) >= 0); }
function alcoolPermis(moment) { return (state.reglages.alcoolMoments || []).indexOf(moment) >= 0; }
function libelleMomentCourt(m) {
  if (m === -1) return trad("dim. avant");
  return trad(JOURS_C[Math.floor(m / 2)]) + " " + trad(m % 2 === 0 ? "midi" : "soir");
}

/* ==================================================================
   STOCKAGE
   ================================================================== */
const memoire = {};
const store = {
  lire(c) { try { const v = localStorage.getItem(c); return v === null ? (memoire[c] ?? null) : v; } catch (e) { return memoire[c] ?? null; } },
  ecrire(c, v) { memoire[c] = v; try { localStorage.setItem(c, v); } catch (e) {} }
};

function poolParDefaut() { return JSON.parse(JSON.stringify([...PLATS_A, ...PLATS_B, ...DESSERTS])); }

let state = {
  recettes: [], plans: {}, reglages: { ...DEFAUTS }, coches: {},
  quizReponses: [], profilQuiz: {}, profilAppris: {}, prixPerso: {}
};

function charger() {
  const brut = store.lire("menu-semaine-v3");
  if (brut) {
    try {
      const d = JSON.parse(brut);
      state.recettes = (d.recettes && d.recettes.length) ? completerPool(d.recettes) : poolParDefaut();
      state.plans = d.plans || {};
      state.coches = d.coches || {};
      state.quizReponses = d.quizReponses || [];
      state.prixPerso = d.prixPerso || {};
      state.reglages = { ...DEFAUTS, ...(d.reglages || {}) };
      return;
    } catch (e) {}
  }
  // reprise éventuelle d'une version précédente : on ne garde que les notes
  const ancien = store.lire("menu-semaine-v2") || store.lire("menu-semaine-v1");
  state.recettes = poolParDefaut();
  if (ancien) {
    try {
      const d = JSON.parse(ancien);
      for (const r of (d.recettes || [])) {
        const cible = state.recettes.find(x => x.nom === r.nom);
        if (cible && r.bonus) cible.note = r.bonus > 0 ? 5 : 2;
      }
      if (d.quizReponses) state.quizReponses = [];
    } catch (e) {}
  }
}

// un pool sauvegardé peut dater d'une version antérieure : on ajoute les recettes manquantes
function completerPool(anciennes) {
  const out = anciennes.slice();
  const noms = new Set(out.map(r => r.nom));
  for (const r of poolParDefaut()) if (!noms.has(r.nom)) out.push(r);
  for (const r of out) if (!r.categorie) r.categorie = "plat";
  return out;
}

function sauver() { store.ecrire("menu-semaine-v3", JSON.stringify(state)); }

/* ==================================================================
   SEMAINES
   ================================================================== */
const EPOCH = Date.UTC(2024, 0, 1);
function lundiDe(d0) {
  const d = new Date(Date.UTC(d0.getFullYear(), d0.getMonth(), d0.getDate()));
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d;
}
function indexSemaine(d) { return Math.round((lundiDe(d).getTime() - EPOCH) / 604800000); }
function dateDuJour(i, j) { return new Date(EPOCH + i * 604800000 + j * 86400000); }
function loc() { return state.reglages.langue === "en" ? "en-GB" : "fr-FR"; }
function formatJour(d) { return d.toLocaleDateString(loc(), { day: "numeric", month: "short", timeZone: "UTC" }); }
// une semaine appartient au mois de son jeudi
function moisDeSemaine(i) { const d = dateDuJour(i, 3); return d.getUTCFullYear() + "-" + d.getUTCMonth(); }

let semaineCourante = indexSemaine(new Date());

function derniereUtilisation() {
  const m = {};
  for (const [i, plan] of Object.entries(state.plans)) {
    const n = Number(i);
    const toutes = [...plan.sessions, ...(plan.sessionsDessert || [])];
    for (const s of toutes) if (m[s.recetteId] === undefined || n > m[s.recetteId]) m[s.recetteId] = n;
  }
  return m;
}

/* ==================================================================
   GOÛTS : quiz + notes
   ================================================================== */
function clesGout(r) {
  const c = ["base:" + r.base, "cuisine:" + (r.cuisine || "francaise")];
  for (const t of (r.traits || [])) c.push("trait:" + t);
  if (r.veg) c.push("trait:veg");
  if (r.minutes <= 30 && c.indexOf("trait:rapide") < 0) c.push("trait:rapide");
  return c;
}

function recalculerProfil() {
  const p = {};
  state.quizReponses.forEach((rep, i) => {
    if (rep === null || rep === undefined || !QUIZ[i]) return;
    const o = QUIZ[i].o[rep];
    if (o) for (const [k, v] of Object.entries(o.w)) p[k] = (p[k] || 0) + v;
  });
  state.profilQuiz = p;

  // ce que les notes ont appris, recalculé de zéro à chaque fois
  const a = {};
  for (const r of state.recettes) {
    if (!r.note) continue;
    const d = (r.note - 3) * 0.35;
    for (const c of clesGout(r)) a[c] = (a[c] || 0) + d;
  }
  for (const k of Object.keys(a)) a[k] = Math.max(-5, Math.min(5, a[k]));
  state.profilAppris = a;
}

function profilCombine() {
  const p = { ...state.profilQuiz };
  for (const [k, v] of Object.entries(state.profilAppris || {})) p[k] = (p[k] || 0) + v;
  return p;
}

function calibrerGout(actives) {
  const p = profilCombine();
  if (!Object.keys(p).length) return () => 0;
  const brut = new Map(); let max = 0;
  for (const r of actives) {
    let s = 0, n = 0;
    for (const c of clesGout(r)) if (p[c] !== undefined) { s += p[c]; n++; }
    const v = n ? s / Math.sqrt(n) : 0;
    brut.set(r.id, v);
    if (Math.abs(v) > max) max = Math.abs(v);
  }
  if (!max) return () => 0;
  return (r) => (brut.get(r.id) || 0) / max;
}

function quizRepondu() { return state.quizReponses.filter(x => x !== null && x !== undefined).length; }

/* ==================================================================
   COÛTS
   ================================================================== */
function prixDe(nom) {
  const c = nom.toLowerCase();
  if (state.prixPerso[c] !== undefined) return { p: state.prixPerso[c].p, u: state.prixPerso[c].u };
  return PRIX[c] || PRIX[nom] || null;
}

function coutLigne(ing, facteur) {
  const p = prixDe(ing.n);
  const fe = (ENSEIGNES[state.reglages.enseigne] || ENSEIGNES.carrefour).f[ing.r] || 1;
  const q = ing.q * (facteur === undefined ? 1 : facteur);
  if (!p) {
    const base = PRIX_DEFAUT[ing.r] || 5;
    const kg = VERS_KG[ing.u] !== undefined ? q * VERS_KG[ing.u] : 0.15 * q;
    return kg * base * fe;
  }
  let qq;
  if (p.u === "kg") qq = VERS_KG[ing.u] !== undefined ? q * VERS_KG[ing.u] : q * 0.15;
  else if (p.u === "l") qq = VERS_L[ing.u] !== undefined ? q * VERS_L[ing.u] : q * 0.15;
  else qq = q;
  const saison = enSaison(ing.n, moisCourantPrix());
  return qq * p.p * fe * (saison === false ? 1.4 : 1);
}

function coutRecette(r, facteur) {
  return r.ing.reduce((a, i) => a + coutLigne(i, facteur), 0);
}

function toutesSessions(plan) {
  return [...plan.sessions.map((s, i) => ({ s, i, dessert: false })),
          ...(plan.sessionsDessert || []).map((s, i) => ({ s, i, dessert: true }))];
}

function coutSemaine(plan, forcerDefaut) {
  const garde = moisPrix;
  moisPrix = moisNum(plan.idxSem);
  let t = 0;
  for (const { s, i, dessert } of toutesSessions(plan)) {
    const r = state.recettes.find(x => x.id === s.recetteId);
    if (!r) continue;
    const portions = forcerDefaut
      ? s.creneaux.length * state.reglages.couvertsDefaut
      : portionsSession(plan, i, dessert);
    t += coutRecette(r, portions / r.batch);
  }
  moisPrix = garde;
  return t;
}

function cibleHebdo() { return state.reglages.budgetMensuel * 12 / 52; }

/* ==================================================================
   PORTIONS
   ================================================================== */
function portionsSession(plan, si, dessert) {
  if (dessert) {
    const s = plan.sessionsDessert[si];
    return s.creneaux.reduce((a, j) => a + (plan.desserts[j] ? plan.desserts[j].couverts : 1), 0);
  }
  const s = plan.sessions[si];
  return s.creneaux.reduce((a, i) => a + (plan.creneaux[i] ? (plan.creneaux[i].couverts || 1) : 0), 0);
}
function facteurSession(plan, si, dessert) {
  const s = dessert ? plan.sessionsDessert[si] : plan.sessions[si];
  const r = state.recettes.find(x => x.id === s.recetteId);
  if (!r || !r.batch) return 1;
  return portionsSession(plan, si, dessert) / r.batch;
}
// couverts d'un dessert = le plus grand des deux repas du jour
function couvertsJour(plan, j) {
  const a = plan.creneaux[j * 2] ? plan.creneaux[j * 2].couverts : state.reglages.couvertsDefaut;
  const b = plan.creneaux[j * 2 + 1] ? plan.creneaux[j * 2 + 1].couverts : state.reglages.couvertsDefaut;
  return Math.max(a, b);
}

/* ==================================================================
   GÉNÉRATEUR

   Rythme de la semaine :
     lundi à vendredi, le soir  -> on cuisine le dîner (temps confortable)
                                   et, dans la foulée, le repas du lendemain midi
     lundi à vendredi, le midi  -> jamais de cuisine : soit les restes du dîner
                                   de la veille, soit le plat préparé en même temps
     samedi et dimanche         -> les quatre repas sont cuisinés sur le moment
     lundi midi                 -> préparé le dimanche soir précédent
   ================================================================== */
function genererPlan(idxSem) {
  const r = state.reglages;
  const ancien = state.plans[idxSem];
  delete state.plans[idxSem];
  const vus = derniereUtilisation();
  if (ancien) state.plans[idxSem] = ancien;

  const plats = poolActif("plat");
  const desserts = poolActif("dessert");
  if (!plats.length) return null;

  const gout = calibrerGout(poolActif());
  moisGen = moisNum(idxSem);
  tempGen = temperatureMois(idxSem);
  let assoupli = false;

  const eligibles = (pool, besoin) => {
    const ok = pool.filter(x => { const d = vus[x.id]; return d === undefined || (idxSem - d) >= r.cooldown; });
    if (ok.length >= besoin) return ok;
    assoupli = true;
    return pool.slice();
  };

  const couverts = new Array(14).fill(r.couvertsDefaut);
  if (ancien) for (let i = 0; i < 14; i++) if (ancien.creneaux[i] && ancien.creneaux[i].couverts) couverts[i] = ancien.creneaux[i].couverts;

  // --- quels midis de semaine sont les restes du dîner de la veille ---
  // lundi midi est exclu : il n'y a pas de dîner la veille dans la semaine
  const budget = Math.max(0, Math.min(4, r.restesMax));
  const restes = {};
  const candidats = [2, 4, 6, 8].map(L => ({ L, p: Math.random() })).sort((a, b) => b.p - a.p);
  for (const c of candidats) {
    if (Object.keys(restes).length >= budget) break;
    restes[c.L] = c.L - 1;    // le dîner de la veille
  }

  // --- construction de la liste des séances ---
  const creneaux = new Array(14).fill(null);
  const sessions = [];
  const bases = [];
  const utilisees = new Set();
  const dispo = eligibles(plats, 14 - budget);

  function poser(slots, moment, contrainte) {
    contrainte.alcool = alcoolPermis(moment);
    const choix = choisirRecette(dispo, utilisees, bases, vus, idxSem, gout, contrainte);
    if (!choix) return;
    utilisees.add(choix.id);
    bases.push(choix.base);
    if (bases.length > 3) bases.shift();
    const si = sessions.length;
    for (const i of slots) {
      creneaux[i] = {
        sessionIdx: si, recetteId: choix.id, couverts: couverts[i],
        role: i === moment ? "frais" : (contrainte.pourRestes ? "restes" : "veille")
      };
    }
    sessions.push({ recetteId: choix.id, moment, teinte: TEINTES[si % TEINTES.length], creneaux: slots.slice(), contrainte });
  }

  // lundi midi : préparé le dimanche soir précédent
  poser([0], -1, { max: r.tempsMidiSemaine, froid: true, pourRestes: false });

  // du lundi au vendredi
  for (let j = 0; j <= 4; j++) {
    const soir = j * 2 + 1;
    const midiLendemain = (j + 1) * 2;
    const avecRestes = restes[midiLendemain] === soir;
    poser(avecRestes ? [soir, midiLendemain] : [soir], soir,
          { max: r.tempsDinerSemaine, froid: avecRestes, pourRestes: avecRestes });
    // le midi du lendemain, s'il n'est pas des restes, est un plat préparé ce soir-là
    if (!avecRestes && midiLendemain <= 8) {
      poser([midiLendemain], soir, { max: r.tempsMidiSemaine, froid: true, pourRestes: false });
    }
  }

  // week-end : tout est cuisiné sur le moment
  for (const s of [10, 11, 12, 13]) {
    if (creneaux[s] === null) poser([s], s, { max: r.tempsWeekend, froid: false, pourRestes: false });
  }

  // filet de sécurité
  for (let s = 0; s < 14; s++) if (creneaux[s] === null) poser([s], s, { max: 999, froid: false, pourRestes: false });

  const plan = { idxSem, creneaux, sessions, desserts: null, sessionsDessert: [], assoupli, genereLe: new Date().toISOString() };

  if (r.dessertsActifs && desserts.length) genererDesserts(plan, desserts, vus, idxSem, gout, eligibles);
  else plan.desserts = new Array(7).fill(null);

  ajusterAuBudget(plan, dispo, vus, idxSem, gout);
  return plan;
}

function genererDesserts(plan, desserts, vus, idxSem, gout, eligibles) {
  const r = state.reglages;
  plan.desserts = new Array(7).fill(null);
  plan.sessionsDessert = [];
  const utilisees = new Set();

  const rapides = desserts.filter(x => x.minutes <= r.tempsDessertSemaine);
  const weekend = desserts.filter(x => x.batch >= 4 && x.keeps >= 2 && x.minutes > r.tempsDessertSemaine);
  const poolS = eligibles(rapides.length ? rapides : desserts, 3);
  const poolW = eligibles(weekend.length ? weekend : desserts, 1);

  // semaine : on enchaîne des desserts simples qui tiennent plusieurs jours
  let j = 0, garde = 0;
  while (j <= 4 && garde++ < 12) {
    const choix = choisirRecette(poolS, utilisees, [], vus, idxSem, gout,
      { max: r.tempsDessertSemaine, dessert: true, alcool: alcoolPermis(j * 2) || alcoolPermis(j * 2 + 1) });
    if (!choix) break;
    utilisees.add(choix.id);
    const si = plan.sessionsDessert.length;
    const jours = [];
    const debut = j;
    const portionsDispo = Math.max(1, Math.floor(choix.batch / Math.max(1, couvertsJour(plan, j))));
    for (let k = 0; k < portionsDispo && j <= 4; k++) {
      if (j - debut > choix.keeps) break;
      plan.desserts[j] = { sessionIdx: si, recetteId: choix.id, couverts: couvertsJour(plan, j), role: jours.length ? "restes" : "frais" };
      jours.push(j); j++;
    }
    plan.sessionsDessert.push({ recetteId: choix.id, jour: jours[0], creneaux: jours, teinte: TEINTES[si % TEINTES.length], dessert: true });
  }

  // week-end : un seul dessert, fait le samedi, qui tient jusqu'au dimanche
  const choixW = choisirRecette(poolW, utilisees, [], vus, idxSem, gout,
    { dessert: true, weekend: true, alcool: alcoolPermis(10) || alcoolPermis(11) });
  if (choixW) {
    const si = plan.sessionsDessert.length;
    for (const jj of [5, 6]) plan.desserts[jj] = { sessionIdx: si, recetteId: choixW.id, couverts: couvertsJour(plan, jj), role: jj === 5 ? "frais" : "restes" };
    plan.sessionsDessert.push({ recetteId: choixW.id, jour: 5, creneaux: [5, 6], teinte: TEINTES[si % TEINTES.length], dessert: true });
  }
}

function choisirRecette(pool, utilisees, bases, vus, idxSem, gout, c) {
  c = c || {};
  let cands = pool.filter(x => !utilisees.has(x.id));
  if (!cands.length) return null;

  if (c.max) {
    const t = cands.filter(x => x.minutes <= c.max);
    if (t.length) cands = t;
  }
  if (c.pourRestes) {
    const t = cands.filter(x => x.keeps >= 2);
    if (t.length) cands = t;
  }
  if (c.alcool === false) {
    const t = cands.filter(x => !contientAlcool(x));
    if (t.length) cands = t;          // règle de l'utilisateur : on ne la contourne que si le pool est vide
  }
  if (bases && bases.length) {
    const t = cands.filter(x => bases.indexOf(x.base) < 0);
    if (t.length) cands = t;
  }

  const poids = state.reglages.poidsGout;
  const scores = cands.map(x => {
    const d = vus[x.id];
    const anc = Math.min(12, d === undefined ? 12 : idxSem - d);
    let s = anc + Math.random() * 3 + gout(x) * 4 * poids;
    if (x.note) s += (POIDS_NOTE[x.note] || 0) * poids;
    s += scoreSaison(x, moisGen) * 3 * state.reglages.poidsSaison;
    s += scoreTemperature(x, tempGen) * 3 * state.reglages.poidsMeteo;
    if (c.froid && x.froid) s += 1.5;
    if (c.weekend) s += Math.min(3, (x.minutes - 40) / 20);   // le week-end, on peut voir plus grand
    return { x, s };
  });
  scores.sort((a, b) => b.s - a.s);
  return scores[0].x;
}

// remplace les séances les plus chères tant qu'on dépasse la cible hebdomadaire
function ajusterAuBudget(plan, dispo, vus, idxSem, gout) {
  const cible = cibleHebdo();
  if (!cible || cible <= 0) return;
  let tours = 0;
  while (coutSemaine(plan, true) > cible && tours++ < 12) {
    const prises = new Set(plan.sessions.map(s => s.recetteId));
    let pire = -1, coutPire = 0;
    plan.sessions.forEach((s, i) => {
      const r = state.recettes.find(x => x.id === s.recetteId);
      if (!r) return;
      const c = coutRecette(r, (s.creneaux.length * state.reglages.couvertsDefaut) / r.batch);
      if (c > coutPire) { coutPire = c; pire = i; }
    });
    if (pire < 0) break;
    const s = plan.sessions[pire];
    const contrainte = s.contrainte || {};
    const candidats = dispo.filter(x => !prises.has(x.id) && (!contrainte.max || x.minutes <= contrainte.max) && (!contrainte.pourRestes || x.keeps >= 2));
    if (!candidats.length) break;
    let meilleur = null, meilleurCout = coutPire;
    for (const x of candidats) {
      const c = coutRecette(x, (s.creneaux.length * state.reglages.couvertsDefaut) / x.batch);
      const penaliteGout = (gout(x) * 2 + (x.note ? POIDS_NOTE[x.note] / 2 : 0));
      if (c < meilleurCout - 0.2 && c - penaliteGout * 0.3 < meilleurCout) { meilleur = x; meilleurCout = c; }
    }
    if (!meilleur) break;
    s.recetteId = meilleur.id;
    for (const i of s.creneaux) plan.creneaux[i].recetteId = meilleur.id;
  }
}

/* ==================================================================
   LISTE DE COURSES
   ================================================================== */
function listeCourses(plan) {
  const garde = moisPrix;
  moisPrix = moisNum(plan.idxSem);
  const total = {};
  for (const { s, i, dessert } of toutesSessions(plan)) {
    const rec = state.recettes.find(x => x.id === s.recetteId);
    if (!rec) continue;
    const f = facteurSession(plan, i, dessert);
    for (const ing of rec.ing) {
      const cle = ing.n.toLowerCase() + "|" + ing.u;
      if (!total[cle]) total[cle] = { n: ing.n, u: ing.u, q: 0, r: ing.r, cle, origines: [] };
      total[cle].q += ing.q * f;
      const dejaLa = total[cle].origines.find(o => o.id === rec.id);
      if (dejaLa) dejaLa.q += ing.q * f;
      else total[cle].origines.push({
        id: rec.id, q: ing.q * f,
        moment: dessert ? null : s.moment,
        jour: dessert ? s.jour : null
      });
    }
  }
  const placard = state.reglages.placard.map(p => p.toLowerCase());
  const parRayon = {};
  for (const a of Object.values(total)) {
    if (placard.indexOf(a.n.toLowerCase()) >= 0) continue;
    a.cout = coutLigne(a, 1);
    a.horsSaison = enSaison(a.n, moisPrix) === false;
    (parRayon[a.r] = parRayon[a.r] || []).push(a);
  }
  for (const k of Object.keys(parRayon)) parRayon[k].sort((a, b) => a.n.localeCompare(b.n, "fr"));
  moisPrix = garde;
  return parRayon;
}

function formatQte(a, pourCourses) {
  let q = a.q, u = a.u;
  if (u === "g" && q >= 1000) { q = q / 1000; u = "kg"; }
  else if (u === "ml" && q >= 1000) { q = q / 1000; u = "l"; }
  if (u === "g" || u === "ml") q = Math.max(5, Math.round(q / 5) * 5);
  else if (u === "kg" || u === "l") q = Math.max(0.05, Math.round(q * 100) / 100);
  else if (COMPTABLES.indexOf(u) >= 0) q = pourCourses ? Math.max(1, Math.ceil(q - 0.001)) : Math.max(0.5, Math.round(q * 2) / 2);
  else q = Math.max(0.25, Math.round(q * 4) / 4);
  const colle = ["g", "kg", "ml", "l", "cl"].indexOf(u) >= 0;
  if (colle) return q + " " + u;
  let mot = trad(u);
  if (q > 1 && COMPTABLES.indexOf(u) >= 0) mot = PLURIELS[mot] || (mot + "s");
  return q + " " + mot;
}
function euros(x) { return (Math.round(x * 100) / 100).toFixed(2).replace(".", ",") + " €"; }

function bloc4(v, l) { const d = el("div", "stat"); d.appendChild(el("strong", null, String(v))); d.appendChild(el("span", "petit", l)); return d; }

// nombre de moments distincts où il faut être en cuisine.
// Un dessert se prépare pendant la séance de cuisine du jour : il n'ajoute pas d'occasion.
function occasions(plan) {
  const m = new Set(plan.sessions.map(s => s.moment));
  for (const s of (plan.sessionsDessert || [])) {
    const j = s.jour;
    if (!m.has(j * 2) && !m.has(j * 2 + 1)) m.add("d" + j);
  }
  return m.size;
}

function libelleMoment(m) {
  if (m === -1) return trad("dimanche soir précédent");
  return trad(JOURS[Math.floor(m / 2)]) + " " + trad(m % 2 === 0 ? "midi" : "soir");
}

function stepper(label, valeur, cb) {

  plus.onclick = () => { v = Math.min(12, v + 1); aff.textContent = String(v); cb(v); };
  w.appendChild(moins); w.appendChild(aff); w.appendChild(plus);

function copierListe(parRayon) {

function copier(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast("Copié")).catch(() => secours(t));
  else secours(t);
}
function secours(t) {
  const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Copié"); } catch (e) { toast("Copie impossible"); }
  document.body.removeChild(ta);
}

function rendreBudget(vue) {
  const r = state.reglages;

  let total = 0, totalBase = 0;
  for (const i of semaines) { total += coutSemaine(state.plans[i]); totalBase += coutSemaine(state.plans[i], true); }

  const reste = r.budgetMensuel - total;
  const j = el("div", "jauge-budget grande");
  const dedans = el("div", "jauge-in" + (total > r.budgetMensuel ? " depasse" : ""));

  const st = el("div", "stats");
  st.appendChild(bloc4(euros(total), "engagé"));
  st.appendChild(bloc4(euros(r.budgetMensuel), "budget"));
  st.appendChild(bloc4(euros(Math.abs(reste)), reste >= 0 ? "restant" : "de dépassement"));
  vue.appendChild(st);

  if (total > totalBase + 0.5) {
    vue.appendChild(el("div", "note", "Sur ce mois, " + euros(total - totalBase) +
      " viennent des convives ajoutés. Hors invités, le mois serait à " + euros(totalBase) + "."));
  }
  if (semaines.length && semaines.length < 4) {
    const proj = total / semaines.length * 4.345;
    vue.appendChild(el("div", "petit", semaines.length + " semaine(s) planifiée(s). Au même rythme, le mois finirait autour de " + euros(proj) + "."));
  }

  vue.appendChild(el("h3", null, "Semaine par semaine"));
  if (!semaines.length) vue.appendChild(el("div", "vide", "Aucune semaine planifiée pour ce mois."));

function rendreQuiz(vue) {
  const i = ecranQuiz;
  if (i >= QUIZ.length) { rendreBilanQuiz(vue); return; }
  const q = QUIZ[i];

  const haut = el("div", "quiz-haut");
  const qq = el("button", "retour", "‹ Quitter"); qq.onclick = () => { ecranQuiz = null; rendre(); };
  haut.appendChild(qq);

  vue.appendChild(haut);

  const j = el("div", "jauge"); const b = el("div", "jauge-in");
  b.style.width = Math.round((i / QUIZ.length) * 100) + "%"; j.appendChild(b); vue.appendChild(j);

  vue.appendChild(el("div", "quiz-section", SECTIONS[q.s]));
  vue.appendChild(el("h2", "quiz-q", q.q));

  const choisi = state.quizReponses[i];
  q.o.forEach((o, k) => {
    const bt = el("button", "quiz-o" + (choisi === k ? " actif" : ""), o.t);

  });

  const pied = el("div", "barre");
  if (i > 0) { const p = el("button", "cta-secondaire", "Précédente"); p.onclick = () => { ecranQuiz = i - 1; rendre(); }; pied.appendChild(p); }
  const s = el("button", "cta-secondaire", "Passer");
  s.onclick = () => { state.quizReponses[i] = null; sauver(); ecranQuiz = i + 1; rendre(); };
  pied.appendChild(s);
  const f = el("button", "cta-secondaire", "Terminer ici");
  f.onclick = () => { ecranQuiz = QUIZ.length; rendre(); };
  pied.appendChild(f);
  vue.appendChild(pied);

  recalculerProfil();

    const d = el("div", "puces"); for (const [k] of plus) d.appendChild(el("span", "puce plus", LIBELLES_GOUT[k])); vue.appendChild(d);
  }

function ouvrirEditeur(id) {
  const modele = id ? state.recettes.find(x => x.id === id) : {
    id: "u" + Date.now(), nom: "Nouvelle recette", categorie: "plat", base: "legume",
    cuisine: "francaise", traits: ["rapide"], batch: 2, keeps: 3, minutes: 30, froid: false, veg: true,
    ing: [{ n: "oignon", q: 1, u: "pièce", r: "legumes" }], etapes: ["Première étape."]
  };
  const carte = feuille(id ? "Modifier" : "Nouvelle recette");

  const ta = el("textarea", "editeur"); ta.value = JSON.stringify(modele, null, 2); carte.appendChild(ta);
  const barre = el("div", "barre");
  const ok = el("button", "cta", "Enregistrer");

    try {
      const o = JSON.parse(ta.value);

      o.batch = Number(o.batch) || 1; o.keeps = Number(o.keeps) || 2; o.minutes = Number(o.minutes) || 30;
      o.categorie = o.categorie || "plat";

      sauver(); fermerModale(); rendre();
    } catch (e) { toast("JSON invalide : " + e.message); }

  barre.appendChild(ok);

    const del = el("button", "cta-secondaire danger", "Supprimer");

  const e = Object.entries(p).filter(([k]) => LIBELLES_GOUT[k]).sort((a, b) => b[1] - a[1]);
  let t = "";
  const plus = e.filter(x => x[1] > 0).slice(0, 10).map(x => LIBELLES_GOUT[x[0]]);
  const moins = e.filter(x => x[1] < 0).reverse().slice(0, 10).map(x => LIBELLES_GOUT[x[0]]);
  if (plus.length) t += "\nGoûts confirmés : " + plus.join(", ") + ".";
  if (moins.length) t += "\nÀ éviter : " + moins.join(", ") + ".";
  const bonnes = state.recettes.filter(r => r.note >= 4).map(r => r.nom);
  const mauvaises = state.recettes.filter(r => r.note && r.note <= 2).map(r => r.nom);
  if (bonnes.length) t += "\nPlats notés 4 ou 5 : " + bonnes.slice(0, 15).join(", ") + ".";
  if (mauvaises.length) t += "\nPlats mal notés, ne rien proposer d'approchant : " + mauvaises.slice(0, 15).join(", ") + ".";
  return t;
}

async function proposerParIA() {
  const cle = state.reglages.cle;
  if (!cle) { onglet = "reglages"; rendre(); toast("Renseignez d'abord une clé API."); return; }
  toast("Demande en cours…", 60000);
  const noms = state.recettes.map(r => r.nom).join(" ; ");
  const prompt =
    "Tu génères des recettes pour une application de menu hebdomadaire, en français, pour quelqu'un qui cuisine en France " +
    "et fait ses courses chez Grand Frais, Carrefour et Auchan.\n" +
    "Contraintes : ingrédients courants, unités métriques, budget raisonnable." + resumeProfil() + "\n" +
    "Ne propose AUCUNE de ces recettes déjà présentes : " + noms + "\n\n" +
    "Réponds uniquement par un tableau JSON de 5 objets, sans texte ni balises autour :\n" +
    '[{"id":"ia1","nom":"...","categorie":"plat","base":"...","cuisine":"...","traits":["..."],' +
    '"batch":2,"keeps":3,"minutes":35,"froid":true,"veg":false,' +
    '"ing":[{"n":"oignon","q":2,"u":"pièce","r":"legumes"}],"etapes":["...","..."]}]\n' +
    'categorie : "plat" ou "dessert". base pour un plat : boeuf, volaille, porc, agneau, poisson, fruitsdemer, legumineuse, legume, oeuf, pates, riz, tofu, cereale. ' +
    'base pour un dessert : chocolat, fruit, creme, patisserie. ' +
    'cuisine : francaise, italienne, espagnole, grecque, portugaise, mediterraneenne, nordafricaine, moyenorient, indienne, chinoise, japonaise, thai, vietnamienne, coreenne, creole, mexicaine, sudamericaine, americaine, europecentrale, britannique, africaine. ' +
    'traits : epice, mijote, four, fromage, soupe, salade, froid, rapide, legumes, long, sucresale, cru, patisserie, fruit, creme, chocolat. ' +
    'rayons r : ' + ORDRE_RAYONS.join(", ") + '. ' +
    '"froid" = se mange bien froid ou réchauffé le lendemain midi. 4 à 6 étapes.';

  try {
    const rep = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": cle, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: state.reglages.modele, max_tokens: 5000, messages: [{ role: "user", content: prompt }] })
    });
    if (!rep.ok) { toast("Erreur API " + rep.status + " : " + (await rep.text()).slice(0, 110)); return; }
    const data = await rep.json();
    const txt = data.content.map(b => b.type === "text" ? b.text : "").join("").trim();
    const arr = JSON.parse(txt.replace(/```json/g, "").replace(/```/g, "").trim());
    let n = 0;
    for (const x of arr) {
      if (!x.nom || !Array.isArray(x.ing) || !Array.isArray(x.etapes)) continue;
      x.id = "ia" + Date.now() + "-" + (n++);
      x.categorie = x.categorie === "dessert" ? "dessert" : "plat";
      x.batch = Number(x.batch) || 2; x.keeps = Number(x.keeps) || 3; x.minutes = Number(x.minutes) || 30;
      x.traits = Array.isArray(x.traits) ? x.traits : [];
      state.recettes.push(x);
    }
    sauver(); onglet = "recettes"; recetteOuverte = null; ecranQuiz = null; rendre();
    toast(n + " recettes ajoutées");
  } catch (e) { toast("Échec : " + e.message); }
}

// tout le matériel d'une séance de cuisine, dédoublonné
function materielSeance(plan, moment) {
  const s = new Set();
  for (const sess of plan.sessions) {
    if (sess.moment !== moment) continue;
    const r = state.recettes.find(x => x.id === sess.recetteId);
    if (r) materielDe(r).forEach(m => s.add(m));
  }
  for (const sess of (plan.sessionsDessert || [])) {
    const j = moment === -1 ? -1 : Math.floor(moment / 2);
    if (sess.jour !== j) continue;
    const r = state.recettes.find(x => x.id === sess.recetteId);
    if (r) materielDe(r).forEach(m => s.add(m));
  }
  return [...s];
}

/* ==================================================================
   PHOTOS  —  IndexedDB, car les images dépassent vite localStorage
   ================================================================== */
function ouvrirDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("indexedDB absent"));
    const q = indexedDB.open("menu-photos", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("photos");
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function lirePhoto(id) {
  try {
    const db = await ouvrirDB();
    return await new Promise(res => {
      const q = db.transaction("photos").objectStore("photos").get(id);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function ecrirePhoto(id, data) {
  try { const db = await ouvrirDB(); db.transaction("photos", "readwrite").objectStore("photos").put(data, id); }
  catch (e) { toast("Stockage photo indisponible"); }
}
async function effacerPhoto(id) {
  try { const db = await ouvrirDB(); db.transaction("photos", "readwrite").objectStore("photos").delete(id); }
  catch (e) {}
}

// réduction avant stockage : 720 px de large suffisent et tiennent en ~60 Ko
function reduireImage(fichier, maxPx) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxPx / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(fichier);
  });
}

function boutonsPhoto(r, existe, apres) {
  const barre = el("div", "barre");
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment"; inp.style.display = "none";
  inp.onchange = async () => {
    if (!inp.files || !inp.files[0]) return;
    try {
      const d = await reduireImage(inp.files[0], 720);
      await ecrirePhoto(r.id, d);
      toast("Photo enregistrée");
      if (apres) apres();
    } catch (e) { toast("Image illisible"); }
  };
  const b = el("button", "cta-secondaire", existe ? "Remplacer la photo" : "Prendre une photo");
  b.onclick = () => inp.click();
  barre.appendChild(inp); barre.appendChild(b);
  if (existe) {
    const d = el("button", "cta-secondaire danger", "Retirer");
    d.onclick = async () => { await effacerPhoto(r.id); toast("Photo retirée"); if (apres) apres(); };
    barre.appendChild(d);
  }
  return barre;
}

/* ==================================================================
   MINUTEURS  —  ils tournent tant que l'application est ouverte
   ================================================================== */
let minuteurs = [];
let tickId = null;

// durées repérées dans une étape : « 25 min », « 1 h », « 1 h 15 »
function dureesEtape(txt) {
  const out = [];
  const re = /(\d+)\s*h(?:\s*(\d+))?|(\d+)\s*(?:min|minutes)/gi;
  let m;
  while ((m = re.exec(txt))) {
    if (m[1] !== undefined) out.push(Number(m[1]) * 3600 + (Number(m[2]) || 0) * 60);
    else out.push(Number(m[3]) * 60);
  }
  return out.filter(s => s >= 60 && s <= 4 * 3600);
}

function lancerMinuteur(nom, secondes) {
  if (window.Notification && Notification.permission === "default") Notification.requestPermission();
  minuteurs.push({ id: Date.now() + Math.random(), nom, fin: Date.now() + secondes * 1000 });
  if (!tickId) tickId = setInterval(tick, 1000);
  majBandeau();
  toast(nom + " · " + Math.round(secondes / 60) + " min");
}

function tick() {
  const t = Date.now();
  const finis = minuteurs.filter(m => m.fin <= t);
  minuteurs = minuteurs.filter(m => m.fin > t);
  for (const m of finis) sonner(m.nom);
  if (!minuteurs.length) { clearInterval(tickId); tickId = null; }
  majBandeau();
}

function sonner(nom) {
  if (navigator.vibrate) navigator.vibrate([400, 150, 400]);
  try {
    if (window.Notification && Notification.permission === "granted") {
      new Notification(trad("C'est prêt"), { body: nom, icon: "icon-192.png", tag: "minuteur" });
    }
  } catch (e) {}
  toast(trad("C'est prêt") + " : " + nom, 8000);
}

function mmss(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(x).padStart(2, "0");
}

function majBandeau() {
  const z = $("#minuteurs");
  if (!z) return;
  z.innerHTML = "";
  z.classList.toggle("visible", minuteurs.length > 0);
  for (const m of minuteurs.slice().sort((a, b) => a.fin - b.fin)) {
    const li = el("div", "minuteur");
    li.appendChild(el("span", "minuteur-nom", m.nom));
    li.appendChild(el("strong", "minuteur-temps", mmss((m.fin - Date.now()) / 1000)));
    const x = el("button", "minuteur-stop", "×");
    x.onclick = () => { minuteurs = minuteurs.filter(o => o.id !== m.id); majBandeau(); };
    li.appendChild(x);
    z.appendChild(li);
  }
}

/* ==================================================================
   EXPORT CALENDRIER  —  un .ics que l'agenda du téléphone sait lire
   ================================================================== */
function pad(n) { return String(n).padStart(2, "0"); }
function stampUTC(d) {
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" +
         pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00Z";
}
function echapIcs(s) { return String(s).replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n"); }

// heure « flottante » : pas de Z, pas de fuseau. L'agenda l'affiche dans l'heure
// locale du téléphone, ce qui est exactement ce qu'on veut ici.
function stampLocal(d) {
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" +
         pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00";
}

// RFC 5545 : les lignes se replient à 75 octets, la suite commence par une espace
function plier(lignes) {
  const out = [];
  for (const l of lignes) {
    if (l.length <= 70) { out.push(l); continue; }
    out.push(l.slice(0, 70));
    let reste = l.slice(70);
    while (reste.length) { out.push(" " + reste.slice(0, 69)); reste = reste.slice(69); }
  }
  return out;
}

// un moment de cuisine vers une date réelle
function dateMoment(idxSem, moment) {
  const r = state.reglages;
  const jour = moment === -1 ? -1 : Math.floor(moment / 2);
  const midi = moment !== -1 && moment % 2 === 0;
  const d = new Date(dateDuJour(idxSem, Math.max(0, jour)).getTime());
  if (jour === -1) d.setUTCDate(d.getUTCDate() - 1);
  const [h, mn] = (midi ? r.heureMidi : r.heureSoir).split(":").map(Number);
  d.setUTCHours(h, mn, 0, 0);
  return d;
}

function exporterIcs() {
  const plan = state.plans[semaineCourante];
  if (!plan) { toast("Générez d'abord un menu."); return; }
  const r = state.reglages;
  const L = [];
  L.push("BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//menu-semaine//FR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH");

  const ajouter = (debut, minutes, titre, desc, alarmeMin) => {
    const fin = new Date(debut.getTime() + minutes * 60000);
    L.push("BEGIN:VEVENT",
      "UID:" + Math.random().toString(36).slice(2) + "@menu-semaine",
      "DTSTAMP:" + stampUTC(new Date()),
      "DTSTART:" + stampLocal(debut),
      "DTEND:" + stampLocal(fin),
      "SUMMARY:" + echapIcs(titre),
      "DESCRIPTION:" + echapIcs(desc),
      "BEGIN:VALARM", "TRIGGER:-PT" + alarmeMin + "M", "ACTION:DISPLAY",
      "DESCRIPTION:" + echapIcs(titre), "END:VALARM",
      "END:VEVENT");
  };

  // les courses
  const parRayon = listeCourses(plan);
  let liste = "";
  for (const ray of ORDRE_RAYONS) {
    if (!parRayon[ray]) continue;
    liste += trad(RAYONS[ray]) + "\n";
    for (const a of parRayon[ray]) liste += "- " + trad(a.n) + " : " + formatQte(a, true) + "\n";
  }
  const dCourses = new Date(dateDuJour(semaineCourante, r.jourCourses).getTime());
  const [hc, mc] = r.heureCourses.split(":").map(Number);
  dCourses.setUTCHours(hc, mc, 0, 0);
  ajouter(dCourses, 60, trad("Courses de la semaine") + " · " + euros(coutSemaine(plan)), liste, 60);

  // une entrée par séance de cuisine
  const moments = [...new Set(plan.sessions.map(s => s.moment))].sort((a, b) => a - b);
  for (const m of moments) {
    const plats = plan.sessions.filter(s => s.moment === m)
      .map(s => state.recettes.find(x => x.id === s.recetteId)).filter(Boolean);
    const jour = m === -1 ? -1 : Math.floor(m / 2);
    const desserts = (plan.sessionsDessert || []).filter(s => s.jour === jour)
      .map(s => state.recettes.find(x => x.id === s.recetteId)).filter(Boolean);
    const tous = [...plats, ...desserts];
    if (!tous.length) continue;
    const duree = Math.max(...tous.map(x => x.minutes));
    const mat = materielSeance(plan, m);
    const desc = tous.map(x => "• " + trad(x.nom) + " (" + x.minutes + " min)").join("\n") +
      (mat.length ? "\n\n" + trad("Matériel") + " : " + mat.map(trad).join(", ") : "");
    ajouter(dateMoment(semaineCourante, m), duree,
      trad("Cuisine") + " · " + tous.map(x => trad(x.nom)).join(", "), desc, r.alerteCuisine);
  }

  L.push("END:VCALENDAR");
  const blob = new Blob([plier(L).join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d0 = dateDuJour(semaineCourante, 0);
  a.download = "menu-" + d0.getUTCFullYear() + "-" + pad(d0.getUTCMonth() + 1) + "-" + pad(d0.getUTCDate()) + ".ics";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast("Calendrier exporté");
}

function repliable(titre, remplir) {
  const d = document.createElement("details");

}
