    d.onclick = async () => { await effacerPhoto(r.id); toast("Photo retirée"); if (apres) apres(); };
    barre.appendChild(d);
  }
  return barre;
}

/* ==================================================================
   MINUTEURS  —  ils tournent tant que l'application est ouverte
   ================================================================== */
let minuteurs = [];
let tickId = null;

// durées repérées dans une étape : « 25 min », « 1 h », « 1 h 15 »
function dureesEtape(txt) {
  const out = [];
  const re = /(\d+)\s*h(?:\s*(\d+))?|(\d+)\s*(?:min|minutes)/gi;
  let m;
  while ((m = re.exec(txt))) {
    if (m[1] !== undefined) out.push(Number(m[1]) * 3600 + (Number(m[2]) || 0) * 60);
    else out.push(Number(m[3]) * 60);
  }
  return out.filter(s => s >= 60 && s <= 4 * 3600);
}

function lancerMinuteur(nom, secondes) {
  if (window.Notification && Notification.permission === "default") Notification.requestPermission();
  minuteurs.push({ id: Date.now() + Math.random(), nom, fin: Date.now() + secondes * 1000 });
  if (!tickId) tickId = setInterval(tick, 1000);
  majBandeau();
  toast(nom + " · " + Math.round(secondes / 60) + " min");
}

function tick() {
  const t = Date.now();
  const finis = minuteurs.filter(m => m.fin <= t);
  minuteurs = minuteurs.filter(m => m.fin > t);
  for (const m of finis) sonner(m.nom);
  if (!minuteurs.length) { clearInterval(tickId); tickId = null; }
  majBandeau();
}

function sonner(nom) {
  if (navigator.vibrate) navigator.vibrate([400, 150, 400]);
  try {
    if (window.Notification && Notification.permission === "granted") {
      new Notification(trad("C'est prêt"), { body: nom, icon: "icon-192.png", tag: "minuteur" });
    }
  } catch (e) {}
  toast(trad("C'est prêt") + " : " + nom, 8000);
}

function mmss(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(x).padStart(2, "0");
}

function majBandeau() {
  const z = $("#minuteurs");
  if (!z) return;
  z.innerHTML = "";
  z.classList.toggle("visible", minuteurs.length > 0);
  for (const m of minuteurs.slice().sort((a, b) => a.fin - b.fin)) {
    const li = el("div", "minuteur");
    li.appendChild(el("span", "minuteur-nom", m.nom));
    li.appendChild(el("strong", "minuteur-temps", mmss((m.fin - Date.now()) / 1000)));
    const x = el("button", "minuteur-stop", "×");
    x.onclick = () => { minuteurs = minuteurs.filter(o => o.id !== m.id); majBandeau(); };
    li.appendChild(x);
    z.appendChild(li);
  }
}

/* ==================================================================
   EXPORT CALENDRIER  —  un .ics que l'agenda du téléphone sait lire
   ================================================================== */
function pad(n) { return String(n).padStart(2, "0"); }
function stampUTC(d) {
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" +
         pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00Z";
}
function echapIcs(s) { return String(s).replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n"); }

// heure « flottante » : pas de Z, pas de fuseau. L'agenda l'affiche dans l'heure
// locale du téléphone, ce qui est exactement ce qu'on veut ici.
function stampLocal(d) {
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" +
         pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + "00";
}

// RFC 5545 : les lignes se replient à 75 octets, la suite commence par une espace
function plier(lignes) {
  const out = [];
  for (const l of lignes) {
    if (l.length <= 70) { out.push(l); continue; }
    out.push(l.slice(0, 70));
    let reste = l.slice(70);
    while (reste.length) { out.push(" " + reste.slice(0, 69)); reste = reste.slice(69); }
  }
  return out;
}

// un moment de cuisine vers une date réelle
function dateMoment(idxSem, moment) {
  const r = state.reglages;
  const jour = moment === -1 ? -1 : Math.floor(moment / 2);
  const midi = moment !== -1 && moment % 2 === 0;
  const d = new Date(dateDuJour(idxSem, Math.max(0, jour)).getTime());
  if (jour === -1) d.setUTCDate(d.getUTCDate() - 1);
  const [h, mn] = (midi ? r.heureMidi : r.heureSoir).split(":").map(Number);
  d.setUTCHours(h, mn, 0, 0);
  return d;
}

function exporterIcs() {
  const plan = state.plans[semaineCourante];
  if (!plan) { toast("Générez d'abord un menu."); return; }
  const r = state.reglages;
  const L = [];
  L.push("BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//menu-semaine//FR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH");

  const ajouter = (debut, minutes, titre, desc, alarmeMin) => {
    const fin = new Date(debut.getTime() + minutes * 60000);
    L.push("BEGIN:VEVENT",
      "UID:" + Math.random().toString(36).slice(2) + "@menu-semaine",
      "DTSTAMP:" + stampUTC(new Date()),
      "DTSTART:" + stampLocal(debut),
      "DTEND:" + stampLocal(fin),
      "SUMMARY:" + echapIcs(titre),
      "DESCRIPTION:" + echapIcs(desc),
      "BEGIN:VALARM", "TRIGGER:-PT" + alarmeMin + "M", "ACTION:DISPLAY",
      "DESCRIPTION:" + echapIcs(titre), "END:VALARM",
      "END:VEVENT");
  };

  // les courses
  const parRayon = listeCourses(plan);
  let liste = "";
  for (const ray of ORDRE_RAYONS) {
    if (!parRayon[ray]) continue;
    liste += trad(RAYONS[ray]) + "\n";
    for (const a of parRayon[ray]) liste += "- " + trad(a.n) + " : " + formatQte(a, true) + "\n";
  }
  const dCourses = new Date(dateDuJour(semaineCourante, r.jourCourses).getTime());
  const [hc, mc] = r.heureCourses.split(":").map(Number);
  dCourses.setUTCHours(hc, mc, 0, 0);
  ajouter(dCourses, 60, trad("Courses de la semaine") + " · " + euros(coutSemaine(plan)), liste, 60);

  // une entrée par séance de cuisine
  const actives = plan.sessions.map((s, k) => ({ s, k })).filter(o => sessionActive(plan, o.k, false));
  const moments = [...new Set(actives.map(o => o.s.moment))].sort((a, b) => a - b);
  for (const m of moments) {
    const plats = actives.filter(o => o.s.moment === m)
      .map(o => state.recettes.find(x => x.id === o.s.recetteId)).filter(Boolean);
    const jour = m === -1 ? -1 : Math.floor(m / 2);
    const desserts = (plan.sessionsDessert || []).map((s, k) => ({ s, k }))
      .filter(o => o.s.jour === jour && sessionActive(plan, o.k, true))
      .map(o => state.recettes.find(x => x.id === o.s.recetteId)).filter(Boolean);
    const tous = [...plats, ...desserts];
    if (!tous.length) continue;
    const duree = Math.max(...tous.map(x => x.minutes));
    const mat = materielSeance(plan, m);
    const desc = tous.map(x => "• " + trad(x.nom) + " (" + x.minutes + " min)").join("\n") +
      (mat.length ? "\n\n" + trad("Matériel") + " : " + mat.map(trad).join(", ") : "");
    ajouter(dateMoment(semaineCourante, m), duree,
      trad("Cuisine") + " · " + tous.map(x => trad(x.nom)).join(", "), desc, r.alerteCuisine);
  }

  L.push("END:VCALENDAR");
  const blob = new Blob([plier(L).join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d0 = dateDuJour(semaineCourante, 0);
  a.download = "menu-" + d0.getUTCFullYear() + "-" + pad(d0.getUTCMonth() + 1) + "-" + pad(d0.getUTCDate()) + ".ics";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast("Calendrier exporté");
}

/* ==================================================================
   NORMALISATION
   Tout ce qui entre dans le pool passe par ici : import, IA, édition.
   ================================================================== */
const UNITES_OK = ["g", "kg", "ml", "cl", "l", "pièce", "gousse", "cube", "bouquet", "tranche", "pincée", "c.à.s", "c.à.c"];
const BASES_OK = ["boeuf", "volaille", "porc", "agneau", "poisson", "fruitsdemer", "legumineuse",
  "legume", "oeuf", "pates", "riz", "tofu", "cereale", "chocolat", "fruit", "creme", "patisserie"];
const TRAITS_OK = ["epice", "mijote", "four", "fromage", "soupe", "salade", "froid", "rapide",
  "legumes", "long", "sucresale", "cru", "patisserie", "fruit", "creme", "chocolat"];

// catégorie d'illustration -> rayon, pour deviner le rayon d'un ingrédient inconnu
const CAT_RAYON = {
  poisson: "viande", viandeRouge: "viande", volaille: "viande", porc: "viande", fruitsDeMer: "viande",
  laitage: "cremerie", fromage: "cremerie", oeuf: "cremerie", pate: "cremerie",
  racine: "legumes", feuille: "legumes", legumeFruit: "legumes", oignon: "legumes",
  champignon: "legumes", agrume: "legumes", fruit: "legumes", herbe: "legumes",
  pates: "epicerie", cereale: "epicerie", legumineuse: "epicerie", conserve: "epicerie",
  epice: "epicerie", liquide: "epicerie", farine: "epicerie", chocolat: "epicerie", noix: "epicerie",
  pain: "boulangerie"
};

function rayonDe(nom) { return CAT_RAYON[icone(nom, null)] || "epicerie"; }

// « oignons » -> « oignon » si le singulier est connu
function normaliserNom(n) {
  const base = (n || "").trim().toLowerCase().replace(/\s+/g, " ");
  const essais = [];
  for (const v of [base, base.replace(/oe/g, "œ"), base.replace(/œ/g, "oe")]) {
    essais.push(v);
    if (v.endsWith("s") || v.endsWith("x")) essais.push(v.slice(0, -1));
  }
  for (const e of essais) if (prixConnu(e)) return e;
  return base;
}

function normaliserRecette(x, prefixe) {
  const avis = [];
  const r = {
    id: (prefixe || "u") + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
    nom: String(x.nom || "").trim() || "Sans titre",
    categorie: x.categorie === "dessert" ? "dessert" : "plat",
    base: BASES_OK.indexOf(x.base) >= 0 ? x.base : null,
    cuisine: CUISINES.indexOf(x.cuisine) >= 0 ? x.cuisine : "francaise",
    traits: Array.isArray(x.traits) ? x.traits.filter(t => TRAITS_OK.indexOf(t) >= 0) : [],
    batch: Math.max(1, Math.min(12, Math.round(Number(x.batch) || 2))),
    keeps: Math.max(1, Math.min(10, Math.round(Number(x.keeps) || 3))),
    minutes: Math.max(5, Math.min(300, Math.round(Number(x.minutes) || 30))),
    froid: !!x.froid, veg: !!x.veg,
    ing: [], etapes: []
  };
  if (!r.base) { r.base = "legume"; avis.push("base inconnue, mise sur « legume »"); }
  if (x.nom === undefined || !String(x.nom).trim()) avis.push("titre manquant");

  for (const i of (Array.isArray(x.ing) ? x.ing : [])) {
    const nom = normaliserNom(i.n);
    if (!nom) continue;
    let u = String(i.u || "").trim();
    if (UNITES_OK.indexOf(u) < 0) { u = "pièce"; }
    const q = Number(String(i.q).replace(",", "."));
    const ray = ORDRE_RAYONS.indexOf(i.r) >= 0 ? i.r : rayonDe(nom);
    r.ing.push({ n: nom, q: isFinite(q) && q > 0 ? q : 1, u, r: ray });
    if (!prixConnu(nom)) avis.push("prix inconnu : " + nom);
  }
  if (!r.ing.length) avis.push("aucun ingrédient");

  for (const e of (Array.isArray(x.etapes) ? x.etapes : [])) {
    const t = String(e).trim();
    if (t) r.etapes.push(t);
  }
  if (!r.etapes.length) avis.push("aucune étape");
  if (r.veg && r.ing.some(i => i.r === "viande")) avis.push("marquée végétarienne mais contient de la viande");

  return { r, avis };
}

/* ==================================================================
   IMPORT DEPUIS UN TEXTE COLLÉ
   Analyse locale, sans réseau. Le résultat passe toujours par
   l'éditeur avant d'entrer dans le pool.
   ================================================================== */
// unités reconnues en tête de reste, après la quantité. L'ordre compte : kg avant g, cl avant l.
const UNITES_TETE = [
  [/^(kg|kilos?|kilogrammes?)\b\.?/i, "kg"],
  [/^(g|gr|grammes?)\b\.?/i, "g"],
  [/^(ml|millilitres?)\b\.?/i, "ml"],
  [/^(cl|centilitres?)\b\.?/i, "cl"],
  [/^(l|litres?)\b\.?/i, "l"],
  [/^(c\.?\s*à\.?\s*s\.?|cuill?[eè]res?\s*à\s*soupe|càs|cas)\.?/i, "c.à.s"],
  [/^(c\.?\s*à\.?\s*c\.?|cuill?[eè]res?\s*à\s*caf[eé]|càc|cac)\.?/i, "c.à.c"],
  [/^(gousses?)\b\.?/i, "gousse"],
  [/^(pinc[eé]es?)\b\.?/i, "pincée"],
  [/^(tranches?)\b\.?/i, "tranche"],
  [/^(bottes?|bouquets?|brins?)\b\.?/i, "bouquet"],
  [/^(sachets?|bo[iî]tes?|cubes?)\b\.?/i, "cube"]
];

// une ligne d'ingrédient -> {n, q, u, r}, ou null si ce n'en est pas une
function analyserLigneIng(ligne) {
  const m = ligne.match(/^[-–—•*]?\s*(\d+(?:[.,]\d+)?)\s*(.+)$/);
  if (!m) return null;
  const q = Number(m[1].replace(",", "."));
  if (!isFinite(q) || q <= 0) return null;

  let reste = m[2].trim(), u = null;
  for (const [re, unite] of UNITES_TETE) {
    const t = reste.match(re);
    if (t) { u = unite; reste = reste.slice(t[0].length).trim(); break; }
  }
  reste = reste
    .replace(/^(?:de\s+la\s+|de\s+l'|du\s+|des\s+|de\s+|d')/i, "")
    .replace(/\(.*?\)/g, "")
    .replace(/[,;.]+$/, "")
    .trim();
  if (reste.length < 2 || reste.length > 45) return null;

  const n = normaliserNom(reste);
  return { n, q, u: u || "pièce", r: rayonDe(n) };
}

function analyserTexte(txt) {
  const lignes = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const ing = [], etapes = [];
  let titre = "", minutes = null, portions = null, section = null;

  const reTemps = /(\d+)\s*(?:min|minutes)/i;
  const rePort = /(?:pour|sert|serves)\s*(\d+)\s*(?:personnes?|parts?|portions?)/i;

  for (const l of lignes) {
    const bas = l.toLowerCase();
    if (/^(ingr[eé]dients?|pour la garniture|liste des courses)\b/.test(bas)) { section = "ing"; continue; }
    if (/^(pr[eé]paration|instructions?|[eé]tapes?|m[eé]thode|r[eé]alisation)\b/.test(bas)) { section = "etapes"; continue; }

    const p = l.match(rePort); if (p && portions === null) portions = Number(p[1]);
    const t = l.match(reTemps); if (t && minutes === null && l.length < 70) minutes = Number(t[1]);

    const candidat = (section !== "etapes" && l.length <= 70) ? analyserLigneIng(l) : null;
    if (candidat) { ing.push(candidat); continue; }

    if (!titre && l.length <= 80 && !/\d\s*(min|personne|portion)/i.test(l)) {
      titre = l.replace(/[:•\-–]+$/, "").trim();
      continue;
    }
    if (l.length > 25 || section === "etapes") etapes.push(l.replace(/^\d+[).\s]+/, "").trim());
  }

  // ingrédients identiques fusionnés
  const fusion = [];
  for (const i of ing) {
    const d = fusion.find(x => x.n === i.n && x.u === i.u);
    if (d) d.q += i.q; else fusion.push(i);
  }

  return normaliserRecette({
    nom: titre, batch: portions || 2, minutes: minutes || 30, keeps: 3,
    ing: fusion, etapes, traits: (minutes || 30) <= 30 ? ["rapide"] : []
  }, "imp");
}

/* --- import depuis une adresse : marche si le site autorise le navigateur --- */
async function analyserUrl(url) {
  const rep = await fetch(url, { mode: "cors" });
  if (!rep.ok) throw new Error("HTTP " + rep.status);
  const html = await rep.text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  let recette = null;
  for (const s of doc.querySelectorAll('script[type="application/ld+json"]')) {
    let d;
    try { d = JSON.parse(s.textContent); } catch (e) { continue; }
    const pile = Array.isArray(d) ? d.slice() : [d];
    while (pile.length) {
      const o = pile.shift();
      if (!o || typeof o !== "object") continue;
      if (o["@graph"]) pile.push(...o["@graph"]);
      const t = o["@type"];
      if (t === "Recipe" || (Array.isArray(t) && t.indexOf("Recipe") >= 0)) { recette = o; break; }
    }
    if (recette) break;
  }
  if (!recette) throw new Error("aucune recette balisée sur cette page");

  const etapes = [];
  const ajouter = x => {
    if (!x) return;
    if (typeof x === "string") etapes.push(x.trim());
    else if (Array.isArray(x)) x.forEach(ajouter);
    else if (x.text) etapes.push(String(x.text).trim());
    else if (x.itemListElement) ajouter(x.itemListElement);
  };
  ajouter(recette.recipeInstructions);

  const ing = [];
  for (const l of (recette.recipeIngredient || [])) {
    const a = analyserTexte("X\nIngrédients\n" + l);
    if (a.r.ing.length) ing.push(a.r.ing[0]);
  }
  const duree = String(recette.totalTime || recette.cookTime || "").match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
  const minutes = duree ? (Number(duree[1] || 0) * 60 + Number(duree[2] || 0)) || 30 : 30;

  return normaliserRecette({
    nom: recette.name, batch: Number(recette.recipeYield) || 2,
    minutes, keeps: 3, ing, etapes
  }, "imp");
}

/* --- import assisté par l'IA, plus fiable sur un texte désordonné --- */
async function analyserParIA(txt) {
  const cle = state.reglages.cle;
  if (!cle) throw new Error("aucune clé API");
  const rep = await appelIA(
    "Convertis cette recette en JSON, sans rien inventer. Garde les unités métriques.\n" +
    schemaIA(1) + "\n\nRecette :\n" + txt.slice(0, 12000), 2000);
  const arr = JSON.parse(rep);
  return normaliserRecette(Array.isArray(arr) ? arr[0] : arr, "imp");
}

/* ==================================================================
   APPEL À L'API
   ================================================================== */
function schemaIA(n) {
  return "Réponds uniquement par un tableau JSON de " + n + " objet(s), sans texte ni balises autour :\n" +
    '[{"nom":"...","categorie":"plat|dessert","base":"' + BASES_OK.join("|") + '",' +
    '"cuisine":"' + CUISINES.join("|") + '","traits":["' + TRAITS_OK.slice(0, 6).join('","') + '"],' +
    '"batch":2,"keeps":3,"minutes":30,"froid":true,"veg":false,' +
    '"ing":[{"n":"oignon","q":2,"u":"pièce","r":"legumes"}],"etapes":["...","..."]}]\n' +
    'Unités autorisées : ' + UNITES_OK.join(", ") + '. Rayons : ' + ORDRE_RAYONS.join(", ") + '. ' +
    'Traits autorisés : ' + TRAITS_OK.join(", ") + '.';
}

async function appelIA(prompt, maxTokens) {
  const r = state.reglages;
  const rep = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json", "x-api-key": r.cle,
      "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: r.modele, max_tokens: maxTokens || 8000, messages: [{ role: "user", content: prompt }] })
  });
  if (!rep.ok) throw new Error("API " + rep.status + " : " + (await rep.text()).slice(0, 120));
  const d = await rep.json();
  return d.content.map(b => b.type === "text" ? b.text : "").join("")
    .replace(/```json/g, "").replace(/```/g, "").trim();
}

/* ==================================================================
   INTERFACE D'IMPORT
   ================================================================== */
function ouvrirImport() {
  const carte = feuille("Importer une recette");
  carte.appendChild(el("p", "petit", "Collez le texte d'une recette, ou son adresse. Vous relisez et corrigez avant qu'elle rejoigne le pool."));

  const ta = el("textarea", "editeur");
  ta.placeholder = "Tarte aux poireaux\nPour 4 personnes · 45 min\n\nIngrédients\n3 poireaux\n200 g de crème fraîche\n3 œufs\n\nPréparation\nÉmincer les poireaux et les faire fondre 15 min.\n…";
  carte.appendChild(ta);

  const url = el("input", "champ-texte");
  url.type = "url"; url.placeholder = "https://… (adresse d'une recette)";
  carte.appendChild(url);

  const finir = (res) => {
    fermerModale();
    editerProposition(res.r, res.avis);
  };

  const b1 = el("button", "cta", "Analyser le texte");
  b1.onclick = () => {
    if (!ta.value.trim()) { toast("Collez d'abord une recette."); return; }
    finir(analyserTexte(ta.value));
  };
  carte.appendChild(b1);

  if (state.reglages.cle) {
    const b2 = el("button", "cta-secondaire", "Analyser avec l'IA");
    b2.onclick = async () => {
      if (!ta.value.trim()) { toast("Collez d'abord une recette."); return; }
      toast("Analyse en cours…", 60000);
      try { finir(await analyserParIA(ta.value)); }
      catch (e) { toast("Échec : " + e.message); }
    };
    carte.appendChild(b2);
  }

  const b3 = el("button", "cta-secondaire", "Depuis une adresse");
  b3.onclick = async () => {
    if (!url.value.trim()) { toast("Entrez une adresse."); return; }
    toast("Lecture de la page…", 30000);
    try { finir(await analyserUrl(url.value.trim())); }
    catch (e) {
      toast("Page illisible depuis le navigateur. Copiez son texte dans le cadre.", 6000);
    }
  };
  carte.appendChild(b3);

  const b4 = el("button", "cta-secondaire", "Annuler");
  b4.onclick = fermerModale;
  carte.appendChild(b4);
}

function editerProposition(r, avis) {
  const carte = feuille("Relire avant d'ajouter");
  if (avis && avis.length) {
    const n = el("div", "note");
    n.textContent = trad("À vérifier") + " : " + avis.join(" · ");
    carte.appendChild(n);
  }
  carte.appendChild(el("p", "petit", "batch = portions correspondant aux quantités. Rayons : " + ORDRE_RAYONS.join(", ") + "."));
  const ta = el("textarea", "editeur");
  ta.value = JSON.stringify(r, null, 2);
  carte.appendChild(ta);

  const ok = el("button", "cta", "Ajouter au pool");
  ok.onclick = () => {
    try {
      const o = JSON.parse(ta.value);
      const { r: propre } = normaliserRecette(o, "imp");
      propre.id = o.id || propre.id;
      propre.modifie = true;
      state.recettes.push(propre);
      sauver(); fermerModale(); onglet = "recettes"; rendre();
      toast("Recette ajoutée");
    } catch (e) { toast("JSON invalide : " + e.message); }
  };
  carte.appendChild(ok);
  const an = el("button", "cta-secondaire", "Annuler");
  an.onclick = fermerModale;
  carte.appendChild(an);
}

/* ==================================================================
   GÉNÉRATION EN LOT + ÉCRAN DE RELECTURE
   ================================================================== */
let revueIA = null;

async function proposerParIA() {
  if (!state.reglages.cle) { onglet = "reglages"; rendre(); toast("Renseignez d'abord une clé API."); return; }
  const total = Math.max(1, Math.min(60, state.reglages.nbIA || 20));
  const noms = state.recettes.map(r => r.nom).join(" ; ");
  const brut = [];

  try {
    for (let fait = 0; fait < total; fait += 10) {
      const n = Math.min(10, total - fait);
      toast("Génération… " + fait + " / " + total, 120000);
      const prompt =
        "Tu écris des recettes originales pour une application de menu hebdomadaire, en français, " +
        "pour quelqu'un qui cuisine en France et fait ses courses chez Grand Frais, Carrefour et Auchan.\n" +
        "Format visé : deux portions, ingrédients courants et déjà portionnés.\n" +
        "Les étapes doivent être DÉTAILLÉES : 6 à 8 étapes, la préparation séparée de la cuisson, " +
        "le niveau de feu précisé, un repère visuel de cuisson quand c'est utile (« jusqu'à ce que les bords se décollent »), " +
        "et une durée explicite à chaque étape de cuisson. Une étape fait une à deux phrases.\n" +
        "N'imite aucune marque ni aucun texte existant : écris tes propres recettes." +
        resumeProfil() + "\n" +
        "Ne propose aucune de ces recettes déjà présentes : " + noms + "\n\n" + schemaIA(n);
      const txt = await appelIA(prompt, 12000);
      const arr = JSON.parse(txt);
      if (Array.isArray(arr)) brut.push(...arr);
    }
  } catch (e) {
    toast("Échec : " + e.message, 6000);
    if (!brut.length) return;
  }

  const connus = new Set(state.recettes.map(r => r.nom.toLowerCase()));
  revueIA = [];
  for (const x of brut) {
    const { r, avis } = normaliserRecette(x, "ia");
    if (connus.has(r.nom.toLowerCase())) { avis.push("déjà dans le pool"); }
    connus.add(r.nom.toLowerCase());
    revueIA.push({ r, avis, garder: avis.length === 0 });
  }
  recetteOuverte = null; ecranQuiz = null;
  rendre();
  toast(revueIA.length + " recettes à relire");
}

function rendreRevue(vue) {
  const ret = el("button", "retour", "‹ Annuler");
  ret.onclick = () => { revueIA = null; rendre(); };
  vue.appendChild(ret);

  vue.appendChild(el("h2", "fiche-titre", "Recettes proposées"));
  const n = revueIA.filter(p => p.garder).length;
  vue.appendChild(el("div", "petit", n + " " + trad("sur") + " " + revueIA.length + " " + trad("sélectionnées") + ". " +
    trad("Rien n'entre dans le pool avant que vous validiez.")));

  const barre = el("div", "barre");
  const bt = el("button", "cta-secondaire", n === revueIA.length ? "Tout décocher" : "Tout cocher");
  bt.onclick = () => { const v = n !== revueIA.length; revueIA.forEach(p => p.garder = v); rendre(); };
  barre.appendChild(bt);
  const ba = el("button", "cta", "Ajouter la sélection");
  ba.onclick = () => {
    const gardees = revueIA.filter(p => p.garder).map(p => p.r);
    state.recettes.push(...gardees);
    revueIA = null; sauver(); onglet = "recettes"; rendre();
    toast(gardees.length + " recettes ajoutées");
  };
  barre.appendChild(ba);
  vue.appendChild(barre);

  for (const p of revueIA) {
    const bloc = el("div", "proposition" + (p.garder ? " gardee" : ""));
    const tete = el("div", "prop-tete");
    tete.appendChild(el("span", "case", p.garder ? "✓" : ""));
    const t = el("div", "prop-txt");
    t.appendChild(el("div", "recette-nom", p.r.nom));
    t.appendChild(el("div", "petit", [
      p.r.minutes + " min", p.r.batch + " " + trad("portions"),
      euros(coutRecette(p.r, 1) / p.r.batch) + "/" + trad("portion"),
      NOM_CUISINE[p.r.cuisine] || p.r.cuisine
    ].join(" · ")));
    if (p.avis.length) t.appendChild(el("div", "prop-avis", trad("À vérifier") + " : " + p.avis.join(" · ")));
    tete.appendChild(t);
    tete.onclick = () => { p.garder = !p.garder; rendre(); };
    bloc.appendChild(tete);

    bloc.appendChild(repliable("Voir le détail", corps => {
      const ul = el("div", "ing-liste");
      for (const i of p.r.ing) {
        const li = el("div", "ing");
        li.appendChild(el("span", "ing-nom", i.n));
        li.appendChild(el("span", "ing-qte", formatQte(i, false)));
        ul.appendChild(li);
      }
      corps.appendChild(ul);
      const ol = el("ol", "etapes");
      for (const e of p.r.etapes) ol.appendChild(el("li", null, e));
      corps.appendChild(ol);
      const bE = el("button", "cta-secondaire", "Modifier");
      bE.onclick = () => editerProposition(p.r, p.avis);
      corps.appendChild(bE);
    }));
    vue.appendChild(bloc);
  }
}
